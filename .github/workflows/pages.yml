name: Build and deploy Hugo

on:
  push:
    branches: [main, "migration/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.169.0"
  DART_SASS_VERSION: "1.108.2"
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install pinned Hugo and Dart Sass
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/blog-tools"
          cd "${RUNNER_TEMP}/blog-tools"
          curl --fail --location --retry 3 --output hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "c41672a0725d307758a132bc94a962e59760eb33f9ba08c991b81f9881d6fa7d  hugo.tar.gz" | sha256sum --check
          tar -xzf hugo.tar.gz
          curl --fail --location --retry 3 --output sass.tar.gz "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "32d2eb5b83cbc180fce9657ff3c57401a9006c59eccfe0bfdde0aa755a66d42f  sass.tar.gz" | sha256sum --check
          tar -xzf sass.tar.gz
          echo "${RUNNER_TEMP}/blog-tools" >> "${GITHUB_PATH}"
          echo "${RUNNER_TEMP}/blog-tools/dart-sass" >> "${GITHUB_PATH}"
      - name: Build
        run: |
          hugo version
          sass --version
          hugo --gc --minify --panicOnWarning
      - name: Verify migration and local links
        run: python3 scripts/verify_site.py
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1

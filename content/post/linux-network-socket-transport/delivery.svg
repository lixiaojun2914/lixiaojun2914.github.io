<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="t d"><title id="t">三个交付时刻，三个不同保证</title><desc id="d">应用提交成功、远端协议确认和远端应用读取并非同一事件。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="340" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">三个交付时刻，三个不同保证</text><rect x="40" y="110" width="260" height="130" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="58" y="141" font-size="19" fill="#2765b1">1 本地接受</text><text x="58" y="168" font-size="16" fill="#53647b">write 返回 k</text><text x="58" y="192" font-size="16" fill="#53647b">本机接受 k 字节</text><rect x="370" y="110" width="260" height="130" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="388" y="141" font-size="19" fill="#23775b">2 对端确认</text><text x="388" y="168" font-size="16" fill="#53647b">ACK 推进</text><text x="388" y="192" font-size="16" fill="#53647b">对端 TCP 已确认</text><rect x="700" y="110" width="260" height="130" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="718" y="141" font-size="19" fill="#ad641b">3 应用消费</text><text x="718" y="168" font-size="16" fill="#53647b">read 返回 k</text><text x="718" y="192" font-size="16" fill="#53647b">业务处理仍需自己确认</text><path d="M300 175 L370 175" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M630 175 L700 175" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="45" y="292" font-size="16" fill="#53647b">时间向右；第二、三阶段可在发送端调用返回之后发生。</text></g></svg>
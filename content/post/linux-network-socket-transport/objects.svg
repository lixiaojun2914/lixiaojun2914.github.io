<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="t d"><title id="t">socket 对象与协议状态</title><desc id="d">fd 经打开文件对象定位 socket；sock 与协议扩展管理队列、连接及等待。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="570" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">socket 对象与协议状态</text><rect x="50" y="100" width="190" height="80" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="68" y="131" font-size="19" fill="#2765b1">fd → file</text><rect x="340" y="100" width="250" height="130" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="358" y="131" font-size="19" fill="#2765b1">struct socket</text><text x="358" y="158" font-size="16" fill="#53647b">sk / ops / wq</text><rect x="690" y="100" width="260" height="130" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="708" y="131" font-size="19" fill="#23775b">struct sock</text><text x="708" y="158" font-size="16" fill="#53647b">协议状态与队列</text><path d="M240 140 L340 140" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M590 140 L690 140" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="648.0" y="130.0" font-size="14" fill="#53647b">sk</text><rect x="100" y="340" width="330" height="120" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="118" y="371" font-size="19" fill="#ad641b">TCP 发送侧</text><text x="118" y="398" font-size="16" fill="#53647b">内存限制、序号、待发/重传</text><text x="118" y="422" font-size="16" fill="#53647b">接受字节 ≠ 已被远端消费</text><rect x="570" y="340" width="330" height="120" rx="12" fill="#f2edfc" stroke="#7450ac" stroke-width="1.5"/><text x="588" y="371" font-size="19" fill="#7450ac">接收侧与等待者</text><text x="588" y="398" font-size="16" fill="#53647b">可交付数据、读取进度</text><text x="588" y="422" font-size="16" fill="#53647b">就绪通知 → 调度 → read</text><path d="M780 230 L780 340" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M720 230 L270 340" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="50" y="525" font-size="16" fill="#53647b">dup 共享打开实例，也共享同一连接和队列；不是复制一套 TCP。</text></g></svg>
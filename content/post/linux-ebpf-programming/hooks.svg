<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#556"/>
    </marker>
  </defs>

  <text x="30" y="24" font-size="13" font-weight="600" fill="#334">发送方向（本机进程 → 网卡）</text>

  <rect x="30" y="42" width="130" height="56" rx="6" fill="#eef4fb" stroke="#7aa7cc"/>
  <text x="95" y="66" text-anchor="middle">应用 sendmsg</text>
  <text x="95" y="84" text-anchor="middle" font-size="11" fill="#556">进程上下文</text>

  <rect x="200" y="42" width="110" height="56" rx="6" fill="#e8f5ee" stroke="#79b894"/>
  <text x="255" y="66" text-anchor="middle">sk_msg</text>
  <text x="255" y="84" text-anchor="middle" font-size="10" fill="#556">重定向到别的 socket</text>

  <rect x="350" y="42" width="120" height="56" rx="6" fill="#eef4fb" stroke="#7aa7cc"/>
  <text x="410" y="66" text-anchor="middle">TCP / IP</text>
  <text x="410" y="84" text-anchor="middle" font-size="11" fill="#556">分段、校验和</text>

  <rect x="510" y="42" width="120" height="56" rx="6" fill="#e8f5ee" stroke="#79b894"/>
  <text x="570" y="66" text-anchor="middle">tc egress</text>
  <text x="570" y="84" text-anchor="middle" font-size="11" fill="#556">qdisc / clsact</text>

  <rect x="670" y="42" width="150" height="56" rx="6" fill="#eef4fb" stroke="#7aa7cc"/>
  <text x="745" y="66" text-anchor="middle">驱动 → 网卡</text>
  <text x="745" y="84" text-anchor="middle" font-size="11" fill="#556">DMA</text>

  <line x1="160" y1="70" x2="195" y2="70" stroke="#556" marker-end="url(#c)"/>
  <line x1="310" y1="70" x2="345" y2="70" stroke="#556" marker-end="url(#c)"/>
  <line x1="470" y1="70" x2="505" y2="70" stroke="#556" marker-end="url(#c)"/>
  <line x1="630" y1="70" x2="665" y2="70" stroke="#556" marker-end="url(#c)"/>

  <text x="30" y="238" font-size="13" font-weight="600" fill="#334">接收方向（网卡 → 对端进程）</text>

  <rect x="670" y="256" width="150" height="56" rx="6" fill="#eef4fb" stroke="#7aa7cc"/>
  <text x="745" y="280" text-anchor="middle">网卡 → 驱动</text>
  <text x="745" y="298" text-anchor="middle" font-size="11" fill="#556">DMA 环形缓冲</text>

  <rect x="530" y="256" width="110" height="56" rx="6" fill="#e8f5ee" stroke="#79b894"/>
  <text x="585" y="280" text-anchor="middle">XDP</text>
  <text x="585" y="298" text-anchor="middle" font-size="11" fill="#556">裸帧，未建 skb</text>

  <rect x="380" y="256" width="120" height="56" rx="6" fill="#e8f5ee" stroke="#79b894"/>
  <text x="440" y="280" text-anchor="middle">tc ingress</text>
  <text x="440" y="298" text-anchor="middle" font-size="11" fill="#556">已有 skb</text>

  <rect x="230" y="256" width="120" height="56" rx="6" fill="#eef4fb" stroke="#7aa7cc"/>
  <text x="290" y="280" text-anchor="middle">IP / TCP</text>
  <text x="290" y="298" text-anchor="middle" font-size="11" fill="#556">找 socket</text>

  <rect x="60" y="256" width="140" height="56" rx="6" fill="#e8f5ee" stroke="#79b894"/>
  <text x="130" y="276" text-anchor="middle">sk_skb verdict</text>
  <text x="130" y="294" text-anchor="middle" font-size="11" fill="#556">SK_PASS / SK_DROP</text>
  <text x="130" y="308" text-anchor="middle" font-size="10" fill="#666">（数据先进接收队列）</text>

  <line x1="665" y1="284" x2="645" y2="284" stroke="#556" marker-end="url(#c)"/>
  <line x1="525" y1="284" x2="505" y2="284" stroke="#556" marker-end="url(#c)"/>
  <line x1="375" y1="284" x2="355" y2="284" stroke="#556" marker-end="url(#c)"/>
  <line x1="225" y1="284" x2="205" y2="284" stroke="#556" marker-end="url(#c)"/>

  <line x1="745" y1="100" x2="745" y2="251" stroke="#b06a6a" stroke-width="2" marker-end="url(#c)"/>
  <text x="752" y="180" font-size="11" fill="#b06a6a">报文离开本机</text>

  <rect x="60" y="130" width="200" height="56" rx="6" fill="#f6f1e8" stroke="#c2a878" stroke-dasharray="4 3"/>
  <text x="160" y="152" text-anchor="middle" font-size="12">cgroup/connect4</text>
  <text x="160" y="170" text-anchor="middle" font-size="11" fill="#556">connect() 之前，只看地址</text>
  <line x1="120" y1="186" x2="100" y2="102" stroke="#c2a878" stroke-dasharray="4 3" marker-end="url(#c)"/>

  <text x="30" y="386" font-size="11" fill="#777">越靠近应用，上下文越多、下手越晚；越靠近硬件，能拦的越早、知道的越少。</text>
</svg>

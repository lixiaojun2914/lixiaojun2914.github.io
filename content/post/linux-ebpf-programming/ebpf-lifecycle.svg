<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#556"/>
    </marker>
  </defs>
  <text x="20" y="24" font-size="14" font-weight="600" fill="#223">用户态</text>
  <text x="20" y="196" font-size="14" font-weight="600" fill="#223">内核态</text>
  <line x1="20" y1="170" x2="840" y2="170" stroke="#bbb" stroke-dasharray="6 4"/>

  <rect x="20" y="40" width="150" height="60" rx="6" fill="#eef4fb" stroke="#7aa7cc"/>
  <text x="95" y="66" text-anchor="middle">C 源码</text>
  <text x="95" y="84" text-anchor="middle" font-size="11" fill="#556">SEC("xdp") …</text>

  <rect x="210" y="40" width="150" height="60" rx="6" fill="#eef4fb" stroke="#7aa7cc"/>
  <text x="285" y="66" text-anchor="middle">clang -target bpf</text>
  <text x="285" y="84" text-anchor="middle" font-size="11" fill="#556">.bpf.o（ELF + BTF）</text>

  <rect x="400" y="40" width="150" height="60" rx="6" fill="#eef4fb" stroke="#7aa7cc"/>
  <text x="475" y="66" text-anchor="middle">加载器</text>
  <text x="475" y="84" text-anchor="middle" font-size="11" fill="#556">bpftool / libbpf</text>

  <rect x="590" y="40" width="120" height="60" rx="6" fill="#f6f1e8" stroke="#c2a878"/>
  <text x="650" y="66" text-anchor="middle">用户态 map 操作</text>
  <text x="650" y="84" text-anchor="middle" font-size="11" fill="#556">bpf_map_lookup</text>

  <rect x="400" y="120" width="150" height="36" rx="6" fill="#e8f5ee" stroke="#79b894"/>
  <text x="475" y="143" text-anchor="middle">bpf(BPF_PROG_LOAD)</text>

  <rect x="210" y="196" width="150" height="60" rx="6" fill="#e8f5ee" stroke="#79b894"/>
  <text x="285" y="222" text-anchor="middle">校验器</text>
  <text x="285" y="240" text-anchor="middle" font-size="11" fill="#556">逐指令检查</text>

  <rect x="400" y="196" width="150" height="60" rx="6" fill="#e8f5ee" stroke="#79b894"/>
  <text x="475" y="222" text-anchor="middle">JIT</text>
  <text x="475" y="240" text-anchor="middle" font-size="11" fill="#556">字节码 → 机器码</text>

  <rect x="590" y="196" width="120" height="60" rx="6" fill="#e8f5ee" stroke="#79b894"/>
  <text x="650" y="222" text-anchor="middle">map</text>
  <text x="650" y="240" text-anchor="middle" font-size="11" fill="#556">prog 运行时访问</text>

  <rect x="590" y="280" width="240" height="36" rx="6" fill="#f6e8e8" stroke="#c78c8c"/>
  <text x="710" y="303" text-anchor="middle" font-size="12">挂载点：XDP / tc / cgroup / socket</text>

  <line x1="170" y1="70" x2="205" y2="70" stroke="#556" marker-end="url(#a)"/>
  <line x1="360" y1="70" x2="395" y2="70" stroke="#556" marker-end="url(#a)"/>
  <line x1="475" y1="100" x2="475" y2="115" stroke="#556" marker-end="url(#a)"/>
  <line x1="440" y1="156" x2="330" y2="191" stroke="#556" marker-end="url(#a)"/>
  <line x1="360" y1="226" x2="395" y2="226" stroke="#556" marker-end="url(#a)"/>
  <line x1="550" y1="226" x2="585" y2="226" stroke="#556" marker-end="url(#a)"/>
  <line x1="475" y1="256" x2="560" y2="278" stroke="#556" marker-end="url(#a)"/>
  <line x1="650" y1="100" x2="650" y2="191" stroke="#556" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>

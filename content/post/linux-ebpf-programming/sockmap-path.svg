<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#556"/>
    </marker>
  </defs>
  <rect x="30" y="40" width="150" height="56" rx="6" fill="#eef4fb" stroke="#7aa7cc"/>
  <text x="105" y="64" text-anchor="middle">进程 A 的 socket</text>
  <text x="105" y="82" text-anchor="middle" font-size="11" fill="#556">sendmsg</text>

  <rect x="30" y="200" width="150" height="56" rx="6" fill="#eef4fb" stroke="#7aa7cc"/>
  <text x="105" y="224" text-anchor="middle">进程 B 的 socket</text>
  <text x="105" y="242" text-anchor="middle" font-size="11" fill="#556">recvmsg</text>

  <rect x="300" y="110" width="190" height="80" rx="6" fill="#f6f1e8" stroke="#c2a878"/>
  <text x="395" y="138" text-anchor="middle" font-weight="600">SOCKMAP / SOCKHASH</text>
  <text x="395" y="158" text-anchor="middle" font-size="11" fill="#556">键 → socket 引用</text>
  <text x="395" y="176" text-anchor="middle" font-size="11" fill="#556">写入：sock_ops　查询：sk_msg</text>

  <rect x="580" y="40" width="200" height="56" rx="6" fill="#e8f5ee" stroke="#79b894"/>
  <text x="680" y="64" text-anchor="middle">sk_msg</text>
  <text x="680" y="82" text-anchor="middle" font-size="10" fill="#556">按 key 查到 B，直接投递给它</text>

  <rect x="580" y="200" width="200" height="56" rx="6" fill="#e8f5ee" stroke="#79b894"/>
  <text x="680" y="224" text-anchor="middle">sk_skb/stream_verdict</text>
  <text x="680" y="242" text-anchor="middle" font-size="11" fill="#556">入方向 SK_PASS / SK_DROP</text>

  <line x1="180" y1="74" x2="295" y2="128" stroke="#556" marker-end="url(#b)"/>
  <line x1="180" y1="222" x2="295" y2="172" stroke="#556" marker-end="url(#b)"/>
  <line x1="490" y1="130" x2="575" y2="80" stroke="#556" marker-end="url(#b)"/>
  <line x1="490" y1="172" x2="575" y2="222" stroke="#556" marker-end="url(#b)"/>
</svg>

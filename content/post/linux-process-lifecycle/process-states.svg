<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">常见任务状态转换与退出回收</title><desc id="desc">就绪与运行均属于TASK_RUNNING，运行可以进入睡眠或停止，唤醒或恢复后重新就绪。退出后通常进入僵尸状态等待父进程wait回收，显式忽略SIGCHLD或SA_NOCLDWAIT等情况可以自动回收。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1100" height="850" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">执行状态与退出阶段：先分开，再接起来</text><rect x="60" y="110" width="280" height="85" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="200.0" y="145.5" text-anchor="middle" fill="#15304f" font-size="18">就绪 · 等待 CPU</text><text x="200.0" y="171.5" text-anchor="middle" fill="#15304f" font-size="18">TASK_RUNNING / R</text><rect x="700" y="110" width="320" height="85" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="860.0" y="145.5" text-anchor="middle" fill="#15304f" font-size="18">运行 · 正在 CPU 上执行</text><text x="860.0" y="171.5" text-anchor="middle" fill="#15304f" font-size="18">TASK_RUNNING / R</text><path d="M340 133L700 133" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="425" y="115" text-anchor="start" fill="#15304f" font-size="18">调度选择</text><path d="M700 176L340 176" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="425" y="206" text-anchor="start" fill="#15304f" font-size="18">抢占 / 让出</text><rect x="60" y="330" width="280" height="85" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="200.0" y="365.5" text-anchor="middle" fill="#15304f" font-size="18">睡眠 · 等待事件</text><text x="200.0" y="391.5" text-anchor="middle" fill="#15304f" font-size="18">S / D 等</text><rect x="700" y="330" width="320" height="85" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="860.0" y="365.5" text-anchor="middle" fill="#15304f" font-size="18">停止 / 跟踪停止</text><text x="860.0" y="391.5" text-anchor="middle" fill="#15304f" font-size="18">T / t</text><path d="M750 195V265H200V330" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="335" y="253" text-anchor="start" fill="#15304f" font-size="18">运行中等待事件或资源</text><path d="M60 370H30V155H60" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="65" y="295" text-anchor="start" fill="#15304f" font-size="17">条件满足后唤醒 → 就绪</text><path d="M860 195L860 330" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="880" y="272" text-anchor="start" fill="#15304f" font-size="17">停止请求</text><path d="M1020 370H1060V70H200V110" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="550" y="88" text-anchor="start" fill="#15304f" font-size="17">继续请求 / 跟踪恢复 → 就绪</text><rect x="390" y="475" width="350" height="75" rx="10" fill="#eef0f4" stroke="#96a8bb"/><text x="565.0" y="505.5" text-anchor="middle" fill="#15304f" font-size="18">退出处理</text><text x="565.0" y="531.5" text-anchor="middle" fill="#15304f" font-size="18">结束执行，清理主要运行资源</text><path d="M1015 195H1080V512H740" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="895" y="460" text-anchor="start" fill="#15304f" font-size="17">最终推进退出</text><rect x="60" y="625" width="320" height="85" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="220.0" y="660.5" text-anchor="middle" fill="#15304f" font-size="18">僵尸 Z · 保留退出信息</text><text x="220.0" y="686.5" text-anchor="middle" fill="#15304f" font-size="18">不再执行程序</text><rect x="700" y="625" width="320" height="85" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="860.0" y="660.5" text-anchor="middle" fill="#15304f" font-size="18">已回收</text><text x="860.0" y="686.5" text-anchor="middle" fill="#15304f" font-size="18">不再是待回收的子进程</text><path d="M445 550V590H220V625" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="50" y="579" text-anchor="start" fill="#15304f" font-size="17">普通子进程：保留信息</text><path d="M380 667L700 667" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="435" y="645" text-anchor="start" fill="#15304f" font-size="18">父进程 wait 回收</text><path d="M685 550V585H860V625" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="750" y="572" text-anchor="start" fill="#15304f" font-size="17">满足条件时自动回收</text><text x="45" y="765" text-anchor="start" fill="#15304f" font-size="18">父进程可以预先阻塞在 wait；Z 阶段可能很短，工具未必能捕捉到。</text><text x="45" y="805" text-anchor="start" fill="#73859b" font-size="16">图为常见关系示意；不省略真实路径必须遵守的唤醒、信号与引用管理规则。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">复制描述符表与共享描述符表</title><desc id="desc">普通fork后两份files_struct内的表项指向同一个struct file。CLONE_FILES使两个任务直接共用同一份files_struct。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="610" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">复制表项与共用整张表，影响范围不同</text><text x="30" y="90" text-anchor="start" fill="#15304f" font-size="20">普通 fork：不同表，相同打开实例</text><rect x="45" y="120" width="165" height="65" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="127.5" y="158.5" text-anchor="middle" fill="#15304f" font-size="18">父 task</text><rect x="300" y="120" width="240" height="65" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="420.0" y="145.5" text-anchor="middle" fill="#15304f" font-size="18">各自 files_struct</text><text x="420.0" y="171.5" text-anchor="middle" fill="#15304f" font-size="18">fd[3] → file</text><path d="M210 152L300 152" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="45" y="235" width="165" height="65" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="127.5" y="273.5" text-anchor="middle" fill="#15304f" font-size="18">子 task</text><rect x="300" y="235" width="240" height="65" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="420.0" y="260.5" text-anchor="middle" fill="#15304f" font-size="18">各自 files_struct</text><text x="420.0" y="286.5" text-anchor="middle" fill="#15304f" font-size="18">fd[3] → file</text><path d="M210 267L300 267" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="710" y="170" width="235" height="80" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="827.5" y="203.0" text-anchor="middle" fill="#15304f" font-size="18">同一 struct file</text><text x="827.5" y="229.0" text-anchor="middle" fill="#15304f" font-size="18">f_pos 等状态</text><path d="M540 152L710 190" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M540 267L710 230" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="30" y="365" text-anchor="start" fill="#15304f" font-size="20">CLONE_FILES：任务共用同一张表</text><rect x="45" y="400" width="165" height="60" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="127.5" y="436.0" text-anchor="middle" fill="#15304f" font-size="18">task A</text><rect x="45" y="495" width="165" height="60" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="127.5" y="531.0" text-anchor="middle" fill="#15304f" font-size="18">task B</text><rect x="340" y="435" width="260" height="80" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="470.0" y="468.0" text-anchor="middle" fill="#15304f" font-size="18">同一 files_struct</text><text x="470.0" y="494.0" text-anchor="middle" fill="#15304f" font-size="18">同一 fd[]</text><rect x="730" y="435" width="215" height="80" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="837.5" y="481.0" text-anchor="middle" fill="#15304f" font-size="18">struct file</text><path d="M210 430L340 455" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M210 525L340 495" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M600 475L730 475" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/></g></svg>
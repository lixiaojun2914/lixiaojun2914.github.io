<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">从fork到exec和退出回收</title><desc id="desc">父任务fork生成子任务，子任务exec替换程序但进程PID不变，退出后成为待回收僵尸，父任务wait完成回收。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="470" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">创建任务、替换程序、结束执行、回收信息</text><rect x="40" y="95" width="190" height="75" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="135.0" y="125.5" text-anchor="middle" fill="#15304f" font-size="18">父任务</text><text x="135.0" y="151.5" text-anchor="middle" fill="#15304f" font-size="18">PID 1559028</text><rect x="305" y="95" width="255" height="75" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="432.5" y="125.5" text-anchor="middle" fill="#15304f" font-size="18">fork 后子任务</text><text x="432.5" y="151.5" text-anchor="middle" fill="#15304f" font-size="18">PID 1559039</text><rect x="665" y="95" width="290" height="75" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="810.0" y="125.5" text-anchor="middle" fill="#15304f" font-size="18">exec 后新程序</text><text x="810.0" y="151.5" text-anchor="middle" fill="#15304f" font-size="18">PID 仍为 1559039</text><path d="M230 132L305 132" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="245" y="113" text-anchor="start" fill="#15304f" font-size="17">fork</text><path d="M560 132L665 132" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="585" y="113" text-anchor="start" fill="#15304f" font-size="17">exec</text><rect x="665" y="265" width="290" height="75" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="810.0" y="295.5" text-anchor="middle" fill="#15304f" font-size="18">子任务已退出</text><text x="810.0" y="321.5" text-anchor="middle" fill="#15304f" font-size="18">Z · 保留退出码 7</text><path d="M810 170L810 265" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="305" y="265" width="255" height="75" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="432.5" y="295.5" text-anchor="middle" fill="#15304f" font-size="18">父任务 waitpid</text><text x="432.5" y="321.5" text-anchor="middle" fill="#15304f" font-size="18">取得状态并推进回收</text><path d="M665 302L560 302" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M135 170V302H305" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="50" y="410" text-anchor="start" fill="#15304f" font-size="17">waitid(WNOWAIT) 可先观察退出信息，暂不回收；数字 PID 以后仍可能被复用。</text></g></svg>
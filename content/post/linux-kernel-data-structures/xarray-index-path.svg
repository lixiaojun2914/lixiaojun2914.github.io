<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">XArray索引的分层路径</title><desc id="desc">按64槽配置，12345的槽位路径是3、0、57。12346共享相同的前两层，在底层读取58。本例57指向folio，58为空。节点按需分配，不是预分配全部分支。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="760" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">每层取 6 位：12345 → 3 → 0 → 57</text><rect x="40" y="90" width="170" height="65" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="125.0" y="128.5" text-anchor="middle" fill="#15304f" font-size="18">xa_head</text><rect x="300" y="90" width="420" height="120" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="320" y="122" text-anchor="start" fill="#15304f" font-size="20">node · shift = 12</text><rect x="320" y="142" width="155" height="48" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="397.5" y="172.0" text-anchor="middle" fill="#15304f" font-size="18">选择 slots[3]</text><text x="495" y="172" text-anchor="start" fill="#73859b" font-size="16">其余槽位未展开</text><rect x="300" y="275" width="420" height="120" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="320" y="307" text-anchor="start" fill="#15304f" font-size="20">node · shift = 6</text><rect x="320" y="327" width="155" height="48" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="397.5" y="357.0" text-anchor="middle" fill="#15304f" font-size="18">选择 slots[0]</text><text x="495" y="357" text-anchor="start" fill="#73859b" font-size="16">其余槽位未展开</text><path d="M210 122L300 122" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M397 190V245H510V275" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="530" y="247" text-anchor="start" fill="#15304f" font-size="17">槽 3 指向下一节点</text><path d="M397 375V425H510V460" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="530" y="434" text-anchor="start" fill="#15304f" font-size="17">槽 0 指向底层节点</text><rect x="300" y="460" width="420" height="165" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="320" y="490" text-anchor="start" fill="#15304f" font-size="20">node · shift = 0</text><rect x="320" y="530" width="170" height="60" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="405.0" y="553.0" text-anchor="middle" fill="#15304f" font-size="18">slots[57]</text><text x="405.0" y="579.0" text-anchor="middle" fill="#15304f" font-size="18">folio 指针</text><rect x="520" y="530" width="180" height="60" rx="10" fill="#eef0f4" stroke="#96a8bb"/><text x="610.0" y="553.0" text-anchor="middle" fill="#15304f" font-size="18">slots[58]</text><text x="610.0" y="579.0" text-anchor="middle" fill="#15304f" font-size="18">NULL</text><rect x="795" y="530" width="170" height="60" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="880.0" y="566.0" text-anchor="middle" fill="#15304f" font-size="18">folio 对象</text><path d="M405 590V650H880V590" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="45" y="546" text-anchor="start" fill="#15304f" font-size="18">12345 →</text><text x="45" y="576" text-anchor="start" fill="#15304f" font-size="17">底层选择 57</text><text x="370" y="702" text-anchor="start" fill="#15304f" font-size="17">12346 复用上层路径，底层改选 58；本例该槽为空。</text><text x="35" y="740" text-anchor="start" fill="#73859b" font-size="16">图省略内部条目编码、元数据与其他槽位，不表示完整节点只有指针数组。</text></g></svg>
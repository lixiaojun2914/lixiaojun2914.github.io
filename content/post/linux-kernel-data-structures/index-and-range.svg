<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">整数索引与区间索引</title><desc id="desc">XArray 的索引7和42分别连接两个对象。Maple Tree 将0x1000到0x2fff映射到区域A，将0x5000到0x5fff映射到区域B，中间为空。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#47769e"/></marker></defs><rect width="900" height="590" rx="16" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#172b4d"><text x="30" y="38" font-size="23" fill="#172b4d">XArray：整数索引 → 条目</text><rect x="70" y="80" width="150" height="56" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="86" y="114.0" font-size="18" fill="#172b4d">索引 7</text><rect x="70" y="180" width="150" height="56" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="86" y="214.0" font-size="18" fill="#172b4d">索引 42</text><rect x="420" y="80" width="290" height="56" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="436" y="114.0" font-size="18" fill="#172b4d">对象 P · 不需内嵌 xa 节点</text><rect x="420" y="180" width="290" height="56" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="436" y="214.0" font-size="18" fill="#172b4d">对象 Q · 不需内嵌 xa 节点</text><path d="M220 108L420 108" fill="none" stroke="#47769e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M220 208L420 208" fill="none" stroke="#47769e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="70" y="270" font-size="17" fill="#172b4d">未存入的索引查询得到 NULL；图不表示内部节点布局。</text><text x="30" y="330" font-size="23" fill="#172b4d">Maple Tree：地址所属区间 → 条目</text><rect x="60" y="375" width="280" height="65" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="76" y="413.5" font-size="18" fill="#172b4d">A · [0x1000, 0x2fff]</text><rect x="350" y="375" width="170" height="65" rx="9" fill="#f1f5f9" stroke="#94a3b8"/><text x="366" y="413.5" font-size="18" fill="#172b4d">空隙</text><rect x="530" y="375" width="290" height="65" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="546" y="413.5" font-size="18" fill="#172b4d">B · [0x5000, 0x5fff]</text><text x="65" y="493" font-size="18" fill="#172b4d">查询 0x1800 → A</text><text x="350" y="493" font-size="18" fill="#172b4d">0x4000 → NULL</text><text x="615" y="493" font-size="18" fill="#172b4d">0x5800 → B</text><text x="60" y="548" font-size="17" fill="#172b4d">上图强调典型访问方式；XArray 也支持多索引条目。</text></g></svg>
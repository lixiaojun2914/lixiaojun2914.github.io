<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">索引与最近使用顺序</title><desc id="desc">XArray按键连接A B C三个对象，LRU按A B C排列。访问B后，链表顺序变成A C B，索引关系不变。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#47769e"/></marker></defs><rect width="900" height="480" rx="16" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#172b4d"><text x="30" y="38" font-size="23" fill="#172b4d">同一批对象：按键查找 + 按最近使用顺序组织</text><rect x="40" y="85" width="175" height="62" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="56" y="122.0" font-size="18" fill="#172b4d">XArray 索引</text><rect x="310" y="80" width="150" height="75" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="326" y="123.5" font-size="18" fill="#172b4d">A · key=1</text><path d="M215 115L310 80" fill="none" stroke="#47769e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="80" width="150" height="75" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="516" y="123.5" font-size="18" fill="#172b4d">B · key=2</text><path d="M215 115L500 80" fill="none" stroke="#47769e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="690" y="80" width="150" height="75" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="706" y="123.5" font-size="18" fill="#172b4d">C · key=3</text><path d="M215 115L690 80" fill="none" stroke="#47769e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="213" font-size="18" fill="#172b4d">访问 B 前</text><text x="250" y="213" font-size="16" fill="#172b4d">最久未用</text><text x="710" y="213" font-size="16" fill="#172b4d">最近使用</text><rect x="250" y="235" width="145" height="55" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="266" y="268.5" font-size="18" fill="#172b4d">A</text><rect x="450" y="235" width="145" height="55" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="466" y="268.5" font-size="18" fill="#172b4d">B</text><rect x="650" y="235" width="145" height="55" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="666" y="268.5" font-size="18" fill="#172b4d">C</text><path d="M395 262L450 262" fill="none" stroke="#47769e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M595 262L650 262" fill="none" stroke="#47769e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="350" font-size="18" fill="#172b4d">访问 B 后</text><rect x="250" y="335" width="145" height="55" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="266" y="368.5" font-size="18" fill="#172b4d">A</text><rect x="450" y="335" width="145" height="55" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="466" y="368.5" font-size="18" fill="#172b4d">C</text><rect x="650" y="335" width="145" height="55" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="666" y="368.5" font-size="18" fill="#172b4d">B</text><path d="M395 362L450 362" fill="none" stroke="#47769e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M595 362L650 362" fill="none" stroke="#47769e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="445" font-size="17" fill="#172b4d">示意省略表头和反向链接；移动节点不会复制对象或改变查找键。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" role="img" aria-labelledby="title desc"><title id="title">RCU发布与回收时间线</title><desc id="desc">读者A先获取旧对象，写者发布新入口。读者B随后取得新对象。等待相关旧读者退出读侧临界区后，旧对象才能回收。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#47769e"/></marker></defs><rect width="980" height="490" rx="16" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#172b4d"><text x="30" y="38" font-size="23" fill="#172b4d">发布新入口与释放旧对象分成两个阶段</text><path d="M180 85L935 85" fill="none" stroke="#47769e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="855" y="72" font-size="17" fill="#172b4d">时间 →</text><path d="M220 100V390" stroke="#cbd5e1" stroke-dasharray="5 5"/><text x="165" y="112" font-size="15" fill="#172b4d">A 取得旧对象</text><path d="M450 100V390" stroke="#cbd5e1" stroke-dasharray="5 5"/><text x="395" y="137" font-size="15" fill="#172b4d">发布新入口</text><path d="M725 100V390" stroke="#cbd5e1" stroke-dasharray="5 5"/><text x="670" y="112" font-size="15" fill="#172b4d">A 结束访问</text><path d="M865 100V390" stroke="#cbd5e1" stroke-dasharray="5 5"/><text x="810" y="137" font-size="15" fill="#172b4d">可回收旧对象</text><text x="30" y="195" font-size="18" fill="#172b4d">读者 A</text><rect x="220" y="162" width="505" height="55" rx="9" fill="#fee9cf" stroke="#94a3b8"/><text x="236" y="195.5" font-size="18" fill="#172b4d">旧对象 · 在读侧临界区内继续访问</text><text x="30" y="275" font-size="18" fill="#172b4d">写者</text><rect x="450" y="242" width="415" height="55" rx="9" fill="#e0edff" stroke="#94a3b8"/><text x="466" y="275.5" font-size="18" fill="#172b4d">更新入口后安排延迟回收</text><text x="30" y="355" font-size="18" fill="#172b4d">读者 B</text><rect x="515" y="322" width="400" height="55" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="531" y="355.5" font-size="18" fill="#172b4d">取得新入口 → 使用新对象</text><path d="M450 415L865 415" fill="none" stroke="#47769e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="475" y="445" font-size="17" fill="#172b4d">示意宽限期：相关既存读侧临界区结束后，才可回收。</text><text x="30" y="477" font-size="15" fill="#172b4d">读者 B 的结束时间不决定旧对象能否释放；本图省略实现中的调度与回调细节。</text></g></svg>
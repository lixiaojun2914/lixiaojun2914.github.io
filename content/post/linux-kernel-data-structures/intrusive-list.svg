<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
<title id="title">节点嵌在对象内部的循环双向链表</title>
<desc id="desc">queue 表头与 a 和 b 的 pending 成员互相连接。蓝线代表 next，紫线代表 prev。节点并非业务对象起点。</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8755b2"/></marker></defs>
<rect width="960" height="410" rx="18" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" fill="#172b4d">
<text x="32" y="37" font-size="21" font-weight="700">连接的是 pending 节点，数据保留在外层 request 中</text>
<rect x="48" y="150" width="180" height="90" rx="10" fill="#e0edff" stroke="#2563eb"/>
<text x="70" y="178" font-size="18">queue · 表头</text><text x="70" y="212" font-size="16">next       prev</text>
<rect x="340" y="85" width="230" height="190" rx="12" fill="white" stroke="#94a3b8"/>
<text x="360" y="116" font-size="18" font-weight="600">struct request a</text><text x="360" y="145" font-size="17">id = 10</text>
<rect x="358" y="161" width="194" height="75" rx="8" fill="#e0edff" stroke="#2563eb"/><text x="373" y="188" font-size="17">pending</text><text x="373" y="216" font-size="16">next       prev</text>
<rect x="680" y="85" width="230" height="190" rx="12" fill="white" stroke="#94a3b8"/>
<text x="700" y="116" font-size="18" font-weight="600">struct request b</text><text x="700" y="145" font-size="17">id = 20</text>
<rect x="698" y="161" width="194" height="75" rx="8" fill="#e0edff" stroke="#2563eb"/><text x="713" y="188" font-size="17">pending</text><text x="713" y="216" font-size="16">next       prev</text>
<g fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"><path d="M228 178H358"/><path d="M552 178H698"/><path d="M892 177H932V60H28V177H48"/></g>
<g fill="none" stroke="#8755b2" stroke-width="2.5" marker-end="url(#purple)"><path d="M698 224H552"/><path d="M358 224H228"/><path d="M48 224H28V300H932V224H892"/></g>
<text x="258" y="168" font-size="15" fill="#2563eb">next</text><text x="598" y="168" font-size="15" fill="#2563eb">next</text>
<text x="258" y="249" font-size="15" fill="#8755b2">prev</text><text x="598" y="249" font-size="15" fill="#8755b2">prev</text>
<text x="48" y="346" font-size="17">list_entry(node, struct request, pending)</text><text x="48" y="378" font-size="17">从节点地址减去 pending 的成员偏移，恢复 request 对象地址。</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">skb：描述对象与关联存储</title><desc id="d">线性缓冲区预留头尾余量，非线性数据通过页片段描述关联。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="500" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">skb：描述对象与关联存储</text><rect x="50" y="95" width="270" height="140" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="68" y="126" font-size="19" fill="#2765b1">struct sk_buff</text><text x="68" y="153" font-size="16" fill="#53647b">head / data / len</text><text x="68" y="177" font-size="16" fill="#53647b">tail / end / data_len</text><rect x="40" y="300" width="200" height="75" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="58" y="331" font-size="19" fill="#ad641b">headroom</text><rect x="240" y="300" width="360" height="75" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="258" y="331" font-size="19" fill="#2765b1">线性有效数据</text><rect x="600" y="300" width="200" height="75" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="618" y="331" font-size="19" fill="#23775b">tailroom</text><rect x="800" y="300" width="160" height="75" rx="12" fill="#f2edfc" stroke="#7450ac" stroke-width="1.5"/><text x="818" y="331" font-size="19" fill="#7450ac">shared_info</text><text x="40" y="285" font-size="15" fill="#53647b">head</text><text x="240" y="285" font-size="15" fill="#53647b">data</text><text x="600" y="285" font-size="15" fill="#53647b">tail 位置</text><text x="800" y="285" font-size="15" fill="#53647b">end 位置</text><path d="M180 235 L180 300" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="570" y="95" width="380" height="130" rx="12" fill="#f2edfc" stroke="#7450ac" stroke-width="1.5"/><text x="588" y="126" font-size="19" fill="#7450ac">非线性数据</text><text x="588" y="153" font-size="16" fill="#53647b">page / offset / length</text><text x="588" y="177" font-size="16" fill="#53647b">可关联页片段或其他 skb</text><path d="M870 300 L870 225" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="40" y="438" font-size="16" fill="#53647b">len = 线性有效长度 + data_len；truesize 是记账量，不是负载长度。</text></g></svg>
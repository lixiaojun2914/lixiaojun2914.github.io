<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">两个 skb，可以共享一份数据</title><desc id="d">克隆分离元数据，共享数据存储；改写需要进一步检查可写性。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="360" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">两个 skb，可以共享一份数据</text><rect x="50" y="100" width="250" height="100" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="68" y="131" font-size="19" fill="#2765b1">skb A</text><text x="68" y="158" font-size="16" fill="#53647b">自己的 users / 视图</text><rect x="50" y="230" width="250" height="100" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="68" y="261" font-size="19" fill="#23775b">skb B</text><text x="68" y="288" font-size="16" fill="#53647b">自己的 users / 视图</text><rect x="590" y="150" width="350" height="130" rx="12" fill="#f2edfc" stroke="#7450ac" stroke-width="1.5"/><text x="608" y="181" font-size="19" fill="#7450ac">共享缓冲区</text><text x="608" y="208" font-size="16" fill="#53647b">独立的数据引用关系</text><text x="608" y="232" font-size="16" fill="#53647b">不是复制整份 payload</text><path d="M300 150 L590 185" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M300 280 L590 235" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/></g></svg>
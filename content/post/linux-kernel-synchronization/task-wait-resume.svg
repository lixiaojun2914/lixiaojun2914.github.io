<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" role="img" aria-labelledby="t d"><title id="t">一个任务从等待到继续执行</title><desc id="d">任务提交异步请求后等待。设备中断安排IRQ线程，线程写入结果并通知完成。任务就绪后还要获得调度才可继续执行。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#436c96"/></marker></defs><rect width="1100" height="840" rx="16" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#17324f"><text x="30" y="42" font-size="25">一次等待，把任务、调度、执行上下文与同步接起来</text><text x="45" y="91" font-size="22">等待任务 A：系统调用路径</text><text x="620" y="91" font-size="22">设备处理路径</text><rect x="35" y="120" width="440" height="95" rx="10" fill="#e3eefb" stroke="#9fb2c4"/><text x="53" y="150" font-size="18">1  提交请求，等待完成</text><text x="53" y="177" font-size="18">有 task_struct、独立执行现场与资源引用</text><path d="M255 215L255 247" fill="none" stroke="#436c96" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="250" width="440" height="95" rx="10" fill="#f5ead8" stroke="#9fb2c4"/><text x="53" y="280" font-size="18">2  未完成：登记等待并阻塞</text><text x="53" y="307" font-size="18">A 暂时不参与普通可运行任务的竞争</text><rect x="610" y="120" width="455" height="95" rx="10" fill="#e3eefb" stroke="#9fb2c4"/><text x="628" y="150" font-size="18">3  设备发来硬中断</text><text x="628" y="177" font-size="18">上半部安排 IRQ 线程运行</text><path d="M835 215L835 247" fill="none" stroke="#436c96" stroke-width="2" marker-end="url(#a)"/><rect x="610" y="250" width="455" height="95" rx="10" fill="#e3eefb" stroke="#9fb2c4"/><text x="628" y="280" font-size="18">4  IRQ 线程获得 CPU</text><text x="628" y="307" font-size="18">准备结果，写入共享对象</text><path d="M835 345L835 377" fill="none" stroke="#436c96" stroke-width="2" marker-end="url(#a)"/><rect x="610" y="380" width="455" height="95" rx="10" fill="#e0f1e8" stroke="#9fb2c4"/><text x="628" y="410" font-size="18">5  通知完成：complete()</text><text x="628" y="437" font-size="18">按完成与唤醒协议推进等待者就绪</text><path d="M610 428H477" fill="none" stroke="#436c96" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="380" width="440" height="95" rx="10" fill="#e0f1e8" stroke="#9fb2c4"/><text x="53" y="410" font-size="18">6  A 恢复运行资格</text><text x="53" y="437" font-size="18">就绪不等于此刻已经执行</text><path d="M255 475L255 507" fill="none" stroke="#436c96" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="510" width="440" height="95" rx="10" fill="#e3eefb" stroke="#9fb2c4"/><text x="53" y="540" font-size="18">7  调度器选择 A，恢复执行现场</text><text x="53" y="567" font-size="18">等待成功，使用结果并返回用户态</text><path d="M255 605L255 637" fill="none" stroke="#436c96" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="640" width="440" height="75" rx="10" fill="#e3eefb" stroke="#9fb2c4"/><text x="53" y="670" font-size="18">8  后续正常运行；最终退出与回收</text><text x="615" y="535" font-size="18">互斥：共享状态由一致的锁协议保护。</text><text x="615" y="576" font-size="18">交付：先写结果，再通知，成功等待后读。</text><text x="615" y="617" font-size="18">回收：等待结束不代表异步访问一定停止。</text><text x="35" y="775" font-size="17">跨篇概念示意；不表示所有设备读取都使用 completion，也不是触控驱动的实测调用栈。</text></g></svg>
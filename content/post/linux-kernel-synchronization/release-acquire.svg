<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">release与acquire发布关系</title><desc id="desc">CPU 0写payload再release存储ready，CPU 1acquire观察到该发布后读取payload，构成正确的一次性数据交付。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="560" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">一次性发布：先准备，再发布；观察发布，再读取</text><text x="100" y="105" text-anchor="start" fill="#15304f" font-size="21">CPU 0：内核发布路径</text><text x="650" y="105" text-anchor="start" fill="#15304f" font-size="21">CPU 1：内核读取路径</text><rect x="55" y="155" width="340" height="80" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="225.0" y="188.0" text-anchor="middle" fill="#15304f" font-size="18">写 payload = 42</text><text x="225.0" y="214.0" text-anchor="middle" fill="#15304f" font-size="18">WRITE_ONCE(obj-&gt;payload, 42)</text><rect x="55" y="345" width="340" height="80" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="225.0" y="378.0" text-anchor="middle" fill="#15304f" font-size="18">smp_store_release</text><text x="225.0" y="404.0" text-anchor="middle" fill="#15304f" font-size="18">(&amp;obj-&gt;ready, 1)</text><rect x="605" y="155" width="340" height="80" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="775.0" y="188.0" text-anchor="middle" fill="#15304f" font-size="18">smp_load_acquire</text><text x="775.0" y="214.0" text-anchor="middle" fill="#15304f" font-size="18">观察到这次发布的 1</text><rect x="605" y="345" width="340" height="80" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="775.0" y="378.0" text-anchor="middle" fill="#15304f" font-size="18">读取 payload</text><text x="775.0" y="404.0" text-anchor="middle" fill="#15304f" font-size="18">按协议得到 42</text><path d="M225 235L225 345" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M775 235L775 345" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M395 365L605 215" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="438" y="275" text-anchor="start" fill="#15304f" font-size="17">配对观察</text><text x="45" y="490" text-anchor="start" fill="#15304f" font-size="17">前提：payload 在发布后不再修改，ready 不反复重置，对象在双方使用期间有效。</text><text x="45" y="530" text-anchor="start" fill="#73859b" font-size="16">图表达协议保证；一次运行输出不能独立证明全部内存顺序性质。</text></g></svg>
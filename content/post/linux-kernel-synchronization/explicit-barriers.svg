<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="t d"><title id="t">读写屏障的一次性交付</title><desc id="d">写侧在写结果与写标记之间放置smp_wmb，读侧在读标记与读结果之间放置smp_rmb，排除标记为1而结果仍为0的观察。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#38669c"/></marker></defs><rect width="1100" height="590" rx="16" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#15304f"><text x="30" y="42" font-size="25">屏障隔开的是哪两次访问？</text><text x="55" y="95" font-size="22">CPU 0：发布结果</text><rect x="40" y="125" width="430" height="70" rx="10" fill="#e3eefb" stroke="#9bafc3"/><text x="60" y="168" font-size="21">W1  写 value = 42</text><path d="M255 195v43" fill="none" stroke="#38669c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="240" width="430" height="70" rx="10" fill="#e1f2eb" stroke="#9bafc3"/><text x="60" y="283" font-size="21">smp_wmb()</text><path d="M255 310v43" fill="none" stroke="#38669c" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="355" width="430" height="70" rx="10" fill="#e3eefb" stroke="#9bafc3"/><text x="60" y="398" font-size="21">W2  写 ready = 1</text><text x="645" y="95" font-size="22">CPU 1：尝试读取</text><rect x="630" y="125" width="430" height="70" rx="10" fill="#e3eefb" stroke="#9bafc3"/><text x="650" y="168" font-size="21">R1  读 ready，确认为 1</text><path d="M845 195v43" fill="none" stroke="#38669c" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="240" width="430" height="70" rx="10" fill="#e1f2eb" stroke="#9bafc3"/><text x="650" y="283" font-size="21">smp_rmb()</text><path d="M845 310v43" fill="none" stroke="#38669c" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="355" width="430" height="70" rx="10" fill="#e3eefb" stroke="#9bafc3"/><text x="650" y="398" font-size="21">R2  读 value，得到 42</text><path d="M470 390H550V160H628" fill="none" stroke="#38669c" stroke-width="2" marker-end="url(#a)"/><text x="475" y="450" font-size="17">R1 读到 W2 的值</text><text x="40" y="510" font-size="21">配对后的保证：读到 ready = 1 时，随后不能仍读到 value 的初始值 0。</text><text x="40" y="553" font-size="18">前提：普通 CPU 共享内存、单个写者、只发布一次、对象一直有效。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">内核同步的不同责任</title><desc id="desc">共享对象需要分别考虑互斥、事件等待、发布顺序和生命周期，单一屏障不能覆盖所有责任。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="500" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">互斥、等待、顺序与生命周期分别检查</text><rect x="350" y="205" width="300" height="85" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="500.0" y="240.5" text-anchor="middle" fill="#15304f" font-size="18">共享对象</text><text x="500.0" y="266.5" text-anchor="middle" fill="#15304f" font-size="18">状态 + 入口 + 存活</text><rect x="40" y="85" width="280" height="90" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="180.0" y="123.0" text-anchor="middle" fill="#15304f" font-size="18">互斥</text><text x="180.0" y="149.0" text-anchor="middle" fill="#15304f" font-size="18">谁能进入临界区？</text><path d="M350 230L180 175" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="680" y="85" width="280" height="90" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="820.0" y="123.0" text-anchor="middle" fill="#15304f" font-size="18">等待</text><text x="820.0" y="149.0" text-anchor="middle" fill="#15304f" font-size="18">条件未成立怎么办？</text><path d="M650 230L820 175" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="40" y="340" width="280" height="90" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="180.0" y="378.0" text-anchor="middle" fill="#15304f" font-size="18">发布顺序</text><text x="180.0" y="404.0" text-anchor="middle" fill="#15304f" font-size="18">对方何时能读到准备好的数据？</text><path d="M350 270L180 340" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="680" y="340" width="280" height="90" rx="10" fill="#eef0f4" stroke="#96a8bb"/><text x="820.0" y="378.0" text-anchor="middle" fill="#15304f" font-size="18">生命周期</text><text x="820.0" y="404.0" text-anchor="middle" fill="#15304f" font-size="18">异步使用者何时全部结束？</text><path d="M650 270L820 340" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="45" y="475" text-anchor="start" fill="#15304f" font-size="17">锁、等待队列、release/acquire 与引用回收规则，可以组合承担这些责任。</text></g></svg>
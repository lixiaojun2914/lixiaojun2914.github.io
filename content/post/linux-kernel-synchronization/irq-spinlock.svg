<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 870" role="img" aria-labelledby="title desc"><title id="title">同 CPU 中断重入与 irqsave 保护的顺序对照</title><desc id="desc">左侧任务持锁后被硬中断打断，中断自旋等待同一把锁，使任务无法恢复释放锁。右侧保存关闭本地中断后持锁，临界区完成后释放锁并恢复原状态，相应中断在允许时处理。两列按自上而下的步骤独立阅读。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7c8fa5"/></marker></defs><rect width="1100" height="870" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#18334f"><text x="35" y="42" text-anchor="start" font-size="25" fill="#18334f">同一把锁：只做跨 CPU 互斥，还可能遇到本地中断重入</text><text x="285" y="107" text-anchor="middle" font-size="23" fill="#a25331">仅取得自旋锁</text><text x="815" y="107" text-anchor="middle" font-size="23" fill="#26725c">保存本地 IRQ 状态，再取得锁</text><rect x="65" y="150" width="440" height="100" rx="12" fill="#fff8f0" stroke="#b6c4d3"/><circle cx="97" cy="180" r="15" fill="#e6edf5"/><text x="97" y="186" text-anchor="middle" font-size="17" fill="#18334f">1</text><text x="300" y="192" text-anchor="middle" font-size="20" fill="#18334f">任务取得锁 L</text><text x="300" y="221" text-anchor="middle" font-size="20" fill="#18334f">随后被本 CPU 的 IRQ 打断</text><rect x="595" y="150" width="440" height="100" rx="12" fill="#f0f8f4" stroke="#b6c4d3"/><circle cx="627" cy="180" r="15" fill="#e6edf5"/><text x="627" y="186" text-anchor="middle" font-size="17" fill="#18334f">1</text><text x="830" y="192" text-anchor="middle" font-size="20" fill="#18334f">保存并关闭相应本地 IRQ</text><text x="830" y="221" text-anchor="middle" font-size="20" fill="#18334f">取得锁 L</text><path d="M285 250V288" stroke="#7c8fa5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M815 250V288" stroke="#7c8fa5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="65" y="300" width="440" height="100" rx="12" fill="#fff8f0" stroke="#b6c4d3"/><circle cx="97" cy="330" r="15" fill="#e6edf5"/><text x="97" y="336" text-anchor="middle" font-size="17" fill="#18334f">2</text><text x="300" y="342" text-anchor="middle" font-size="20" fill="#18334f">进入硬中断处理函数</text><text x="300" y="371" text-anchor="middle" font-size="20" fill="#18334f">被打断任务暂时不能继续</text><rect x="595" y="300" width="440" height="100" rx="12" fill="#f0f8f4" stroke="#b6c4d3"/><circle cx="627" cy="330" r="15" fill="#e6edf5"/><text x="627" y="336" text-anchor="middle" font-size="17" fill="#18334f">2</text><text x="830" y="342" text-anchor="middle" font-size="20" fill="#18334f">临界区继续执行</text><text x="830" y="371" text-anchor="middle" font-size="20" fill="#18334f">相应 IRQ 到来时暂不进入处理函数</text><path d="M285 400V438" stroke="#7c8fa5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M815 400V438" stroke="#7c8fa5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="65" y="450" width="440" height="100" rx="12" fill="#fff8f0" stroke="#b6c4d3"/><circle cx="97" cy="480" r="15" fill="#e6edf5"/><text x="97" y="486" text-anchor="middle" font-size="17" fill="#18334f">3</text><text x="300" y="492" text-anchor="middle" font-size="20" fill="#18334f">中断处理函数也要取得 L</text><text x="300" y="521" text-anchor="middle" font-size="20" fill="#18334f">自旋等待，无法返回</text><rect x="595" y="450" width="440" height="100" rx="12" fill="#f0f8f4" stroke="#b6c4d3"/><circle cx="627" cy="480" r="15" fill="#e6edf5"/><text x="627" y="486" text-anchor="middle" font-size="17" fill="#18334f">3</text><text x="830" y="492" text-anchor="middle" font-size="20" fill="#18334f">释放锁 L</text><text x="830" y="521" text-anchor="middle" font-size="20" fill="#18334f">恢复进入前的本地 IRQ 状态</text><rect x="65" y="620" width="440" height="100" rx="12" fill="#fae9e5" stroke="#d9a69a"/><text x="285" y="660" text-anchor="middle" font-size="20" fill="#18334f">形成等待环</text><text x="285" y="689" text-anchor="middle" font-size="20" fill="#18334f">IRQ 等锁，持锁任务等 IRQ 返回</text><path d="M285 550V588" stroke="#7c8fa5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="595" y="620" width="440" height="100" rx="12" fill="#e2f2e9" stroke="#9dc6af"/><text x="815" y="660" text-anchor="middle" font-size="20" fill="#18334f">避免这类同 CPU 重入</text><text x="815" y="689" text-anchor="middle" font-size="20" fill="#18334f">相应 IRQ 在允许时再处理</text><path d="M815 550V588" stroke="#7c8fa5" stroke-width="2.5" marker-end="url(#arrow)"/><text x="65" y="784" text-anchor="start" font-size="19" fill="#18334f">irqrestore 恢复原状态；进入前若已关中断，退出后仍保持关闭。</text><text x="65" y="827" text-anchor="start" font-size="17" fill="#63778d">以非 PREEMPT_RT、可屏蔽硬中断场景为例；其他 CPU 的访问仍需同一把锁保护。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="t d"><title id="t">自旋等待与睡眠等待</title><desc id="d">自旋锁竞争者在获取锁路径等待，mutex慢路径等待者调度出去，CPU可运行其他任务，唤醒后再竞争。</desc><rect width="1080" height="620" rx="16" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#16324f"><text x="35" y="45" font-size="25">没取得锁之后，CPU 与任务分别在做什么？</text><text x="50" y="95" font-size="21">自旋锁：竞争者留在获取路径</text><rect x="35" y="120" width="490" height="66" rx="10" fill="#e2eefb" stroke="#9aafc2"/><text x="49" y="160" font-size="18">1. 任务 A 在另一个 CPU 持锁</text><text x="275" y="209" font-size="23">↓</text><rect x="35" y="217" width="490" height="66" rx="10" fill="#e2eefb" stroke="#9aafc2"/><text x="49" y="257" font-size="18">2. 任务 B 尝试获取，未成功</text><text x="275" y="306" font-size="23">↓</text><rect x="35" y="314" width="490" height="66" rx="10" fill="#e2eefb" stroke="#9aafc2"/><text x="49" y="354" font-size="18">3. B 在获取路径等待，占用执行机会</text><text x="275" y="403" font-size="23">↓</text><rect x="35" y="411" width="490" height="66" rx="10" fill="#e2eefb" stroke="#9aafc2"/><text x="49" y="451" font-size="18">4. A 解锁 → B 成功取得锁</text><text x="570" y="95" font-size="21">mutex：竞争进入睡眠慢路径</text><rect x="555" y="120" width="490" height="66" rx="10" fill="#e2f2ea" stroke="#9aafc2"/><text x="569" y="160" font-size="18">1. 任务 A 持锁，B 获取未成功</text><text x="795" y="209" font-size="23">↓</text><rect x="555" y="217" width="490" height="66" rx="10" fill="#e2f2ea" stroke="#9aafc2"/><text x="569" y="257" font-size="18">2. B 登记等待，设置状态并调度出去</text><text x="795" y="306" font-size="23">↓</text><rect x="555" y="314" width="490" height="66" rx="10" fill="#e2f2ea" stroke="#9aafc2"/><text x="569" y="354" font-size="18">3. 此 CPU 可以运行其他任务 C</text><text x="795" y="403" font-size="23">↓</text><rect x="555" y="411" width="490" height="66" rx="10" fill="#e2f2ea" stroke="#9aafc2"/><text x="569" y="451" font-size="18">4. A 解锁唤醒 B → B 再争取锁</text><text x="35" y="550" font-size="18">非 PREEMPT_RT 语境；mutex 无竞争时走快速路径，也可能先乐观自旋。</text><text x="35" y="588" font-size="18">唤醒不等于已经取得锁；自旋也不意味着能安全地在持锁区间睡眠。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">SQE 与 CQE 的生命周期</title><desc id="d">用户从提交环取一个空位填操作，submit 后用一次 io_uring_enter 交给内核；内核执行完把结果写进完成环，用户用 wait_cqe 取结果、cqe_seen 归还。提交环的 tail 由用户推进、head 由内核推进，完成环相反。</desc><rect width="1000" height="470" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="44" font-size="24" font-weight="700">SQE 与 CQE 的一生</text><text x="40" y="72" font-size="15" fill="#53647b">读写不再各发一次系统调用：把请求排进提交环，内核做完把结果放回完成环。</text><text x="40" y="104" font-size="13" font-weight="600" fill="#2765b1">用户态</text><text x="600" y="104" font-size="13" font-weight="600" fill="#23775b">内核态</text><path d="M560 96 L640 96" stroke="#c9d4e2" stroke-width="1" stroke-dasharray="4 4"/><rect x="30" y="116" width="176" height="70" rx="8" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="46" y="140" font-size="12" font-family="Menlo,Consolas,monospace" fill="#2765b1">io_uring_get_sqe</text><text x="46" y="162" font-size="12" fill="#23354d">从提交环拿一个空位</text><rect x="218" y="116" width="176" height="70" rx="8" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="234" y="140" font-size="12" font-family="Menlo,Consolas,monospace" fill="#2765b1">prep_accept</text><text x="234" y="162" font-size="12" fill="#23354d">填操作，写 user_data</text><rect x="406" y="116" width="176" height="70" rx="8" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="422" y="140" font-size="12" font-family="Menlo,Consolas,monospace" fill="#2765b1">io_uring_submit</text><text x="422" y="162" font-size="12" fill="#23354d">一次 enter 提交一批</text><rect x="594" y="116" width="176" height="70" rx="8" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="610" y="140" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23775b">内核执行</text><text x="610" y="162" font-size="12" fill="#23354d">accept / recv / send</text><rect x="782" y="116" width="186" height="70" rx="8" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="798" y="140" font-size="12" font-family="Menlo,Consolas,monospace" fill="#2765b1">wait_cqe + cqe_seen</text><text x="798" y="162" font-size="12" fill="#23354d">取结果，再归还空位</text><path d="M206 151 L212 151 M394 151 L400 151 M582 151 L588 151 M770 151 L776 151" stroke="#9fb3cc" stroke-width="1.5"/><text x="40" y="222" font-size="14" font-weight="600" fill="#2765b1">提交环 SQ</text><rect x="40" y="234" width="620" height="52" rx="6" fill="#eaf3ff" stroke="#c3d8f0"/><rect x="46" y="240" width="600" height="40" rx="4" fill="#d7e7fb"/><text x="60" y="265" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">head（内核推进）　…　tail（用户推进）</text><text x="676" y="256" font-size="12" fill="#4a6f9c">用户填完一项，tail 前进一格；</text><text x="676" y="276" font-size="12" fill="#4a6f9c">内核取走一项，head 前进一格。</text><text x="40" y="330" font-size="14" font-weight="600" fill="#23775b">完成环 CQ</text><rect x="40" y="342" width="620" height="52" rx="6" fill="#e9f7f1" stroke="#c3e0d4"/><rect x="46" y="348" width="600" height="40" rx="4" fill="#d3efe4"/><text x="60" y="373" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">head（用户推进）　…　tail（内核推进）</text><text x="676" y="364" font-size="12" fill="#3f6d5c">内核写完一项，tail 前进一格；</text><text x="676" y="384" font-size="12" fill="#3f6d5c">用户 seen 一项，head 前进一格。</text><path d="M350 286 L350 300 M350 334 L350 348" stroke="#9fb3cc" stroke-width="1.5"/><text x="362" y="318" font-size="12" fill="#7f92aa">内核读 SQE，执行后写 CQE</text><text x="40" y="426" font-size="13" fill="#53647b">漏掉一次 cqe_seen，完成环的 head 不前进；环满之后 wait_cqe 再也拿不到新事件。这个环是用户与内核共享的内存，不经过系统调用。</text><text x="40" y="450" font-size="13" fill="#7f92aa">cqe-&gt;res 等于对应系统调用的返回值：accept 返回 fd，recv 返回字节数，出错返回负的 errno。</text></g></svg>

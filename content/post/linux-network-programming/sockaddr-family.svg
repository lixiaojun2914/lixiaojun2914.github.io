<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">sockaddr 与它的三个具体形态</title><desc id="d">bind、connect、accept 都接收 struct sockaddr 指针和一个长度参数；内核读前两个字节的 family，再按对应结构解释后面的字段。IPv4 结构是 16 字节，IPv6 是 28 字节，Unix 域按路径长度决定。</desc><rect width="1000" height="470" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="44" font-size="24" font-weight="700">struct sockaddr 与它的三个具体形态</text><text x="40" y="74" font-size="15" fill="#53647b">函数只认 struct sockaddr *，实际传的是下面某一种；长度参数决定内核解释多少字节。</text><rect x="40" y="92" width="640" height="34" rx="6" fill="#eef4fc" stroke="#c3d8f0"/><text x="56" y="115" font-size="14" font-family="Menlo,Consolas,monospace" fill="#2765b1">bind(fd, (struct sockaddr *)&amp;a, sizeof(a))</text><text x="700" y="115" font-size="13" fill="#53647b">a 是 sockaddr_in / in6 / un 之一</text><text x="40" y="152" font-size="14" font-weight="600" fill="#2765b1">struct sockaddr_in　AF_INET</text><text x="355" y="152" font-size="14" font-weight="600" fill="#23775b">struct sockaddr_in6　AF_INET6</text><text x="670" y="152" font-size="14" font-weight="600" fill="#8a5a00">struct sockaddr_un　AF_UNIX</text><rect x="40" y="164" width="290" height="150" rx="8" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><rect x="355" y="164" width="290" height="186" rx="8" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><rect x="670" y="164" width="290" height="114" rx="8" fill="#fdf4e3" stroke="#b8873a" stroke-width="1.5"/><rect x="54" y="178" width="262" height="28" rx="4" fill="#d7e7fb"/><text x="66" y="197" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">sin_family</text><text x="278" y="197" font-size="11" fill="#4a6f9c">2 B</text><rect x="54" y="212" width="262" height="28" rx="4" fill="#d7e7fb"/><text x="66" y="231" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">sin_port</text><text x="278" y="231" font-size="11" fill="#4a6f9c">2 B</text><rect x="54" y="246" width="262" height="28" rx="4" fill="#d7e7fb"/><text x="66" y="265" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">sin_addr</text><text x="278" y="265" font-size="11" fill="#4a6f9c">4 B</text><rect x="54" y="280" width="262" height="26" rx="4" fill="#eef4fc" stroke="#c3d8f0" stroke-dasharray="3 3"/><text x="66" y="298" font-size="12" fill="#7f92aa">填充，凑 16 字节</text><text x="40" y="336" font-size="12" fill="#4a6f9c">sizeof = 16，addrlen 传 16</text><rect x="369" y="178" width="262" height="28" rx="4" fill="#d3efe4"/><text x="381" y="197" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">sin6_family</text><text x="593" y="197" font-size="11" fill="#3f6d5c">2 B</text><rect x="369" y="212" width="262" height="28" rx="4" fill="#d3efe4"/><text x="381" y="231" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">sin6_port</text><text x="593" y="231" font-size="11" fill="#3f6d5c">2 B</text><rect x="369" y="246" width="262" height="28" rx="4" fill="#d3efe4"/><text x="381" y="265" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">sin6_flowinfo</text><text x="593" y="265" font-size="11" fill="#3f6d5c">4 B</text><rect x="369" y="280" width="262" height="28" rx="4" fill="#c3e8d9"/><text x="381" y="299" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">sin6_addr</text><text x="593" y="299" font-size="11" fill="#3f6d5c">16 B</text><rect x="369" y="314" width="262" height="26" rx="4" fill="#d3efe4"/><text x="381" y="332" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">sin6_scope_id</text><text x="593" y="332" font-size="11" fill="#3f6d5c">4 B</text><text x="355" y="372" font-size="12" fill="#3f6d5c">sizeof = 28，addrlen 传 28</text><rect x="684" y="178" width="262" height="28" rx="4" fill="#f7e7c8"/><text x="696" y="197" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">sun_family</text><text x="908" y="197" font-size="11" fill="#8a5a00">2 B</text><rect x="684" y="212" width="262" height="52" rx="4" fill="#f7e7c8"/><text x="696" y="233" font-size="12" font-family="Menlo,Consolas,monospace" fill="#23354d">sun_path[]</text><text x="696" y="252" font-size="11" fill="#8a5a00">108 B，文件系统路径</text><text x="670" y="298" font-size="12" fill="#8a5a00">addrlen = 2 + 路径长度，含结尾 0</text><text x="40" y="400" font-size="14" fill="#53647b">三处的长度不能写成 sizeof(struct sockaddr)：它只有 16 字节，IPv6 会被截断成前半段，Unix 域会多读出路径以外的字节。</text><text x="40" y="426" font-size="14" fill="#53647b">accept、recvfrom、getsockname 的长度参数是双向的：传进去缓冲区大小，返回时改写成实际长度，所以要用 socklen_t 变量而不是常量。</text><text x="40" y="452" font-size="13" fill="#7f92aa">内核只读前两个字节的 sa_family，据此决定按哪种结构解释后面。</text></g></svg>

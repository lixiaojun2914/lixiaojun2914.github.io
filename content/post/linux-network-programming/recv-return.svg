<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">recv 返回值的四种含义</title><desc id="d">recv 返回正数是收到的字节数，可能是半条消息；返回 0 表示对端关闭了写方向，不是错误；返回 -1 要按 errno 分三种情况，EAGAIN 表示非阻塞下暂时没数据，EINTR 表示被信号打断，其余才是真错误。</desc><rect width="1000" height="470" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="44" font-size="24" font-weight="700">recv 的返回值，四种含义</text><text x="40" y="74" font-size="15" fill="#53647b">先看返回值本身，再看 errno；0 不是错误，EAGAIN 也不是错误。</text><rect x="40" y="112" width="280" height="86" rx="10" fill="#eef4fc" stroke="#2765b1" stroke-width="1.5"/><text x="60" y="144" font-size="13" font-family="Menlo,Consolas,monospace" fill="#2765b1">n = recv(fd, buf, len, 0)</text><text x="60" y="170" font-size="13" fill="#4a6f9c">返回 ssize_t，不是 int</text><path d="M320 155 L344 155 M344 128 L344 386 M344 128 L370 128" stroke="#9fb3cc" stroke-width="1.5" fill="none"/><path d="M344 194 L370 194 M344 260 L370 260 M344 326 L370 326 M344 392 L370 392" stroke="#9fb3cc" stroke-width="1.5" fill="none"/><rect x="370" y="100" width="590" height="56" rx="8" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="386" y="124" font-size="13" font-weight="600" font-family="Menlo,Consolas,monospace" fill="#23775b">n &gt; 0</text><text x="386" y="144" font-size="13" fill="#23354d">收到 n 字节。字节流上这可能只是半条消息，剩下的还在内核队列里。</text><rect x="370" y="166" width="590" height="56" rx="8" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="386" y="190" font-size="13" font-weight="600" font-family="Menlo,Consolas,monospace" fill="#2765b1">n == 0</text><text x="386" y="210" font-size="13" fill="#23354d">对端关了写方向（发了 FIN）。不是错误，本端仍可以继续写。</text><rect x="370" y="232" width="590" height="56" rx="8" fill="#fdf4e3" stroke="#b8873a" stroke-width="1.5"/><text x="386" y="256" font-size="13" font-weight="600" font-family="Menlo,Consolas,monospace" fill="#8a5a00">n == -1，errno == EAGAIN</text><text x="386" y="276" font-size="13" fill="#23354d">非阻塞且当前没数据。回去等下一次就绪，不要当错误关掉。</text><rect x="370" y="298" width="590" height="56" rx="8" fill="#fdf4e3" stroke="#b8873a" stroke-width="1.5"/><text x="386" y="322" font-size="13" font-weight="600" font-family="Menlo,Consolas,monospace" fill="#8a5a00">n == -1，errno == EINTR</text><text x="386" y="342" font-size="13" fill="#23354d">被信号打断，什么都没发生，直接重试同一个调用。</text><rect x="370" y="364" width="590" height="56" rx="8" fill="#fdeceb" stroke="#b3453c" stroke-width="1.5"/><text x="386" y="388" font-size="13" font-weight="600" font-family="Menlo,Consolas,monospace" fill="#8f2f27">n == -1，其他 errno</text><text x="386" y="408" font-size="13" fill="#23354d">真错误，例如 ECONNRESET（对端 RST）。关闭连接并记录 errno。</text><text x="40" y="452" font-size="13" fill="#7f92aa">send 的返回值同理，只是没有“对端关闭”这一种 0：send 返回 0 只可能是请求长度为 0。</text></g></svg>

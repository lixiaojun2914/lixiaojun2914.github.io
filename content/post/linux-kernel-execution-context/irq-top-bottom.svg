<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">硬中断及时处理与延后处理的职责</title><desc id="desc">设备事件进入硬中断，先确认来源、执行必要设备操作并安排后续工作。后续可选择不能睡眠的软中断或有独立任务上下文的IRQ线程与普通工作队列。并非每次都需要拆出下半部。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="650" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">先完成及时处理，再按需求选择后续执行环境</text><rect x="45" y="95" width="220" height="85" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="155.0" y="130.5" text-anchor="middle" fill="#15304f" font-size="18">设备事件</text><text x="155.0" y="156.5" text-anchor="middle" fill="#15304f" font-size="18">到期 / 数据就绪</text><rect x="385" y="80" width="550" height="120" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="660.0" y="120.0" text-anchor="middle" fill="#15304f" font-size="18">硬中断及时处理 · 上半部</text><text x="660.0" y="146.0" text-anchor="middle" fill="#15304f" font-size="18">核对来源，按设备规则确认或屏蔽</text><text x="660.0" y="172.0" text-anchor="middle" fill="#15304f" font-size="18">保存必要状态，安排后续处理</text><path d="M265 137L385 137" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="70" y="320" width="380" height="110" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="260.0" y="355.0" text-anchor="middle" fill="#15304f" font-size="18">软中断等延后路径</text><text x="260.0" y="381.0" text-anchor="middle" fill="#15304f" font-size="18">仍不能任意睡眠</text><text x="260.0" y="407.0" text-anchor="middle" fill="#15304f" font-size="18">不保证另起一个线程</text><rect x="550" y="320" width="380" height="110" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="740.0" y="355.0" text-anchor="middle" fill="#15304f" font-size="18">IRQ 线程 / 普通工作队列</text><text x="740.0" y="381.0" text-anchor="middle" fill="#15304f" font-size="18">具有相应任务上下文</text><text x="740.0" y="407.0" text-anchor="middle" fill="#15304f" font-size="18">符合约束时可睡眠</text><path d="M525 200V260H260V320" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M800 200V320" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="290" y="250" text-anchor="start" fill="#15304f" font-size="17">按场景选择</text><rect x="135" y="490" width="730" height="65" rx="10" fill="#eef0f4" stroke="#96a8bb"/><text x="500.0" y="528.5" text-anchor="middle" fill="#15304f" font-size="18">完成必要处理与交接后，硬中断即可返回。</text><text x="45" y="603" text-anchor="start" fill="#15304f" font-size="17">延后处理不是固定流水线，应按数据处理需要选择执行环境。</text></g></svg>
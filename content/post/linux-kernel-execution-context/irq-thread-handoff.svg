<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">触控中断从primary交给IRQ线程</title><desc id="desc">硬中断调用默认primary并得到IRQ_WAKE_THREAD。irqaction保存回调、设备数据和线程指针，框架唤醒关联任务，调度后调用thread_fn读取触点并报告输入。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="790" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">同一设备事件，从硬中断交给独立的可调度任务</text><text x="40" y="90" text-anchor="start" fill="#15304f" font-size="19">硬中断上下文</text><rect x="40" y="115" width="255" height="80" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="167.5" y="148.0" text-anchor="middle" fill="#15304f" font-size="18">action.handler</text><text x="167.5" y="174.0" text-anchor="middle" fill="#15304f" font-size="18">及时处理入口</text><rect x="355" y="115" width="275" height="80" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="492.5" y="148.0" text-anchor="middle" fill="#15304f" font-size="18">默认 primary handler</text><text x="492.5" y="174.0" text-anchor="middle" fill="#15304f" font-size="18">返回唤醒请求</text><rect x="700" y="115" width="255" height="80" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="827.5" y="161.0" text-anchor="middle" fill="#15304f" font-size="18">IRQ_WAKE_THREAD</text><path d="M295 155L355 155" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M630 155L700 155" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="40" y="238" text-anchor="start" fill="#15304f" font-size="17">注册时 primary 为 NULL，框架补入默认 handler。</text><rect x="40" y="300" width="350" height="175" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="215.0" y="341.5" text-anchor="middle" fill="#15304f" font-size="18">struct irqaction</text><text x="215.0" y="367.5" text-anchor="middle" fill="#15304f" font-size="18">handler · 及时处理函数</text><text x="215.0" y="393.5" text-anchor="middle" fill="#15304f" font-size="18">thread · 任务指针</text><text x="215.0" y="419.5" text-anchor="middle" fill="#15304f" font-size="18">thread_fn · 驱动线程函数</text><text x="215.0" y="445.5" text-anchor="middle" fill="#15304f" font-size="18">dev_id · 设备私有数据</text><rect x="600" y="315" width="355" height="90" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="777.5" y="353.0" text-anchor="middle" fill="#15304f" font-size="18">IRQ 线程 · task_struct</text><text x="777.5" y="379.0" text-anchor="middle" fill="#15304f" font-size="18">被唤醒后，等待调度执行</text><path d="M390 365L600 365" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="425" y="345" text-anchor="start" fill="#15304f" font-size="17">action.thread</text><path d="M825 195V275H780V315" fill="none" stroke="#3267a8" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="790" y="263" text-anchor="start" fill="#15304f" font-size="17">框架请求唤醒</text><rect x="550" y="520" width="405" height="100" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="752.5" y="550.0" text-anchor="middle" fill="#15304f" font-size="18">action.thread_fn</text><text x="752.5" y="576.0" text-anchor="middle" fill="#15304f" font-size="18">edt_ft5x06_ts_isr()</text><text x="752.5" y="602.0" text-anchor="middle" fill="#15304f" font-size="18">读取触点 → 报告输入</text><path d="M780 405L780 520" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="795" y="470" text-anchor="start" fill="#15304f" font-size="17">获得 CPU 后调用</text><path d="M390 420H450V550H550" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="405" y="505" text-anchor="start" fill="#15304f" font-size="17">thread_fn</text><rect x="40" y="550" width="350" height="75" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="215.0" y="580.5" text-anchor="middle" fill="#15304f" font-size="18">tsdata · 驱动设备对象</text><text x="215.0" y="606.5" text-anchor="middle" fill="#15304f" font-size="18">回调通过 dev_id 取得</text><path d="M390 590L550 590" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="40" y="705" text-anchor="start" fill="#15304f" font-size="18">唤醒不等于立刻执行；IRQ 线程是关联的任务，不是每次事件新建。</text><text x="40" y="750" text-anchor="start" fill="#73859b" font-size="16">实线表示对象关联或调用，虚线表示提交唤醒；设备管理与其他中间步骤省略。</text></g></svg>
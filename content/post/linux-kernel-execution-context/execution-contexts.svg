<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">内核代码的执行上下文</title><desc id="desc">用户任务执行系统调用时仍是同一任务，内核线程也是任务，硬中断则异步进入并可安排软中断或线程上下文中的后续工作。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="610" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">运行内核代码，不代表拥有同一种执行上下文</text><text x="35" y="97" text-anchor="start" fill="#15304f" font-size="19">用户任务</text><rect x="35" y="120" width="225" height="80" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="147.5" y="153.0" text-anchor="middle" fill="#15304f" font-size="18">用户代码</text><text x="147.5" y="179.0" text-anchor="middle" fill="#15304f" font-size="18">task A</text><rect x="380" y="120" width="235" height="80" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="497.5" y="153.0" text-anchor="middle" fill="#15304f" font-size="18">系统调用内核代码</text><text x="497.5" y="179.0" text-anchor="middle" fill="#15304f" font-size="18">仍然是 task A</text><rect x="745" y="120" width="220" height="80" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="855.0" y="166.0" text-anchor="middle" fill="#15304f" font-size="18">返回用户态</text><path d="M260 160L380 160" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M615 160L745 160" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="35" y="267" text-anchor="start" fill="#15304f" font-size="19">独立内核线程</text><rect x="35" y="290" width="280" height="80" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="175.0" y="323.0" text-anchor="middle" fill="#15304f" font-size="18">task B · kthread</text><text x="175.0" y="349.0" text-anchor="middle" fill="#15304f" font-size="18">可调度的任务</text><rect x="430" y="290" width="390" height="80" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="625.0" y="323.0" text-anchor="middle" fill="#15304f" font-size="18">内核线程函数</text><text x="625.0" y="349.0" text-anchor="middle" fill="#15304f" font-size="18">通常无普通用户 mm</text><path d="M315 330L430 330" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="35" y="447" text-anchor="start" fill="#15304f" font-size="19">异步硬件事件</text><rect x="35" y="470" width="230" height="75" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="150.0" y="513.5" text-anchor="middle" fill="#15304f" font-size="18">硬中断处理</text><rect x="390" y="420" width="265" height="65" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="522.5" y="445.5" text-anchor="middle" fill="#15304f" font-size="18">软中断路径</text><text x="522.5" y="471.5" text-anchor="middle" fill="#15304f" font-size="18">不可任意睡眠</text><rect x="690" y="485" width="275" height="75" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="827.5" y="515.5" text-anchor="middle" fill="#15304f" font-size="18">普通 worker / IRQ 线程</text><text x="827.5" y="541.5" text-anchor="middle" fill="#15304f" font-size="18">任务上下文</text><path d="M265 495L390 455" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M265 520L690 520" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M145 470V395H330V235H490V200" fill="none" stroke="#3267a8" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="180" y="254" text-anchor="start" fill="#15304f" font-size="16">可能打断当前执行</text></g></svg>
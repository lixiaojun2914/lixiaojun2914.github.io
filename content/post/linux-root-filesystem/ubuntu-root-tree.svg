<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1508" role="img" aria-labelledby="title desc">
<title id="title">Ubuntu 虚拟机的根目录树</title><desc id="desc">列出根目录第一层，并展开部分重要分支至第三层。蓝色表示挂载，棕色表示符号链接。</desc>
<rect width="860" height="1508" rx="16" fill="#f3f6fa"/>
<rect x="24" y="110" width="812" height="1368" rx="12" fill="#fff"/>
<g font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="42" y="50" font-size="30" font-weight="700" fill="#182436">Ubuntu 根目录树</text>
<text x="42" y="84" font-size="19" fill="#255d9a">蓝色：挂载点</text><text x="240" y="84" font-size="19" fill="#8c4b16">棕色：符号链接</text>
<text x="43" y="143" fill="#255d9a" font-size="22" font-family="Menlo, monospace" xml:space="preserve">/</text>
<text x="420" y="143" fill="#255d9a" font-size="21">ext4 · LVM 逻辑卷</text>
<text x="43" y="172" fill="#8c4b16" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ bin → usr/bin</text>
<text x="420" y="172" fill="#8c4b16" font-size="21">符号链接</text>
<text x="43" y="201" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ bin.usr-is-merged</text>
<text x="420" y="201" fill="#263547" font-size="21">软件包改道目录</text>
<text x="43" y="230" fill="#255d9a" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ boot</text>
<text x="420" y="230" fill="#255d9a" font-size="21">ext4 · 独立挂载</text>
<text x="43" y="259" fill="#255d9a" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  └─ efi</text>
<text x="420" y="259" fill="#255d9a" font-size="21">vfat · 独立挂载</text>
<text x="43" y="288" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ cdrom</text>
<text x="420" y="288" fill="#263547" font-size="21">安装介质入口</text>
<text x="43" y="317" fill="#255d9a" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ dev</text>
<text x="420" y="317" fill="#255d9a" font-size="21">devtmpfs · 设备节点</text>
<text x="43" y="346" fill="#255d9a" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  ├─ pts</text>
<text x="420" y="346" fill="#255d9a" font-size="21">devpts · 伪终端</text>
<text x="43" y="375" fill="#255d9a" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  └─ shm</text>
<text x="420" y="375" fill="#255d9a" font-size="21">tmpfs · 共享内存</text>
<text x="43" y="404" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ etc</text>
<text x="420" y="404" fill="#263547" font-size="21">系统配置</text>
<text x="43" y="433" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  ├─ apt</text>
<text x="420" y="433" fill="#263547" font-size="21">APT 配置</text>
<text x="43" y="462" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  │  └─ sources.list.d</text>
<text x="420" y="462" fill="#263547" font-size="21">软件源配置目录</text>
<text x="43" y="491" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  ├─ netplan</text>
<text x="420" y="491" fill="#263547" font-size="21">网络配置</text>
<text x="43" y="520" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  └─ ssh</text>
<text x="420" y="520" fill="#263547" font-size="21">SSH 配置</text>
<text x="43" y="549" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ home</text>
<text x="420" y="549" fill="#263547" font-size="21">普通用户家目录</text>
<text x="43" y="578" fill="#8c4b16" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ lib → usr/lib</text>
<text x="420" y="578" fill="#8c4b16" font-size="21">符号链接</text>
<text x="43" y="607" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ lib.usr-is-merged</text>
<text x="420" y="607" fill="#263547" font-size="21">软件包改道目录</text>
<text x="43" y="636" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ lost+found</text>
<text x="420" y="636" fill="#263547" font-size="21">ext4 恢复入口</text>
<text x="43" y="665" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ media</text>
<text x="420" y="665" fill="#263547" font-size="21">可移动介质</text>
<text x="43" y="694" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ mnt</text>
<text x="420" y="694" fill="#263547" font-size="21">临时挂载</text>
<text x="43" y="723" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ opt</text>
<text x="420" y="723" fill="#263547" font-size="21">附加软件</text>
<text x="43" y="752" fill="#255d9a" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ proc</text>
<text x="420" y="752" fill="#255d9a" font-size="21">procfs · 进程与内核信息</text>
<text x="43" y="781" fill="#8c4b16" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  └─ self</text>
<text x="420" y="781" fill="#8c4b16" font-size="21">指向访问者自己的进程目录</text>
<text x="43" y="810" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│     └─ fd</text>
<text x="420" y="810" fill="#263547" font-size="21">该进程的文件描述符入口</text>
<text x="43" y="839" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ root</text>
<text x="420" y="839" fill="#263547" font-size="21">root 用户的家目录</text>
<text x="43" y="868" fill="#255d9a" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ run</text>
<text x="420" y="868" fill="#255d9a" font-size="21">tmpfs · 运行时数据</text>
<text x="43" y="897" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  └─ systemd</text>
<text x="420" y="897" fill="#263547" font-size="21">systemd 运行时数据</text>
<text x="43" y="926" fill="#8c4b16" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ sbin → usr/sbin</text>
<text x="420" y="926" fill="#8c4b16" font-size="21">符号链接</text>
<text x="43" y="955" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ sbin.usr-is-merged</text>
<text x="420" y="955" fill="#263547" font-size="21">软件包改道目录</text>
<text x="43" y="984" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ snap</text>
<text x="420" y="984" fill="#263547" font-size="21">Snap 挂载入口</text>
<text x="43" y="1013" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ srv</text>
<text x="420" y="1013" fill="#263547" font-size="21">服务数据</text>
<text x="43" y="1042" fill="#255d9a" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ sys</text>
<text x="420" y="1042" fill="#255d9a" font-size="21">sysfs · 内核对象</text>
<text x="43" y="1071" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  └─ class</text>
<text x="420" y="1071" fill="#263547" font-size="21">按类别组织的设备入口</text>
<text x="43" y="1100" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│     └─ net</text>
<text x="420" y="1100" fill="#263547" font-size="21">网络接口入口</text>
<text x="43" y="1129" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ tmp</text>
<text x="420" y="1129" fill="#263547" font-size="21">临时文件</text>
<text x="43" y="1158" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">├─ usr</text>
<text x="420" y="1158" fill="#263547" font-size="21">系统程序与共享资源</text>
<text x="43" y="1187" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  ├─ bin</text>
<text x="420" y="1187" fill="#263547" font-size="21">程序</text>
<text x="43" y="1216" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  ├─ lib</text>
<text x="420" y="1216" fill="#263547" font-size="21">库及程序相关文件</text>
<text x="43" y="1245" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  └─ local</text>
<text x="420" y="1245" fill="#263547" font-size="21">本地安装的软件</text>
<text x="43" y="1274" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│     └─ bin</text>
<text x="420" y="1274" fill="#263547" font-size="21">本地安装的命令</text>
<text x="43" y="1303" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">└─ var</text>
<text x="420" y="1303" fill="#263547" font-size="21">日志等可变数据</text>
<text x="43" y="1332" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  ├─ cache</text>
<text x="420" y="1332" fill="#263547" font-size="21">缓存</text>
<text x="43" y="1361" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  │  └─ apt</text>
<text x="420" y="1361" fill="#263547" font-size="21">APT 缓存目录</text>
<text x="43" y="1390" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  ├─ lib</text>
<text x="420" y="1390" fill="#263547" font-size="21">持久状态</text>
<text x="43" y="1419" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  │  └─ dpkg</text>
<text x="420" y="1419" fill="#263547" font-size="21">dpkg 软件包状态</text>
<text x="43" y="1448" fill="#263547" font-size="22" font-family="Menlo, monospace" xml:space="preserve">│  └─ log</text>
<text x="420" y="1448" fill="#263547" font-size="21">日志</text>
</g></svg>
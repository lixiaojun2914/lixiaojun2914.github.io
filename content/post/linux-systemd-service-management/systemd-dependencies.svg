<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 730" role="img" aria-labelledby="t d"><title id="t">拉入关系与排序关系，是两个问题</title><desc id="d">Requires或Wants请求把依赖加入启动事务，After只安排同时参与的单元的启动顺序。服务启动完成还由Type协议定义。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="730" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">拉入关系与排序关系，是两个问题</text><rect x="35" y="110" width="500" height="130" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="141" font-size="20" fill="#17324f">Wants=B / Requires=B</text><text x="53" y="170" font-size="20" fill="#17324f">回答：A 启动时，是否把 B 一起请求起来？</text><text x="53" y="199" font-size="20" fill="#17324f">强度不同，排序仍需单独声明。</text><rect x="625" y="110" width="500" height="130" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="643" y="141" font-size="20" fill="#17324f">After=B</text><text x="643" y="170" font-size="20" fill="#17324f">回答：A 与 B 都参与时，先安排谁？</text><text x="643" y="199" font-size="20" fill="#17324f">只声明顺序，不单独请求启动 B。</text><path d="M285 240V285H580V318" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M875 240V285H580" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="180" y="320" width="800" height="100" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="198" y="351" font-size="23" fill="#17324f">A：Requires=B + After=B</text><text x="198" y="380" font-size="23" fill="#17324f">B 的相应启动成功，是 A 推进启动的前提。</text><path d="M580 420L580 458" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="180" y="460" width="800" height="140" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="198" y="491" font-size="21" fill="#17324f">B 的“启动完成”又取决于 Type</text><text x="198" y="520" font-size="21" fill="#17324f">simple：创建进程    exec：执行成功</text><text x="198" y="549" font-size="21" fill="#17324f">notify：收到就绪通知    oneshot：启动命令完成</text><text x="35" y="680" font-size="20" fill="#17324f">排序不是业务健康检查；运行期间的故障传播还需结合具体依赖与服务语义。</text></g></svg>
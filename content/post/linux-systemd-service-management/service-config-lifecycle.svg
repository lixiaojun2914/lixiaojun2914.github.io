<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 750" role="img" aria-labelledby="t d"><title id="t">配置、管理器状态、运行进程，分成三层看</title><desc id="d">修改drop-in后daemon-reload重读管理配置，但不会默认重启服务。服务reload处理业务配置，restart则替换运行流程。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="750" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">配置、管理器状态、运行进程，分成三层看</text><rect x="50" y="120" width="450" height="105" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="68" y="151" font-size="21" fill="#17324f">单元文件 / drop-in</text><text x="68" y="180" font-size="21" fill="#17324f">例如 RestartSec 从 1s 改成 2s</text><rect x="660" y="120" width="450" height="105" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="678" y="151" font-size="21" fill="#17324f">systemd 已加载的配置与依赖</text><text x="678" y="180" font-size="21" fill="#17324f">daemon-reload 后读取新值</text><path d="M500 172L658 172" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="505" y="145" font-size="18" fill="#17324f">重读配置</text><rect x="350" y="345" width="460" height="110" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="368" y="376" font-size="22" fill="#17324f">当前服务进程仍可保持原 PID</text><text x="368" y="405" font-size="22" fill="#17324f">daemon-reload 不等于 restart</text><path d="M885 225V290H580V343" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="50" y="560" width="450" height="100" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="68" y="591" font-size="20" fill="#17324f">reload：服务自己的业务配置协议</text><text x="68" y="620" font-size="20" fill="#17324f">需服务提供对应支持</text><rect x="660" y="560" width="450" height="100" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="678" y="591" font-size="20" fill="#17324f">restart：停止后重新启动</text><text x="678" y="620" font-size="20" fill="#17324f">新执行流程与相应进程身份</text><text x="50" y="710" font-size="20" fill="#17324f">enable 还属于安装关系的维护，与这里的当前进程状态再次分开。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" role="img" aria-labelledby="t d"><title id="t">先准备 socket，再按连接安排处理进程</title><desc id="d">systemd持有回环监听socket，Accept=yes时按连接创建模板服务并把已连接套接字交给标准输入输出，cat回送数据。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="760" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">先准备 socket，再按连接安排处理进程</text><rect x="180" y="100" width="800" height="95" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="198" y="131" font-size="22" fill="#17324f">blog-echo.socket：127.0.0.1:18080</text><text x="198" y="160" font-size="22" fill="#17324f">systemd 管监听入口，此时运行实例可以为 0</text><path d="M580 195L580 228" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="180" y="230" width="800" height="95" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="198" y="261" font-size="22" fill="#17324f">客户端连接到来，Accept=yes</text><text x="198" y="290" font-size="22" fill="#17324f">接收连接，激活 blog-echo@...service 实例</text><path d="M580 325L580 358" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="180" y="360" width="800" height="110" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="198" y="391" font-size="21" fill="#17324f">实例：/usr/bin/cat</text><text x="198" y="420" font-size="21" fill="#17324f">已连接 socket → 标准输入 / 标准输出</text><text x="198" y="449" font-size="21" fill="#17324f">客户端读到 hello</text><path d="M580 470L580 503" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="180" y="505" width="800" height="95" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="198" y="536" font-size="22" fill="#17324f">客户端关闭，cat 读到结束并退出</text><text x="198" y="565" font-size="22" fill="#17324f">监听 socket 仍可为下一次连接保留</text><text x="35" y="680" font-size="18" fill="#17324f">本例 Accept=yes；Accept=no 常把监听描述符交给一个持续服务，不能照搬实例生命周期。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 820" role="img" aria-labelledby="t d"><title id="t">PID 1 延续，根路径与程序映像发生交接</title><desc id="d">内核展开initramfs并执行早期init，早期脚本准备LVM和最终根，run-init交接后PID1运行最终根中的systemd。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1140" height="820" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">PID 1 延续，根路径与程序映像发生交接</text><rect x="85" y="95" width="970" height="95" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="103" y="126" font-size="21" fill="#17324f">内核准备早期 rootfs，展开 initramfs</text><text x="103" y="155" font-size="21" fill="#17324f">执行其中的 /init，进入最初用户空间</text><path d="M570 190L570 223" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="85" y="225" width="970" height="95" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="103" y="256" font-size="21" fill="#17324f">PID 1：initramfs-tools 的 /init 脚本</text><text x="103" y="285" font-size="21" fill="#17324f">发现设备、准备逻辑卷、挂载最终根</text><path d="M570 320L570 353" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="85" y="355" width="970" height="95" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="103" y="386" font-size="21" fill="#17324f">早期环境中的 /root → 最终根设备上的 ext4</text><text x="103" y="415" font-size="21" fill="#17324f">这里是临时挂载位置，不是最终系统里 root 用户的家目录</text><path d="M570 450L570 483" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="85" y="485" width="970" height="95" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="103" y="516" font-size="21" fill="#17324f">run-init 等交接操作</text><text x="103" y="545" font-size="21" fill="#17324f">改变路径基础，exec 最终根中的 init</text><path d="M570 580L570 613" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="85" y="615" width="970" height="95" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="103" y="646" font-size="21" fill="#17324f">PID 1：/usr/lib/systemd/systemd</text><text x="103" y="675" font-size="21" fill="#17324f">同一个初始进程身份，使用最终根与完整用户空间</text><text x="35" y="780" font-size="18" fill="#17324f">本机流程示意；其他系统可在 initramfs 中使用 systemd，具体交接工具与挂载位置也可不同。</text></g></svg>
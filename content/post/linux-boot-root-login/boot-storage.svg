<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 790" role="img" aria-labelledby="t d"><title id="t">同一块盘上的三种启动用途</title><desc id="d">固件使用EFI分区，GRUB从boot分区装入内核和initramfs，早期环境激活LVM并挂载最终ext4根。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="790" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">同一块盘上的三种启动用途</text><rect x="35" y="110" width="350" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="141" font-size="21" fill="#17324f">固件 / EFI 启动程序</text><path d="M385 167L425 167" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="430" y="110" width="695" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="448" y="141" font-size="20" fill="#17324f">nvme0n1p1：VFAT / EFI 程序</text><text x="448" y="170" font-size="20" fill="#17324f">Linux 启动后通常挂到 /boot/efi</text><path d="M210 225L210 298" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="300" width="350" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="331" font-size="21" fill="#17324f">GRUB 读取启动文件</text><path d="M385 357L425 357" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="430" y="300" width="695" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="448" y="331" font-size="20" fill="#17324f">nvme0n1p2：ext4 / 内核与 initramfs</text><text x="448" y="360" font-size="20" fill="#17324f">Linux 启动后挂到 /boot</text><path d="M210 415L210 488" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="490" width="350" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="521" font-size="21" fill="#17324f">早期环境准备最终根</text><path d="M385 547L425 547" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="430" y="490" width="695" height="115" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="448" y="521" font-size="20" fill="#17324f">nvme0n1p3 → LVM → 逻辑卷中的 ext4</text><text x="448" y="550" font-size="20" fill="#17324f">最终成为 /，不是直接挂载 LVM2_member 分区</text><text x="35" y="735" font-size="18" fill="#17324f">图中的 /boot 路径属于运行后的 Linux；固件与 GRUB 按自己的设备和文件系统规则读文件。</text></g></svg>
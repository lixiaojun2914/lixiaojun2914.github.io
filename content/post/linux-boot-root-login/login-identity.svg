<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" role="img" aria-labelledby="t d"><title id="t">登录：查到一个账户，再建立带身份的会话</title><desc id="d">getty/login或sshd按入口策略准备登录，NSS提供账户信息，PAM与入口自身处理认证和会话策略，最终shell以数字凭据运行。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="760" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">登录：查到一个账户，再建立带身份的会话</text><rect x="350" y="100" width="460" height="85" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="368" y="131" font-size="22" fill="#17324f">终端 getty/login 或 SSH 入口</text><path d="M580 185V225H285V258" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M580 225H875V258" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="260" width="500" height="130" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="291" font-size="21" fill="#17324f">账户信息查询：NSS</text><text x="53" y="320" font-size="21" fill="#17324f">名称 → UID / GID / 家目录 / shell</text><text x="53" y="349" font-size="21" fill="#17324f">本地文件或其他配置的来源</text><rect x="625" y="260" width="500" height="130" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="643" y="291" font-size="21" fill="#17324f">认证与账户 / 会话策略</text><text x="643" y="320" font-size="21" fill="#17324f">PAM 与入口自身的协议和配置</text><text x="643" y="349" font-size="21" fill="#17324f">密码、公钥及其他适用认证方式</text><path d="M285 390V435H580V468" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M875 390V435H580" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="220" y="470" width="720" height="100" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="238" y="501" font-size="22" fill="#17324f">按入口协议准备身份、组、环境与会话</text><text x="238" y="530" font-size="22" fill="#17324f">执行用户 shell 或其他指定程序</text><rect x="220" y="610" width="720" height="80" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="238" y="641" font-size="21" fill="#17324f">运行中的进程凭据：数字 UID/GID、附加组等</text><path d="M580 570L580 608" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="35" y="728" font-size="18" fill="#17324f">图按职责组织；不同登录入口的具体顺序不同，服务以 User= 启动也不要求交互登录。</text></g></svg>
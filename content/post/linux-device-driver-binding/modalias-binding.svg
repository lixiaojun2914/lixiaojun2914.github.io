<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="t d"><title id="t">从设备别名，到代码加载，再到设备绑定</title><desc id="d">设备新增公开modalias，经用户态模块别名解析加载e1000e，模块初始化注册驱动，内核再做设备匹配和probe。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1120" height="790" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">从设备别名，到代码加载，再到设备绑定</text><text x="35" y="137" font-size="19" fill="#17324f">内核设备信息</text><rect x="210" y="95" width="865" height="80" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="228" y="126" font-size="21" fill="#17324f">PCI 设备新增，生成 MODALIAS</text><path d="M640 175L640 213" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="35" y="257" font-size="19" fill="#17324f">用户态解析</text><rect x="210" y="215" width="865" height="80" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="228" y="246" font-size="21" fill="#17324f">udev / 模块工具按别名查找 e1000e</text><path d="M640 295L640 333" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="35" y="377" font-size="19" fill="#17324f">加载代码</text><rect x="210" y="335" width="865" height="80" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="228" y="366" font-size="21" fill="#17324f">模块进入内核，初始化函数注册 pci_driver</text><path d="M640 415L640 453" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="35" y="497" font-size="19" fill="#17324f">内核绑定</text><rect x="210" y="455" width="865" height="80" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="228" y="486" font-size="21" fill="#17324f">对已有设备 match → PCI probe → e1000_probe</text><path d="M640 535L640 573" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="35" y="617" font-size="19" fill="#17324f">功能公开</text><rect x="210" y="575" width="865" height="80" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="228" y="606" font-size="21" fill="#17324f">探测中注册网络接口，成功后完成绑定</text><text x="35" y="748" font-size="19" fill="#17324f">解析出模块名 ≠ 模块已加载 ≠ 指定设备已绑定。内建驱动不需要这条模块加载分支。</text></g></svg>
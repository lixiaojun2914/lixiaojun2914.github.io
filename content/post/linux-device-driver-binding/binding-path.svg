<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 860" role="img" aria-labelledby="t d"><title id="t">设备和驱动谁先注册，都有尝试绑定的路径</title><desc id="d">设备注册检查已有驱动，驱动注册检查已有设备，两条路径汇入匹配与通用探测，再到PCI和具体驱动，成功才完成绑定。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1140" height="860" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">设备和驱动谁先注册，都有尝试绑定的路径</text><rect x="35" y="100" width="480" height="105" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="131" font-size="20" fill="#17324f">设备后到：device_add()</text><text x="53" y="160" font-size="20" fill="#17324f">bus_probe_device() → 设备 attach</text><rect x="625" y="100" width="480" height="105" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="643" y="131" font-size="20" fill="#17324f">驱动后到：driver_register()</text><text x="643" y="160" font-size="20" fill="#17324f">bus_add_driver() → driver_attach()</text><path d="M275 205V245H570V278" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M865 205V245H570" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="260" y="280" width="620" height="80" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="278" y="311" font-size="22" fill="#17324f">match：按总线规则选择候选</text><path d="M570 360L570 393" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="260" y="395" width="620" height="100" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="278" y="426" font-size="21" fill="#17324f">really_probe() → call_driver_probe()</text><text x="278" y="455" font-size="21" fill="#17324f">协调通用准备，并选择总线 probe</text><path d="M570 495L570 528" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="260" y="530" width="620" height="100" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="278" y="561" font-size="21" fill="#17324f">PCI 层 → e1000_probe()</text><text x="278" y="590" font-size="21" fill="#17324f">总线准备后，具体驱动尝试初始化设备</text><path d="M570 630L570 663" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="260" y="665" width="620" height="80" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="278" y="696" font-size="20" fill="#17324f">返回成功，完成绑定；失败则清理或延迟重试</text><text x="35" y="808" font-size="19" fill="#17324f">源码主干示意：匹配不是初始化成功；自动与异步探测等设置会影响实际时机。</text></g></svg>
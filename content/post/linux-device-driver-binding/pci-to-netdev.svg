<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 870" role="img" aria-labelledby="t d"><title id="t">从 PCI 设备到网络接口：probe 中建立的新对象</title><desc id="d">e1000_probe分配net_device与私有区，设置设备父指针和驱动私有关联，安装网络操作表，注册网络接口后返回，框架完成底层绑定。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="870" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">从 PCI 设备到网络接口：probe 中建立的新对象</text><rect x="40" y="100" width="480" height="100" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="58" y="131" font-size="21" fill="#17324f">已有 PCI 设备：pdev</text><text x="58" y="160" font-size="21" fill="#17324f">其通用设备部分为 pdev-&gt;dev</text><rect x="640" y="100" width="480" height="100" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="658" y="131" font-size="21" fill="#17324f">alloc_etherdev(...) → netdev</text><text x="658" y="160" font-size="21" fill="#17324f">同时准备 adapter 私有区</text><text x="40" y="255" font-size="21" fill="#17324f">SET_NETDEV_DEV(netdev, &amp;pdev-&gt;dev)</text><path d="M640 150L522 150" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="535" y="124" font-size="17" fill="#17324f">parent</text><rect x="40" y="300" width="1080" height="110" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="58" y="331" font-size="22" fill="#17324f">pci_set_drvdata(pdev, netdev)：从底层设备找到网络对象</text><text x="58" y="360" font-size="22" fill="#17324f">adapter-&gt;pdev / adapter-&gt;netdev：私有状态关联双方</text><path d="M580 410L580 443" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="170" y="445" width="820" height="80" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="188" y="476" font-size="22" fill="#17324f">netdev-&gt;netdev_ops = &amp;e1000e_netdev_ops</text><path d="M580 525L580 558" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="170" y="560" width="820" height="110" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="188" y="591" font-size="21" fill="#17324f">register_netdev(netdev)：网络子系统注册接口</text><text x="188" y="620" font-size="21" fill="#17324f">公开 net 类对象与 sysfs 表达；名称还可能由用户态调整</text><path d="M580 670L580 703" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="170" y="705" width="820" height="80" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="188" y="736" font-size="21" fill="#17324f">probe 返回成功 → 驱动核心完成底层设备的绑定收尾</text><text x="40" y="835" font-size="18" fill="#17324f">此图聚焦对象关联；硬件初始化和失败回滚未展开，网络接口注册发生在 probe 内部。</text></g></svg>
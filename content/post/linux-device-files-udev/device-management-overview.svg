<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1040" role="img" aria-labelledby="t d"><title id="t">设备管理是多个协作分支，不是一条固定流水线</title><desc id="d">设备注册后有匹配、事件通知和适用节点维护三个分工。用户态可加载模块并回到驱动匹配。probe可注册新的网络对象，产生自己的事件，之后完成底层设备绑定。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1320" height="1040" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">设备管理是多个协作分支，不是一条固定流水线</text><rect x="400" y="100" width="520" height="95" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="418" y="131" font-size="21" fill="#17324f">某个设备对象注册：device_add()</text><text x="418" y="160" font-size="21" fill="#17324f">例如第一篇的 PCI 设备</text><path d="M660 195V235H230V278" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M660 235V278" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M660 235H1090V278" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="280" width="390" height="110" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="311" font-size="20" fill="#17324f">已有驱动：match → probe</text><text x="53" y="340" font-size="20" fill="#17324f">尝试准备和接管当前设备</text><rect x="465" y="280" width="390" height="110" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="483" y="311" font-size="20" fill="#17324f">ADD 等对象变化通知</text><text x="483" y="340" font-size="20" fill="#17324f">Netlink → 用户态</text><rect x="895" y="280" width="390" height="110" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="913" y="311" font-size="19" fill="#17324f">适用时维护 devtmpfs 节点</text><text x="913" y="340" font-size="19" fill="#17324f">需相应字符 / 块设备号</text><path d="M230 390L230 438" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="440" width="390" height="110" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="471" font-size="20" fill="#17324f">具体 probe 创建功能对象</text><text x="53" y="500" font-size="20" fill="#17324f">例如 e1000e 的 netdev</text><path d="M230 550L230 598" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="600" width="390" height="110" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="53" y="631" font-size="19" fill="#17324f">注册新的上层对象</text><text x="53" y="660" font-size="19" fill="#17324f">网络接口有自己的 sysfs 与事件</text><path d="M230 710L230 758" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="760" width="390" height="100" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="791" font-size="20" fill="#17324f">probe 成功返回后</text><text x="53" y="820" font-size="20" fill="#17324f">完成底层设备绑定收尾</text><path d="M660 390L660 438" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="465" y="440" width="390" height="110" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="483" y="471" font-size="20" fill="#17324f">udev 处理对象属性与规则</text><text x="483" y="500" font-size="20" fill="#17324f">权限、归属、链接及数据库</text><path d="M660 550L660 598" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="465" y="600" width="390" height="110" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="483" y="631" font-size="20" fill="#17324f">若需要模块：按别名加载</text><text x="483" y="660" font-size="20" fill="#17324f">模块初始化注册驱动</text><path d="M465 655H445V335H427" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="470" y="745" font-size="18" fill="#17324f">新驱动注册后，回到匹配路径。</text><path d="M855 495H880V420H1090V392" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="910" y="477" font-size="18" fill="#17324f">用户态策略可调整节点</text><text x="895" y="570" font-size="18" fill="#17324f">PCI 网卡通常不走节点分支；</text><text x="895" y="601" font-size="18" fill="#17324f">其网络接口经网络子系统使用。</text><rect x="35" y="915" width="1250" height="80" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="53" y="946" font-size="21" fill="#17324f">区分对象与事件：当前设备 ADD 可早于它的 probe；probe 又可注册别的设备对象并产生新事件。</text></g></svg>
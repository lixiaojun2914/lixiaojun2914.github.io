<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 835" role="img" aria-labelledby="t d"><title id="t">设备节点怎样接到实际文件操作</title><desc id="d">路径找到字符设备inode，i_rdev索引cdev，chrdev_open安装memory_fops，memory_open按次设备号选择null或zero操作表。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1120" height="835" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">设备节点怎样接到实际文件操作</text><rect x="90" y="100" width="940" height="105" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="108" y="131" font-size="21" fill="#17324f">open(&quot;/dev/null&quot;) → 找到字符设备 inode</text><text x="108" y="160" font-size="21" fill="#17324f">inode-&gt;i_rdev = 1:3</text><path d="M560 205L560 238" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="90" y="240" width="940" height="105" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="108" y="271" font-size="21" fill="#17324f">chrdev_open() → 查找或复用 cdev</text><text x="108" y="300" font-size="21" fill="#17324f">取得 cdev-&gt;ops，并安装到打开实例 filp</text><path d="M560 345L560 378" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="90" y="380" width="940" height="105" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="108" y="411" font-size="21" fill="#17324f">本例先进入 memory_fops.open = memory_open</text><text x="108" y="440" font-size="21" fill="#17324f">按 iminor(inode) 选择 devlist 表项与操作表</text><path d="M560 485V530H295V563" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M560 530H825V563" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="70" y="565" width="450" height="110" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="88" y="596" font-size="21" fill="#17324f">次设备号 3 → null_fops</text><text x="88" y="625" font-size="21" fill="#17324f">read → 返回 0</text><text x="88" y="654" font-size="21" fill="#17324f">write → 返回 count</text><rect x="600" y="565" width="450" height="110" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="618" y="596" font-size="21" fill="#17324f">若次设备号为 5 → zero_fops</text><text x="618" y="625" font-size="21" fill="#17324f">读取时提供零值字节</text><text x="70" y="735" font-size="19" fill="#17324f">两条分支说明同一主设备号下的不同接口；不是一次打开同时安装两套操作表。</text><text x="70" y="780" font-size="20" fill="#17324f">节点提供类型与设备号；数据语义由最终操作实现决定。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 865" role="img" aria-labelledby="t d"><title id="t">设备公开给用户态：节点与事件是两条分工</title><desc id="d">设备注册按需要通过devtmpfs创建节点，同时通过uevent通知用户态，udev再管理权限链接与属性，并可引出模块加载。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="865" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">设备公开给用户态：节点与事件是两条分工</text><rect x="310" y="95" width="540" height="90" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="328" y="126" font-size="22" fill="#17324f">device_add()：公开设备模型对象</text><path d="M580 185V225H285V263" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M580 225H875V263" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="40" y="265" width="490" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="58" y="296" font-size="20" fill="#17324f">适用的字符 / 块设备对象</text><text x="58" y="325" font-size="20" fill="#17324f">devtmpfs_create_node()</text><text x="58" y="354" font-size="20" fill="#17324f">按设备号与节点规则创建基础入口</text><rect x="630" y="265" width="490" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="648" y="296" font-size="20" fill="#17324f">设备变化通知</text><text x="648" y="325" font-size="20" fill="#17324f">kobject_uevent(ADD 等)</text><text x="648" y="354" font-size="20" fill="#17324f">Netlink → 用户态监听者</text><path d="M875 380L875 423" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="630" y="425" width="490" height="145" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="648" y="456" font-size="20" fill="#17324f">systemd-udevd 按规则处理</text><text x="648" y="485" font-size="20" fill="#17324f">属性数据库、权限、属主、稳定链接</text><text x="648" y="514" font-size="20" fill="#17324f">MODALIAS 还可能引出模块加载</text><text x="648" y="543" font-size="20" fill="#17324f">→ 驱动注册与绑定</text><path d="M630 500H570V415H285V382" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="65" y="475" font-size="18" fill="#17324f">用户态策略可调整节点或创建附加链接</text><rect x="40" y="600" width="1080" height="105" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="58" y="631" font-size="21" fill="#17324f">不是所有设备都需要 /dev 节点；网络接口主要经网络子系统接口访问。</text><text x="58" y="660" font-size="21" fill="#17324f">ADD 是对象新增通知，不承诺此时 probe 已成功。</text><text x="40" y="765" font-size="21" fill="#17324f">devtmpfs：基础节点维护    uevent：通知变化    udev：用户态策略与管理</text><text x="40" y="812" font-size="18" fill="#17324f">此图按职责组织，实际执行包含异步时机，不能据此推导用户态接收事件的完整时间线。</text></g></svg>
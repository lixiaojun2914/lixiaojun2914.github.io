<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">配置路径：请求、内核状态、回执与通知</title><desc id="d">RTM_NEWADDR 修改地址状态；同步回执和异步通知分开。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="470" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">配置路径：请求、内核状态、回执与通知</text><rect x="35" y="100" width="240" height="120" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="53" y="131" font-size="19" fill="#2765b1">ip addr add</text><text x="53" y="158" font-size="16" fill="#53647b">NETLINK_ROUTE</text><text x="53" y="182" font-size="16" fill="#53647b">RTM_NEWADDR</text><rect x="375" y="100" width="280" height="120" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="393" y="131" font-size="19" fill="#23775b">inet_rtm_newaddr</text><text x="393" y="158" font-size="16" fill="#53647b">定位 a0 / 校验属性</text><text x="393" y="182" font-size="16" fill="#53647b">更新 IPv4 地址状态</text><rect x="755" y="100" width="210" height="120" rx="12" fill="#f2edfc" stroke="#7450ac" stroke-width="1.5"/><text x="773" y="131" font-size="19" fill="#7450ac">ip 查询 / monitor</text><text x="773" y="158" font-size="16" fill="#53647b">读取状态或通知</text><path d="M275 140 L375 140" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="333.0" y="130.0" font-size="14" fill="#53647b">请求</text><path d="M375 195 L275 195" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="333.0" y="185.0" font-size="14" fill="#53647b">ACK</text><path d="M655 160 L755 160" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="713.0" y="150.0" font-size="14" fill="#53647b">通知</text><rect x="375" y="310" width="280" height="100" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="393" y="341" font-size="19" fill="#ad641b">运行态地址对象</text><text x="393" y="368" font-size="16" fill="#53647b">net_device → IPv4 状态</text><path d="M515 220 L515 310" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="40" y="450" font-size="16" fill="#53647b">持久配置由网络管理工具负责；不是 Netlink 自动写入启动配置。</text></g></svg>
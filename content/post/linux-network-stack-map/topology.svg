<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">实验拓扑：两个端点，一条虚拟链路</title><desc id="d">A 与 B 位于两个网络命名空间，strace 在应用侧，tcpdump 在接口侧。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="360" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">实验拓扑：两个端点，一条虚拟链路</text><rect x="50" y="100" width="300" height="140" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="68" y="131" font-size="19" fill="#2765b1">nslab-a</text><text x="68" y="158" font-size="16" fill="#53647b">A：10.77.1.1/24</text><text x="68" y="182" font-size="16" fill="#53647b">a0 / C 发送程序</text><rect x="650" y="100" width="300" height="140" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="668" y="131" font-size="19" fill="#23775b">nslab-b</text><text x="668" y="158" font-size="16" fill="#53647b">B：10.77.1.2/24</text><text x="668" y="182" font-size="16" fill="#53647b">b0 / C 接收程序</text><path d="M350 170 L650 170" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="508.0" y="160.0" font-size="14" fill="#53647b">veth pair</text><text x="55" y="285" font-size="16" fill="#53647b">strace：观察调用与返回</text><text x="570" y="285" font-size="16" fill="#53647b">tcpdump：观察 a0 / b0 可见流量</text></g></svg>
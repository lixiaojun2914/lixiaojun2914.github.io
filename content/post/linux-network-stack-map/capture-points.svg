<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">抓包位置：发送与接收分别看</title><desc id="d">普通发送路径在交给驱动前向 packet socket 提供副本；普通接收 packet tap 可先于 tc ingress。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6b7b91"/></marker></defs><rect width="1000" height="640" rx="16" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="35" y="45" font-size="24" font-weight="600">抓包位置：发送与接收分别看</text><text x="40" y="84" font-size="18" fill="#23354d">发送方向</text><rect x="40" y="100" width="200" height="76" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="56" y="130" font-size="17" fill="#2765b1">qdisc / 发送调度</text><path d="M240 138 H280" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="100" width="200" height="76" rx="11" fill="#f2eefc" stroke="#6a4bb5" stroke-width="1.5"/><text x="296" y="130" font-size="17" fill="#6a4bb5">发送侧 tap</text><path d="M480 138 H520" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="100" width="200" height="76" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="536" y="130" font-size="17" fill="#2765b1">驱动发送</text><path d="M720 138 H760" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="760" y="100" width="200" height="76" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="776" y="130" font-size="17" fill="#2765b1">设备</text><rect x="280" y="240" width="200" height="80" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="296" y="270" font-size="18" fill="#23775b">tcpdump</text><text x="296" y="297" font-size="15" fill="#53647b">取得数据副本</text><path d="M380 176 V240" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="395" y="213" font-size="14" fill="#53647b">复制交付</text><text x="40" y="354" font-size="18" fill="#23354d">接收方向</text><rect x="40" y="370" width="200" height="76" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="56" y="400" font-size="17" fill="#2765b1">设备 / 接收入口</text><path d="M240 408 H280" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="370" width="200" height="76" rx="11" fill="#f2eefc" stroke="#6a4bb5" stroke-width="1.5"/><text x="296" y="400" font-size="17" fill="#6a4bb5">接收侧 tap</text><path d="M480 408 H520" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="370" width="200" height="76" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="536" y="400" font-size="17" fill="#2765b1">tc ingress</text><path d="M720 408 H760" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="760" y="370" width="200" height="76" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="776" y="400" font-size="17" fill="#2765b1">IPv4 协议栈</text><rect x="280" y="510" width="200" height="80" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="296" y="540" font-size="18" fill="#23775b">tcpdump</text><text x="296" y="567" font-size="15" fill="#53647b">取得数据副本</text><path d="M380 446 V510" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="395" y="483" font-size="14" fill="#53647b">复制交付</text><text x="520" y="276" font-size="16" fill="#53647b">看到发送记录后，仍有驱动和设备处理。</text><text x="520" y="546" font-size="16" fill="#53647b">看到接收记录后，数据仍可能被 ingress 丢弃。</text><text x="40" y="618" font-size="15" fill="#53647b">位置按 v6.8 普通设备路径示意；过滤、卸载和抓包丢弃影响最终记录。</text></g></svg>
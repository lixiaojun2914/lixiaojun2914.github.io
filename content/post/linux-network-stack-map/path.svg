<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="1680" viewBox="0 0 1230 1680" role="img" aria-label="一次五字节发送的完整路径：发送侧 S1 到 S7，接收侧 R1 到 R7">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7688"/></marker></defs>
<rect width="1230" height="1680" fill="#ffffff"/>
<text x="30" y="52" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="24" font-weight="700" fill="#1f2733">一个包从 write 到 read 的完整路径</text>
<text x="30" y="84" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14" fill="#5d6878">全文只有一套编号：发送 S1–S7，接收 R1–R7。括号内是内核的 hook 常量号。</text>
<path d="M226,122 L212,122 L212,686 L226,686" fill="none" stroke="#5b7fc7" stroke-width="2"/>
<rect x="24" y="358" width="180" height="92" rx="8" fill="#e8f0fe" stroke="#5b7fc7" stroke-width="1"/>
<text x="114" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="600" fill="#33404f">进程上下文</text>
<text x="114" y="408" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="13" fill="#33404f">系统调用内</text>
<path d="M226,698 L212,698 L212,1406 L226,1406" fill="none" stroke="#c98a3d" stroke-width="2"/>
<rect x="24" y="1006" width="180" height="92" rx="8" fill="#fdf0e3" stroke="#c98a3d" stroke-width="1"/>
<text x="114" y="1034" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="600" fill="#33404f">硬中断</text>
<text x="114" y="1056" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="13" fill="#33404f">与软中断</text>
<path d="M226,1418 L212,1418 L212,1502 L226,1502" fill="none" stroke="#4f9a68" stroke-width="2"/>
<rect x="24" y="1430" width="180" height="60" rx="8" fill="#e9f7ee" stroke="#4f9a68" stroke-width="1"/>
<text x="114" y="1458" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="13" font-weight="600" fill="#33404f">接收进程</text>
<rect x="250" y="132" width="620" height="64" rx="9" fill="#f4f8ff" stroke="#7aa2d6" stroke-width="1.6"/>
<text x="266" y="159" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2f5f9e">S1</text>
<text x="302" y="159" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">write() → __sock_sendmsg → tcp_sendmsg</text>
<text x="302" y="180" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">5 个字节拷进内核，挂到 socket 的发送队列</text>
<line x1="560" y1="196" x2="560" y2="224" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="228" width="620" height="64" rx="9" fill="#f4f8ff" stroke="#7aa2d6" stroke-width="1.6"/>
<text x="266" y="255" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2f5f9e">S2</text>
<text x="302" y="255" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">tcp_write_xmit</text>
<text x="302" y="276" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">拥塞窗口与对端窗口决定这一次能发多少</text>
<line x1="560" y1="292" x2="560" y2="320" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="324" width="620" height="64" rx="9" fill="#f4f8ff" stroke="#7aa2d6" stroke-width="1.6"/>
<text x="266" y="351" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2f5f9e">S3</text>
<text x="302" y="351" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">ip_queue_xmit → __ip_local_out → ip_output</text>
<text x="302" y="372" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">查路由、填 IP 头；中间过 LOCAL_OUT 与 POST_ROUTING</text>
<line x1="560" y1="388" x2="560" y2="416" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="420" width="620" height="64" rx="9" fill="#f4f8ff" stroke="#7aa2d6" stroke-width="1.6"/>
<text x="266" y="447" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2f5f9e">S4</text>
<text x="302" y="447" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">ip_finish_output</text>
<text x="302" y="468" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">超过 MTU 才分片，本例 71 字节直接放过</text>
<line x1="560" y1="484" x2="560" y2="512" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="516" width="620" height="64" rx="9" fill="#f4f8ff" stroke="#7aa2d6" stroke-width="1.6"/>
<text x="266" y="543" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2f5f9e">S5</text>
<text x="302" y="543" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">ip_finish_output2 → neigh_output</text>
<text x="302" y="564" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">下一跳 IP 换成以太网地址；ARP 未解析时在此排队</text>
<line x1="560" y1="580" x2="560" y2="608" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="612" width="620" height="64" rx="9" fill="#f4f8ff" stroke="#7aa2d6" stroke-width="1.6"/>
<text x="266" y="639" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2f5f9e">S6</text>
<text x="302" y="639" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">__dev_queue_xmit → tc egress → qdisc</text>
<text x="302" y="660" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">分类、排队，再交给驱动的发送函数</text>
<line x1="560" y1="676" x2="560" y2="704" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="708" width="620" height="64" rx="9" fill="#fffaf1" stroke="#d8a75a" stroke-width="1.6"/>
<text x="266" y="735" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#9a6520">S7</text>
<text x="302" y="735" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">e1000_xmit_frame：填描述符、敲门铃</text>
<text x="302" y="756" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">网卡 DMA 读内存、组帧、上线；veth 没有这一站</text>
<rect x="250" y="852" width="620" height="64" rx="9" fill="#fffaf1" stroke="#d8a75a" stroke-width="1.6"/>
<text x="266" y="879" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#9a6520">R1</text>
<text x="302" y="879" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">DMA 写 rx 环 → MSI-X 中断 → napi_schedule</text>
<text x="302" y="900" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">驱动关掉该队列中断，改为轮询</text>
<line x1="560" y1="916" x2="560" y2="944" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="948" width="620" height="64" rx="9" fill="#f3fbf6" stroke="#6fae86" stroke-width="1.6"/>
<text x="266" y="975" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2b6d45">R2</text>
<text x="302" y="975" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">net_rx_action → e1000_clean_rx_irq</text>
<text x="302" y="996" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">按预算从环上取一批描述符，逐个建 skb</text>
<line x1="560" y1="1012" x2="560" y2="1040" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="1044" width="620" height="64" rx="9" fill="#f3fbf6" stroke="#6fae86" stroke-width="1.6"/>
<text x="266" y="1071" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2b6d45">R3</text>
<text x="302" y="1071" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">napi_gro_receive</text>
<text x="302" y="1092" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">同一条流的连续小段合并，实测约 24:1</text>
<line x1="560" y1="1108" x2="560" y2="1136" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="1140" width="620" height="64" rx="9" fill="#f3fbf6" stroke="#6fae86" stroke-width="1.6"/>
<text x="266" y="1167" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2b6d45">R4</text>
<text x="302" y="1167" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">__netif_receive_skb → tc ingress → ptype</text>
<text x="302" y="1188" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">先过 tc，再按 ethertype 分给 IPv4</text>
<line x1="560" y1="1204" x2="560" y2="1232" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="1236" width="620" height="64" rx="9" fill="#f3fbf6" stroke="#6fae86" stroke-width="1.6"/>
<text x="266" y="1263" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2b6d45">R5</text>
<text x="302" y="1263" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">ip_rcv_core → PRE_ROUTING → 路由 → LOCAL_IN</text>
<text x="302" y="1284" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">判定本地交付还是转发，两个 hook 夹着路由</text>
<line x1="560" y1="1300" x2="560" y2="1328" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="1332" width="620" height="64" rx="9" fill="#f3fbf6" stroke="#6fae86" stroke-width="1.6"/>
<text x="266" y="1359" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2b6d45">R6</text>
<text x="302" y="1359" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">tcp_v4_rcv → tcp_v4_do_rcv</text>
<text x="302" y="1380" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">四元组查连接，数据挂到接收队列</text>
<line x1="560" y1="1396" x2="560" y2="1424" stroke="#6b7688" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="250" y="1428" width="620" height="64" rx="9" fill="#f3fbf6" stroke="#6fae86" stroke-width="1.6"/>
<text x="266" y="1455" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="14.5" font-weight="700" fill="#2b6d45">R7</text>
<text x="302" y="1455" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#1f2733">sk_data_ready → read → tcp_recvmsg</text>
<text x="302" y="1476" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="12" fill="#5d6878">唤醒等待者，把数据拷进用户缓冲区</text>
<line x1="250" y1="796" x2="870" y2="796" stroke="#b9c1cd" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="560" y="787" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#8b95a4">↓ 线路：veth 上对端接收在发送进程里完成；网卡上这里才真正上线</text>
<line x1="870" y1="356" x2="886" y2="356" stroke="#b3452f" stroke-width="1"/>
<circle cx="890" cy="356" r="2.6" fill="#b3452f"/>
<text x="900" y="360" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#b3452f">NF_LOCAL_OUT(3) · NF_POST_ROUTING(4)</text>
<line x1="870" y1="644" x2="886" y2="644" stroke="#8a5a12" stroke-width="1"/>
<circle cx="890" cy="644" r="2.6" fill="#8a5a12"/>
<text x="900" y="648" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#8a5a12">tc egress：tcf_classify</text>
<line x1="870" y1="740" x2="886" y2="740" stroke="#6b7688" stroke-width="1"/>
<circle cx="890" cy="740" r="2.6" fill="#6b7688"/>
<text x="900" y="744" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#6b7688">XDP 在 skb 之前，本图未画</text>
<line x1="870" y1="884" x2="886" y2="884" stroke="#6b7688" stroke-width="1"/>
<circle cx="890" cy="884" r="2.6" fill="#6b7688"/>
<text x="900" y="888" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#6b7688">硬中断 99 次 / 14 575 个包</text>
<line x1="870" y1="1172" x2="886" y2="1172" stroke="#8a5a12" stroke-width="1"/>
<circle cx="890" cy="1172" r="2.6" fill="#8a5a12"/>
<text x="900" y="1176" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#8a5a12">tc ingress：tcf_classify</text>
<line x1="870" y1="1268" x2="886" y2="1268" stroke="#b3452f" stroke-width="1"/>
<circle cx="890" cy="1268" r="2.6" fill="#b3452f"/>
<text x="900" y="1272" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#b3452f">NF_PRE_ROUTING(0) · NF_LOCAL_IN(1)</text>
</svg>

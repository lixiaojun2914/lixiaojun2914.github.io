<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1480" viewBox="0 0 1360 1480" role="img" aria-labelledby="t d"><title id="t">普通 IPv4 TCP 收发路径与路由转发分支</title><desc id="d">左列向下是发送十一站，右列向上是本地接收十三站。右列路由判定向左经 FORWARD 返回发送侧 POST_ROUTING，转发不进入本机传输层。硬件、XDP 与 GRO 按支持条件出现。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6b7b91"/></marker></defs><rect width="1360" height="1480" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="26" fill="#23354d" font-weight="600">普通 IPv4 TCP：发送、本地接收与转发</text><text x="40" y="82" font-size="16" fill="#53647b">箭头表示常见交接次序；XDP/GRO 按条件出现，丢弃、重定向和再次进入协议栈的分支未逐一画出。</text><text x="40" y="116" font-size="19" fill="#2765b1" font-weight="600">本机发送：从上向下</text><text x="820" y="116" font-size="19" fill="#23775b" font-weight="600">本地接收：从下向上</text><rect x="40" y="140" width="500" height="56" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.6"/><text x="56" y="164" font-size="17" fill="#2765b1" font-weight="600">应用 write(fd, buf, 5)</text><text x="56" y="185" font-size="14" fill="#53647b">返回值表示本次接受的字节</text><text x="17" y="173" font-size="14" fill="#8b99aa">1</text><path d="M290 196 V226" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="226" width="500" height="56" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.6"/><text x="56" y="250" font-size="17" fill="#2765b1" font-weight="600">sock_write_iter → socket 操作 → inet_sendmsg</text><text x="56" y="271" font-size="14" fill="#53647b">通过 sock-&gt;sk_prot 进入传输协议</text><text x="17" y="259" font-size="14" fill="#8b99aa">2</text><path d="M290 282 V312" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="312" width="500" height="56" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.6"/><text x="56" y="336" font-size="17" fill="#2765b1" font-weight="600">tcp_sendmsg / tcp_sendmsg_locked</text><text x="56" y="357" font-size="14" fill="#53647b">复制到 skb 关联存储，可追加或新建对象</text><text x="17" y="345" font-size="14" fill="#8b99aa">3</text><path d="M290 368 V398" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="398" width="500" height="56" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.6"/><text x="56" y="422" font-size="17" fill="#2765b1" font-weight="600">tcp_write_xmit → tcp_transmit_skb</text><text x="56" y="443" font-size="14" fill="#53647b">写调用与后续事件均可推动发送</text><text x="17" y="431" font-size="14" fill="#8b99aa">4</text><path d="M290 454 V484" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="484" width="500" height="56" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.6"/><text x="56" y="508" font-size="17" fill="#2765b1" font-weight="600">ip_queue_xmit / __ip_queue_xmit</text><text x="56" y="529" font-size="14" fill="#53647b">使用缓存或查找输出路由</text><text x="17" y="517" font-size="14" fill="#8b99aa">5</text><path d="M290 540 V570" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="570" width="500" height="56" rx="11" fill="#fff4e5" stroke="#a05f00" stroke-width="1.6"/><text x="56" y="594" font-size="17" fill="#a05f00" font-weight="600">NF_INET_LOCAL_OUT</text><text x="56" y="615" font-size="14" fill="#53647b">本机 IPv4 输出；不是转发包的必经点</text><text x="17" y="603" font-size="14" fill="#8b99aa">6</text><path d="M290 626 V656" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="656" width="500" height="56" rx="11" fill="#fff4e5" stroke="#a05f00" stroke-width="1.6"/><text x="56" y="680" font-size="17" fill="#a05f00" font-weight="600">ip_output → NF_INET_POST_ROUTING</text><text x="56" y="701" font-size="14" fill="#53647b">普通本机输出与路由转发在输出后段汇合</text><text x="17" y="689" font-size="14" fill="#8b99aa">7</text><path d="M290 712 V742" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="742" width="500" height="56" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.6"/><text x="56" y="766" font-size="17" fill="#2765b1" font-weight="600">ip_finish_output / __ip_finish_output</text><text x="56" y="787" font-size="14" fill="#53647b">MTU、GSO 等条件处理；TCP 分段 ≠ IP 分片</text><text x="17" y="775" font-size="14" fill="#8b99aa">8</text><path d="M290 798 V828" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="828" width="500" height="56" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.6"/><text x="56" y="852" font-size="17" fill="#2765b1" font-weight="600">ip_finish_output2 → 邻居系统</text><text x="56" y="873" font-size="14" fill="#53647b">使用下一跳链路层地址，必要时等待 ARP</text><text x="17" y="861" font-size="14" fill="#8b99aa">9</text><path d="M290 884 V914" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="914" width="500" height="56" rx="11" fill="#f2eefc" stroke="#6a4bb5" stroke-width="1.6"/><text x="56" y="938" font-size="17" fill="#6a4bb5" font-weight="600">__dev_queue_xmit → tc egress / qdisc</text><text x="56" y="959" font-size="14" fill="#53647b">按配置分类、调度，或直接尝试发送</text><text x="17" y="947" font-size="14" fill="#8b99aa">10</text><path d="M290 970 V1000" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="1000" width="500" height="56" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.6"/><text x="56" y="1024" font-size="17" fill="#2765b1" font-weight="600">ndo_start_xmit → 驱动提交</text><text x="56" y="1045" font-size="14" fill="#53647b">映射数据、准备描述符，随后仍需完成回收</text><text x="17" y="1033" font-size="14" fill="#8b99aa">11</text><rect x="820" y="1172" width="500" height="56" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.6"/><text x="836" y="1196" font-size="17" fill="#23775b" font-weight="600">硬中断通知（本图所选模型）</text><text x="836" y="1217" font-size="14" fill="#53647b">检查事件，按需屏蔽通知并调度 NAPI</text><text x="1329" y="1205" font-size="14" fill="#8b99aa">1</text><path d="M1070 1172 V1142" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="1086" width="500" height="56" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.6"/><text x="836" y="1110" font-size="17" fill="#23775b" font-weight="600">net_rx_action → NAPI 驱动 poll</text><text x="836" y="1131" font-size="14" fill="#53647b">预算限制本次接收工作，未完成则继续安排</text><text x="1329" y="1119" font-size="14" fill="#8b99aa">2</text><path d="M1070 1086 V1056" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="1000" width="500" height="56" rx="11" fill="#e6f7f7" stroke="#1a7f7a" stroke-width="1.6"/><text x="836" y="1024" font-size="17" fill="#1a7f7a" font-weight="600">native/driver XDP（可选，图保留 PASS）</text><text x="836" y="1045" font-size="14" fill="#53647b">驱动支持时可在 skb 创建前处理数据</text><text x="1329" y="1033" font-size="14" fill="#8b99aa">3</text><path d="M1070 1000 V970" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="914" width="500" height="56" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.6"/><text x="836" y="938" font-size="17" fill="#23775b" font-weight="600">组织 skb / eth_type_trans</text><text x="836" y="959" font-size="14" fill="#53647b">准备以太网数据视图及 skb-&gt;protocol</text><text x="1329" y="947" font-size="14" fill="#8b99aa">4</text><path d="M1070 914 V884" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="828" width="500" height="56" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.6"/><text x="836" y="852" font-size="17" fill="#23775b" font-weight="600">GRO（可选）</text><text x="836" y="873" font-size="14" fill="#53647b">满足条件时合并接收处理单位</text><text x="1329" y="861" font-size="14" fill="#8b99aa">5</text><path d="M1070 828 V798" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="742" width="500" height="56" rx="11" fill="#f2eefc" stroke="#6a4bb5" stroke-width="1.6"/><text x="836" y="766" font-size="17" fill="#6a4bb5" font-weight="600">接收核心 → tc ingress</text><text x="836" y="787" font-size="14" fill="#53647b">packet tap 可在此之前，抓到不代表放行</text><text x="1329" y="775" font-size="14" fill="#8b99aa">6</text><path d="M1070 742 V712" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="656" width="500" height="56" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.6"/><text x="836" y="680" font-size="17" fill="#23775b" font-weight="600">协议分发 → ip_rcv</text><text x="836" y="701" font-size="14" fill="#53647b">按类型等条件交付 IPv4，另有设备处理分支</text><text x="1329" y="689" font-size="14" fill="#8b99aa">7</text><path d="M1070 656 V626" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="570" width="500" height="56" rx="11" fill="#fff4e5" stroke="#a05f00" stroke-width="1.6"/><text x="836" y="594" font-size="17" fill="#a05f00" font-weight="600">NF_INET_PRE_ROUTING</text><text x="836" y="615" font-size="14" fill="#53647b">IPv4 输入路由判定前</text><text x="1329" y="603" font-size="14" fill="#8b99aa">8</text><path d="M1070 570 V540" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="484" width="500" height="56" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.6"/><text x="836" y="508" font-size="17" fill="#23775b" font-weight="600">输入路由判定</text><text x="836" y="529" font-size="14" fill="#53647b">本地交付 / 普通转发；其他结果未展开</text><text x="1329" y="517" font-size="14" fill="#8b99aa">9</text><path d="M1070 484 V454" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="398" width="500" height="56" rx="11" fill="#fff4e5" stroke="#a05f00" stroke-width="1.6"/><text x="836" y="422" font-size="17" fill="#a05f00" font-weight="600">NF_INET_LOCAL_IN</text><text x="836" y="443" font-size="14" fill="#53647b">图中本地交付分支</text><text x="1329" y="431" font-size="14" fill="#8b99aa">10</text><path d="M1070 398 V368" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="312" width="500" height="56" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.6"/><text x="836" y="336" font-size="17" fill="#23775b" font-weight="600">tcp_v4_rcv → 连接与协议处理</text><text x="836" y="357" font-size="14" fill="#53647b">查找 sock，检查状态和序号</text><text x="1329" y="345" font-size="14" fill="#8b99aa">11</text><path d="M1070 312 V282" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="226" width="500" height="56" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.6"/><text x="836" y="250" font-size="17" fill="#23775b" font-weight="600">协议处理 → 可交付接收数据</text><text x="836" y="271" font-size="14" fill="#53647b">锁占用时可先入 backlog 等待协议处理</text><text x="1329" y="259" font-size="14" fill="#8b99aa">12</text><path d="M1070 226 V196" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="140" width="500" height="56" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.6"/><text x="836" y="164" font-size="17" fill="#23775b" font-weight="600">数据就绪 → 唤醒 / 就绪通知 → read</text><text x="836" y="185" font-size="14" fill="#53647b">获得 CPU 后，普通接收复制字节到用户缓冲区</text><text x="1329" y="173" font-size="14" fill="#8b99aa">13</text><rect x="580" y="484" width="200" height="56" rx="11" fill="#fff4e5" stroke="#a05f00" stroke-width="1.6"/><text x="596" y="508" font-size="17" fill="#a05f00" font-weight="600">NF_INET_FORWARD</text><text x="596" y="529" font-size="14" fill="#53647b">转发检查 / FORWARD</text><path d="M820 512 H780" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="784" y="500" font-size="13" fill="#a05f00">转发</text><path d="M580 512 H560 V684 H540" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="1082" y="475" font-size="13" fill="#23775b">本地</text><path d="M290 1056 V1260" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="305" y="1175" font-size="15" fill="#53647b">TX：提交后由设备读取数据</text><path d="M1070 1260 V1228" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="1260" width="1280" height="110" rx="12" fill="#f0f2f6" stroke="#8598ae" stroke-width="1.5"/><text x="60" y="1290" font-size="19" fill="#3d4f66" font-weight="600">硬件收发模型：描述符记录地址与状态，数据存放于关联缓冲区</text><text x="60" y="1320" font-size="16" fill="#53647b">发送：驱动填写 DMA 地址等信息 → 设备从数据缓冲区读取 → 链路；DMA 地址不保证等于 CPU 物理地址。</text><text x="60" y="1348" font-size="16" fill="#53647b">接收：设备写入已准备的缓冲区 → 更新描述符状态 → 按策略通知；CPU 负责准备、驱动处理和资源回收。</text><text x="40" y="1410" font-size="16" fill="#53647b">本图不把虚拟链路当作硬件实测：veth 实验不经过这里的 e1000e 收发环。</text><text x="40" y="1440" font-size="16" fill="#53647b">配置侧线：ip / tc / nft 经相应 Netlink 接口修改状态，随后数据路径使用这些状态。</text></g></svg>
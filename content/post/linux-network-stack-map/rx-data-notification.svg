<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">接收时，数据与通知分别交接</title><desc id="d">设备先写接收缓冲区并更新完成状态，再按策略通知内核；驱动 poll 读取状态与缓冲区。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6b7b91"/></marker></defs><rect width="1000" height="470" rx="16" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="35" y="45" font-size="24" font-weight="600">接收时，数据与通知分别交接</text><rect x="40" y="100" width="220" height="100" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="56" y="130" font-size="18" fill="#2765b1">网卡</text><text x="56" y="157" font-size="15" fill="#53647b">接收一份帧</text><rect x="650" y="100" width="310" height="100" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="666" y="130" font-size="18" fill="#23775b">接收缓冲区</text><text x="666" y="157" font-size="15" fill="#53647b">实际的头部与负载字节</text><path d="M260 145 H650" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="350" y="131" font-size="17" fill="#53647b">DMA 写入数据</text><rect x="40" y="310" width="250" height="100" rx="11" fill="#fff4e5" stroke="#a05f00" stroke-width="1.5"/><text x="56" y="340" font-size="18" fill="#a05f00">描述符完成状态</text><text x="56" y="367" font-size="15" fill="#53647b">记录地址、长度与状态</text><path d="M150 200 V310" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="165" y="260" font-size="16" fill="#53647b">设备更新状态</text><rect x="370" y="310" width="240" height="100" rx="11" fill="#f2eefc" stroke="#6a4bb5" stroke-width="1.5"/><text x="386" y="340" font-size="18" fill="#6a4bb5">中断通知</text><text x="386" y="367" font-size="15" fill="#53647b">按策略通知，调度 NAPI</text><path d="M290 360 H370" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="690" y="310" width="270" height="100" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="706" y="340" font-size="18" fill="#23775b">驱动 poll</text><text x="706" y="367" font-size="15" fill="#53647b">检查状态，取出接收数据</text><path d="M610 360 H690" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M825 310 V200" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="840" y="265" font-size="16" fill="#53647b">访问缓冲区</text><text x="40" y="450" font-size="15" fill="#53647b">图选中断驱动模型；忙轮询和线程化 NAPI 使用各自的执行方式。</text></g></svg>
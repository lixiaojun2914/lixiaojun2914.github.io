<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="t d"><title id="t">两种等待：先等协议处理，再等应用读取</title><desc id="d">socket 被持有时数据可先进入 backlog，稍后回调继续 TCP 处理；可交付数据再等待应用消费。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6b7b91"/></marker></defs><rect width="1000" height="490" rx="16" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="35" y="45" font-size="24" font-weight="600">两种等待：先等协议处理，再等应用读取</text><rect x="40" y="110" width="230" height="100" rx="11" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="56" y="140" font-size="18" fill="#2765b1">收到 TCP 数据</text><text x="56" y="167" font-size="15" fill="#53647b">定位相应 socket</text><rect x="370" y="110" width="250" height="100" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="386" y="140" font-size="18" fill="#23775b">TCP 协议处理</text><text x="386" y="167" font-size="15" fill="#53647b">状态、序号与接收组织</text><rect x="720" y="110" width="240" height="100" rx="11" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="736" y="140" font-size="18" fill="#23775b">可交付接收数据</text><text x="736" y="167" font-size="15" fill="#53647b">等待应用读取</text><path d="M270 160 H370" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="280" y="143" font-size="14" fill="#53647b">可继续处理</text><path d="M620 160 H720" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="628" y="143" font-size="14" fill="#53647b">按序可交付</text><rect x="40" y="330" width="230" height="100" rx="11" fill="#fff4e5" stroke="#a05f00" stroke-width="1.5"/><text x="56" y="360" font-size="18" fill="#a05f00">sk_backlog</text><text x="56" y="387" font-size="15" fill="#53647b">等待协议处理机会</text><path d="M155 210 V330" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="170" y="272" font-size="15" fill="#53647b">socket 被持有</text><path d="M270 380 H495 V210" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="330" y="367" font-size="15" fill="#53647b">稍后回调继续处理</text><rect x="720" y="330" width="240" height="100" rx="11" fill="#f2eefc" stroke="#6a4bb5" stroke-width="1.5"/><text x="736" y="360" font-size="18" fill="#6a4bb5">用户缓冲区</text><text x="736" y="387" font-size="15" fill="#53647b">调度后 read() 取回字节</text><path d="M840 210 V330" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="855" y="273" font-size="15" fill="#53647b">就绪通知</text><text x="40" y="470" font-size="15" fill="#53647b">图只展开正常交付主线；协议处理还可能重排、确认或丢弃数据。</text></g></svg>
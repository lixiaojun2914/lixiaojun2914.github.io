<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="t d"><title id="t">NAPI：通知开始，预算控制接收工作</title><desc id="d">中断调度 NAPI，poll 处理工作；未完成时继续，完成后按条件恢复通知。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="530" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">NAPI：通知开始，预算控制接收工作</text><rect x="50" y="100" width="250" height="100" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="68" y="131" font-size="19" fill="#2765b1">设备通知 / 中断</text><text x="68" y="158" font-size="16" fill="#53647b">驱动安排 NAPI</text><rect x="390" y="100" width="250" height="100" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="408" y="131" font-size="19" fill="#23775b">NAPI poll</text><text x="408" y="158" font-size="16" fill="#53647b">Rx work ≤ budget</text><rect x="730" y="100" width="220" height="100" rx="12" fill="#f2edfc" stroke="#7450ac" stroke-width="1.5"/><text x="748" y="131" font-size="19" fill="#7450ac">协议栈</text><text x="748" y="158" font-size="16" fill="#53647b">处理收到的数据</text><path d="M300 150 L390 150" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M640 150 L730 150" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="330" width="250" height="100" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="408" y="361" font-size="19" fill="#ad641b">还有工作？</text><text x="408" y="388" font-size="16" fill="#53647b">有：后续继续 poll</text><text x="408" y="412" font-size="16" fill="#53647b">无：complete 后恢复通知</text><path d="M515 200 L515 330" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M390 380 H340 V150 H390" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="45" y="490" font-size="16" fill="#53647b">本次实测：work 1，budget 64；没有观察到预算耗尽。</text></g></svg>
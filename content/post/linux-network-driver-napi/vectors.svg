<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="t d"><title id="t">MSI-X 向量、接收环与 NAPI 实例的对应关系</title><desc id="d">接收队列 rx-0 对应向量 50 和一个 NAPI 实例，进入软中断后由 napi_poll 处理，受 64 的预算限制；发送完成向量 51 与其他事件向量 52 不经过 NAPI。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="660" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="44" font-size="23" font-weight="700">MSI-X 向量、接收环与 NAPI：一条接收中断线对应一个队列</text><text x="40" y="72" font-size="14" fill="#53647b">以 enp2s0（e1000e，虚拟机）为例，编号与数量取自 /proc/interrupts 和 /sys/class/net/enp2s0/queues/</text><g font-size="13" fill="#7b8aa0"><text x="40" y="104">设备侧</text><text x="290" y="104">MSI-X 向量</text><text x="530" y="104">驱动里的中断处理</text><text x="765" y="104">是不是 NAPI 实例</text></g><rect x="40" y="118" width="215" height="98" rx="12" fill="#eef2f7" stroke="#5b6b80" stroke-width="1.5"/><text x="56" y="148" font-size="18" fill="#33465e">Rx 环 rx-0</text><text x="56" y="172" font-size="14" fill="#53647b">描述符指向接收缓冲区</text><text x="56" y="196" font-size="14" fill="#53647b">一个队列一个环</text><rect x="290" y="118" width="205" height="98" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="306" y="148" font-size="16" font-weight="700" fill="#2765b1">50  enp2s0-rx-0</text><text x="306" y="172" font-size="14" fill="#53647b">向量 0，只报收包</text><text x="306" y="196" font-size="14" fill="#53647b">GICv2m · 0:02:00.0</text><rect x="530" y="118" width="200" height="98" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="546" y="148" font-size="17" fill="#2765b1">硬中断处理</text><text x="546" y="172" font-size="14" fill="#53647b">napi_schedule()</text><text x="546" y="196" font-size="14" fill="#53647b">只排队，不收包</text><rect x="765" y="118" width="175" height="98" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="781" y="148" font-size="17" fill="#23775b">napi_struct</text><text x="781" y="172" font-size="14" fill="#53647b">属于 rx-0 队列</text><text x="781" y="196" font-size="14" fill="#53647b">budget 64</text><path d="M255 167 L284 167" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M495 167 L524 167" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M730 167 L759 167" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="238" width="215" height="92" rx="12" fill="#eef2f7" stroke="#5b6b80" stroke-width="1.5"/><text x="56" y="268" font-size="18" fill="#33465e">Tx 环 tx-0</text><text x="56" y="292" font-size="14" fill="#53647b">已提交、待回收的描述符</text><text x="56" y="316" font-size="14" fill="#53647b">发送侧同样每个队列一个环</text><rect x="290" y="238" width="205" height="92" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="306" y="268" font-size="16" font-weight="700" fill="#ad641b">51  enp2s0-tx-0</text><text x="306" y="292" font-size="14" fill="#53647b">向量 1，只报发送完成</text><text x="306" y="316" font-size="14" fill="#53647b">GICv2m · 0:02:00.0</text><rect x="530" y="238" width="200" height="92" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="546" y="268" font-size="17" fill="#ad641b">硬中断处理</text><text x="546" y="292" font-size="14" fill="#53647b">回收已完成的描述符</text><text x="546" y="316" font-size="14" fill="#53647b">释放缓冲区、唤醒等待者</text><rect x="765" y="238" width="175" height="92" rx="12" fill="#f4f5f7" stroke="#9aa7b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="781" y="268" font-size="16" fill="#6b7b91">不经过 NAPI</text><text x="781" y="292" font-size="14" fill="#7b8aa0">没有 poll</text><text x="781" y="316" font-size="14" fill="#7b8aa0">也不占接收预算</text><path d="M255 284 L284 284" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M495 284 L524 284" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M730 284 L759 284" fill="none" stroke="#6b7b91" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="40" y="352" width="215" height="92" rx="12" fill="#eef2f7" stroke="#5b6b80" stroke-width="1.5"/><text x="56" y="382" font-size="18" fill="#33465e">其他事件</text><text x="56" y="406" font-size="14" fill="#53647b">链路状态变化、统计</text><text x="56" y="430" font-size="14" fill="#53647b">不属于某个收发队列</text><rect x="290" y="352" width="205" height="92" rx="12" fill="#eef2f7" stroke="#5b6b80" stroke-width="1.5"/><text x="306" y="382" font-size="16" font-weight="700" fill="#33465e">52  enp2s0</text><text x="306" y="406" font-size="14" fill="#53647b">向量 2，不分收发</text><text x="306" y="430" font-size="14" fill="#53647b">GICv2m · 0:02:00.0</text><rect x="530" y="352" width="200" height="92" rx="12" fill="#eef2f7" stroke="#5b6b80" stroke-width="1.5"/><text x="546" y="382" font-size="17" fill="#33465e">驱动回调</text><text x="546" y="406" font-size="14" fill="#53647b">链路、watchdog</text><text x="546" y="430" font-size="14" fill="#53647b">周期性检查也可能走这里</text><rect x="765" y="352" width="175" height="92" rx="12" fill="#f4f5f7" stroke="#9aa7b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="781" y="382" font-size="16" fill="#6b7b91">不经过 NAPI</text><text x="781" y="406" font-size="14" fill="#7b8aa0">同样不进 poll</text><path d="M255 398 L284 398" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M495 398 L524 398" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M730 398 L759 398" fill="none" stroke="#6b7b91" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M940 196 H955 V458 H120 V470" fill="none" stroke="#6b7b91" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="40" y="470" width="920" height="140" rx="14" fill="#f2edfc" stroke="#7450ac" stroke-width="1.5"/><text x="60" y="498" font-size="17" font-weight="700" fill="#7450ac">软中断层：每个 CPU 一轮的额度</text><rect x="60" y="510" width="250" height="88" rx="10" fill="#ffffff" stroke="#7450ac" stroke-width="1.2"/><text x="76" y="536" font-size="15" fill="#4a3670">net_rx_action()</text><text x="76" y="560" font-size="13" fill="#53647b">本轮最多 300 个包</text><text x="76" y="580" font-size="13" fill="#53647b">或 2000 µs，先到为准</text><rect x="345" y="510" width="250" height="88" rx="10" fill="#ffffff" stroke="#7450ac" stroke-width="1.2"/><text x="361" y="536" font-size="15" fill="#4a3670">napi_poll(napi, 64)</text><text x="361" y="560" font-size="13" fill="#53647b">这个实例最多取 64 个</text><text x="361" y="580" font-size="13" fill="#53647b">取满就带着 budget 返回</text><rect x="630" y="510" width="310" height="88" rx="10" fill="#ffffff" stroke="#7450ac" stroke-width="1.2"/><text x="646" y="536" font-size="15" fill="#4a3670">返回之后</text><text x="646" y="560" font-size="13" fill="#53647b">取完 → napi_complete_done 恢复中断</text><text x="646" y="580" font-size="13" fill="#53647b">没取完 → 留在 poll_list，再跑一轮</text><path d="M310 554 L339 554" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M595 554 L624 554" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="40" y="638" font-size="13" fill="#7b8aa0">实测：15 个 ping 对应 15~16 次 rx 中断，每次 poll 的 work 是 1；tx 与链路中断不进 poll，也不会被 64 的预算截断。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" role="img" aria-labelledby="title desc">
  <title id="title">普通文件读取从 VFS 分发到 ext4</title>
  <desc id="desc">ksys_read 找到打开对象，vfs_read 选择迭代接口，new_sync_read 准备参数，call_read_iter 调用 ext4_file_read_iter。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="520" height="430" rx="16" fill="#f1f5f9"/>
  <rect x="20" y="18" width="480" height="62" rx="9" fill="#dbeafe"/>
  <text x="36" y="43" font-family="monospace" font-size="19" fill="#172554">ksys_read</text>
  <text x="36" y="66" font-family="PingFang SC, sans-serif" font-size="17" fill="#334155">根据 fd 取得打开对象与当前偏移</text>
  <path d="M260 81V97" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="101" width="480" height="62" rx="9" fill="#dbeafe"/>
  <text x="36" y="126" font-family="monospace" font-size="19" fill="#172554">vfs_read</text>
  <text x="36" y="149" font-family="PingFang SC, sans-serif" font-size="17" fill="#334155">检查读取请求，选择 read_iter 分支</text>
  <path d="M260 164V180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="184" width="480" height="62" rx="9" fill="#dbeafe"/>
  <text x="36" y="209" font-family="monospace" font-size="19" fill="#172554">new_sync_read</text>
  <text x="36" y="232" font-family="PingFang SC, sans-serif" font-size="17" fill="#334155">准备 kiocb 和目的缓冲区迭代器</text>
  <path d="M260 247V263" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="267" width="480" height="62" rx="9" fill="#dbeafe"/>
  <text x="36" y="292" font-family="monospace" font-size="19" fill="#172554">call_read_iter</text>
  <text x="36" y="315" font-family="PingFang SC, sans-serif" font-size="17" fill="#334155">经 file-&gt;f_op-&gt;read_iter 调用 ext4</text>
  <path d="M260 330V346" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="350" width="480" height="62" rx="9" fill="#dcfce7"/>
  <text x="36" y="375" font-family="monospace" font-size="19" fill="#172554">ext4_file_read_iter</text>
  <text x="36" y="398" font-family="PingFang SC, sans-serif" font-size="17" fill="#334155">普通缓冲读进入 generic_file_read_iter</text>
</svg>

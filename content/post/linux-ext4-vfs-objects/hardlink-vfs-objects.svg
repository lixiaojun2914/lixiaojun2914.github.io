<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="title desc">
  <title id="title">两个名字与同一个 inode</title>
  <desc id="desc">两个打开对象的 f_path.dentry 分别指向 original 和 alias 的 dentry，两个 dentry 的 d_inode 指向同一个 inode。图中不画 f_path.mnt。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <rect width="640" height="270" rx="16" fill="#f1f5f9"/>
  <g fill="#dbeafe" stroke="#93c5fd">
    <rect x="40" y="26" width="240" height="50" rx="9"/>
    <rect x="360" y="26" width="240" height="50" rx="9"/>
    <rect x="40" y="111" width="240" height="50" rx="9"/>
    <rect x="360" y="111" width="240" height="50" rx="9"/>
  </g>
  <rect x="200" y="204" width="240" height="46" rx="9" fill="#dcfce7" stroke="#86efac"/>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M160 76V107"/>
    <path d="M480 76V107"/>
    <path d="M160 161V226H196"/>
    <path d="M480 161V226H444"/>
  </g>
  <g fill="#172554" font-family="monospace" font-size="18" text-anchor="middle">
    <text x="160" y="57">struct file A</text>
    <text x="480" y="57">struct file B</text>
    <text x="160" y="142">dentry: original</text>
    <text x="480" y="142">dentry: alias</text>
    <text x="320" y="232">struct inode</text>
  </g>
  <g fill="#334155" font-family="monospace" font-size="13">
    <text x="170" y="98">f_path.dentry</text>
    <text x="490" y="98">f_path.dentry</text>
    <text x="86" y="194">d_inode</text>
    <text x="491" y="194">d_inode</text>
  </g>
</svg>

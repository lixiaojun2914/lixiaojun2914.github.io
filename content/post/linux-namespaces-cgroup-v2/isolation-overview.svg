<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 745" role="img" aria-labelledby="t d"><title id="t">同一个任务，三个不同方向的关联</title><desc id="d">task_struct通过nsproxy关联多种namespace，通过cred关联身份与user namespace，通过cgroups关联控制组状态。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="745" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">同一个任务，三个不同方向的关联</text><rect x="410" y="95" width="340" height="85" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="428" y="126" font-size="25" fill="#17324f">task_struct</text><path d="M580 180V225H190V278" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="280" width="310" height="85" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="311" font-size="23" fill="#17324f">nsproxy</text><rect x="35" y="405" width="310" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="436" font-size="17" fill="#17324f">PID / mount / net / UTS 等视图</text><text x="53" y="465" font-size="17" fill="#17324f">当前与后续子进程的关联需区分</text><path d="M190 365L190 403" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M580 180V225H580V278" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="425" y="280" width="310" height="85" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="443" y="311" font-size="23" fill="#17324f">cred</text><rect x="425" y="405" width="310" height="115" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="443" y="436" font-size="17" fill="#17324f">UID/GID、组与 capabilities</text><text x="443" y="465" font-size="17" fill="#17324f">关联 user namespace 等</text><path d="M580 365L580 403" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M580 180V225H970V278" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="815" y="280" width="310" height="85" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="833" y="311" font-size="23" fill="#17324f">cgroups</text><rect x="815" y="405" width="310" height="115" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="833" y="436" font-size="17" fill="#17324f">css_set 等控制组状态关联</text><text x="833" y="465" font-size="17" fill="#17324f">层级、统计与相应控制器</text><path d="M970 365L970 403" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="65" y="590" width="1030" height="90" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="83" y="621" font-size="23" fill="#17324f">视图不同，不代表换了内核；设置配额，不代表已经隐藏宿主资源。</text></g></svg>
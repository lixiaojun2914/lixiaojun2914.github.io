<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 800" role="img" aria-labelledby="t d"><title id="t">控制组是一棵资源归属与约束的树</title><desc id="d">根下分system.slice与user.slice，服务与用户会话位于不同分支。祖先上限约束后代，namespace变化不自动迁移控制组。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="800" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">控制组是一棵资源归属与约束的树</text><rect x="450" y="95" width="260" height="75" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="468" y="126" font-size="23" fill="#17324f">统一层级 /</text><path d="M580 170V215H290V253" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M580 215H870V253" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="80" y="255" width="420" height="90" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="98" y="286" font-size="24" fill="#17324f">system.slice</text><rect x="660" y="255" width="420" height="90" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="678" y="286" font-size="24" fill="#17324f">user.slice</text><path d="M290 345L290 388" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M870 345L870 388" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="45" y="390" width="490" height="115" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="63" y="421" font-size="22" fill="#17324f">blog-cpu.service</text><text x="63" y="450" font-size="22" fill="#17324f">cpu.max = 25000 100000</text><text x="63" y="479" font-size="22" fill="#17324f">memory.max = 67108864</text><rect x="625" y="390" width="490" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="643" y="421" font-size="21" fill="#17324f">user-1000.slice</text><text x="643" y="450" font-size="21" fill="#17324f">会话 scope / 用户服务等</text><text x="643" y="479" font-size="21" fill="#17324f">UID 相同也可位于不同资源分支</text><rect x="45" y="610" width="1070" height="105" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="63" y="641" font-size="21" fill="#17324f">祖先限制不能靠建立子组绕过；相关权重在层级和竞争关系下解释。</text><text x="63" y="670" font-size="21" fill="#17324f">namespace 改变资源视图，进入它不会自动把进程移到另一个 cgroup。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 740" role="img" aria-labelledby="t d"><title id="t">挂载视图分开，不等于底层文件自动复制</title><desc id="d">两个挂载namespace可以先引用同一底层目录，新环境在路径上覆盖tmpfs后，两边同名路径分别到达tmpfs与原目录。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="740" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">挂载视图分开，不等于底层文件自动复制</text><rect x="45" y="115" width="480" height="100" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="63" y="146" font-size="22" fill="#17324f">宿主 mount namespace</text><text x="63" y="175" font-size="22" fill="#17324f">/run/blog-article-lab</text><rect x="635" y="115" width="480" height="100" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="653" y="146" font-size="22" fill="#17324f">新 mount namespace</text><text x="653" y="175" font-size="22" fill="#17324f">/run/blog-article-lab</text><rect x="45" y="350" width="480" height="120" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="63" y="381" font-size="22" fill="#17324f">原目录：宿主仍看到它</text><text x="63" y="410" font-size="22" fill="#17324f">没有 inside-only 文件</text><path d="M285 215L285 348" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="635" y="350" width="480" height="120" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="653" y="381" font-size="22" fill="#17324f">覆盖挂载的私有 tmpfs</text><text x="653" y="410" font-size="22" fill="#17324f">在其中创建 inside-only</text><path d="M875 215L875 348" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="45" y="565" width="1070" height="95" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="63" y="596" font-size="20" fill="#17324f">没覆盖之前，两侧仍可能访问同一底层文件；普通写入并不会因 unshare 自动隔离。</text><text x="63" y="625" font-size="20" fill="#17324f">本例明确设为 private，实验挂载变化不向宿主传播。</text></g></svg>
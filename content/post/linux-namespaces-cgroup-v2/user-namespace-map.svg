<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 650" role="img" aria-labelledby="t d"><title id="t">user namespace：内部 UID 0 可以对应外部 UID 1000</title><desc id="d">映射示意将内层UID0关联到父用户namespace中的UID1000一个身份，能力检查仍受usernamespace及对象归属限制。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1140" height="650" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">user namespace：内部 UID 0 可以对应外部 UID 1000</text><rect x="40" y="140" width="430" height="130" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="58" y="171" font-size="25" fill="#17324f">内部视图</text><text x="58" y="200" font-size="25" fill="#17324f">UID = 0</text><rect x="670" y="140" width="430" height="130" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="688" y="171" font-size="25" fill="#17324f">父用户命名空间视图</text><text x="688" y="200" font-size="25" fill="#17324f">UID = 1000</text><path d="M470 205L668 205" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="150" y="350" width="840" height="100" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="168" y="381" font-size="23" fill="#17324f">uid_map 示意：0  1000  1</text><text x="168" y="410" font-size="23" fill="#17324f">内部起始 ID / 外部起始 ID / 连续数量</text><text x="40" y="525" font-size="19" fill="#17324f">权限只在相应范围内成立，不自动获得宿主初始 user namespace 的全部 root 权限。</text><text x="40" y="585" font-size="19" fill="#17324f">这是机制示意；本机普通用户的实际创建请求被拒绝，正文保留了真实错误输出。</text></g></svg>
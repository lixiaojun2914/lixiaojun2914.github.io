<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 740" role="img" aria-labelledby="t d"><title id="t">限制写进配置后，程序实际发生什么</title><desc id="d">CPU测试四秒墙上时间获得约一秒CPU，四任务限制允许一个父进程和三个孩子，32MiB内存限制在逐页写入时引发组内OOM终止。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="740" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">限制写进配置后，程序实际发生什么</text><rect x="35" y="100" width="360" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="131" font-size="24" fill="#17324f">CPUQuota=25%</text><path d="M395 157L438 157" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="440" y="100" width="685" height="115" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="458" y="131" font-size="21" fill="#17324f">cpu.max = 25000 100000</text><text x="458" y="160" font-size="21" fill="#17324f">wall 4.023s，cpu 1.021s，ratio 0.254</text><rect x="35" y="280" width="360" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="311" font-size="24" fill="#17324f">TasksMax=4</text><path d="M395 337L438 337" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="440" y="280" width="685" height="115" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="458" y="311" font-size="21" fill="#17324f">一个父进程 + 三个子进程</text><text x="458" y="340" font-size="21" fill="#17324f">后续 fork 被拒绝，不是把 PID 限定为 1～4</text><rect x="35" y="460" width="360" height="115" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="53" y="491" font-size="24" fill="#17324f">MemoryMax=32M</text><path d="M395 517L438 517" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="440" y="460" width="685" height="115" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="458" y="491" font-size="21" fill="#17324f">先 malloc 96 MiB，再逐页写入</text><text x="458" y="520" font-size="21" fill="#17324f">本次 Result=oom-kill，退出信号为 SIGKILL</text><text x="35" y="695" font-size="18" fill="#17324f">结果来自独立实验服务；配额、计费、回收与调度具有各自语义，不能仅按进程看到的数字推断。</text></g></svg>
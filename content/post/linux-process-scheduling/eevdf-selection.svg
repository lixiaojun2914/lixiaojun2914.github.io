<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">EEVDF资格与虚拟截止时间</title><desc id="desc">在虚拟参考100的示例里，A与B有资格，C不合格。虽然A运行时间更小且C截止时间更早，最终在合格者中优先考虑B。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="520" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">先检查资格，再考虑合格者的虚拟 deadline</text><text x="45" y="90" text-anchor="start" fill="#15304f" font-size="18">演算示意：同权实体，虚拟参考时间 V = 100</text><rect x="45" y="135" width="315" height="65" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="202.5" y="173.5" text-anchor="middle" fill="#15304f" font-size="18">A · v=90 · d=130</text><rect x="430" y="135" width="165" height="65" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="512.5" y="173.5" text-anchor="middle" fill="#15304f" font-size="18">有资格</text><rect x="665" y="135" width="290" height="65" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="810.0" y="173.5" text-anchor="middle" fill="#15304f" font-size="18">期限晚于 B</text><path d="M360 167L430 167" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M595 167L665 167" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="45" y="250" width="315" height="65" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="202.5" y="288.5" text-anchor="middle" fill="#15304f" font-size="18">B · v=95 · d=125</text><rect x="430" y="250" width="165" height="65" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="512.5" y="288.5" text-anchor="middle" fill="#15304f" font-size="18">有资格</text><rect x="665" y="250" width="290" height="65" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="810.0" y="288.5" text-anchor="middle" fill="#15304f" font-size="18">优先考虑 B</text><path d="M360 282L430 282" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M595 282L665 282" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="45" y="365" width="315" height="65" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="202.5" y="403.5" text-anchor="middle" fill="#15304f" font-size="18">C · v=115 · d=116</text><rect x="430" y="365" width="165" height="65" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="512.5" y="403.5" text-anchor="middle" fill="#15304f" font-size="18">无资格</text><rect x="665" y="365" width="290" height="65" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="810.0" y="403.5" text-anchor="middle" fill="#15304f" font-size="18">暂不参与期限选择</text><path d="M360 397L430 397" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M595 397L665 397" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="45" y="485" text-anchor="start" fill="#15304f" font-size="17">数字为虚拟单位；这不是应用程序现实时间 deadline 的完成保证。</text></g></svg>
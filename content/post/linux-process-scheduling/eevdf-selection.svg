<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" role="img" aria-labelledby="t d"><title id="t">EEVDF连续选择演算</title><desc id="d">同权任务A和B先比较资格再比较虚拟deadline。A追赶虚拟进度后，B因当前请求的deadline更早而获选。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#436c96"/></marker></defs><rect width="1100" height="670" rx="16" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#17324f"><text x="30" y="42" font-size="24">同权、每份请求 10 单位：先看资格，再看虚拟 deadline</text><text x="35" y="85" font-size="21">初始：参考时间 100</text><rect x="35" y="100" width="490" height="78" rx="10" fill="#e3eefb" stroke="#9fb2c4"/><text x="53" y="130" font-size="18">A：v = 90，d = 100 → 合格</text><rect x="565" y="100" width="490" height="78" rx="10" fill="#eef1f5" stroke="#9fb2c4"/><text x="583" y="130" font-size="18">B：v = 110，d = 115 → 不合格</text><text x="50" y="210" font-size="19">选 A；运行 10 后 v = 100，新 d = 110</text><text x="35" y="260" font-size="21">第二次：参考时间 105</text><rect x="35" y="275" width="490" height="78" rx="10" fill="#e3eefb" stroke="#9fb2c4"/><text x="53" y="305" font-size="18">A：v = 100，d = 110 → 合格</text><rect x="565" y="275" width="490" height="78" rx="10" fill="#eef1f5" stroke="#9fb2c4"/><text x="583" y="305" font-size="18">B：v = 110，d = 115 → 不合格</text><text x="50" y="385" font-size="19">选 A；再运行 10 后 v = 110，新 d = 120</text><text x="35" y="435" font-size="21">第三次：参考时间 110</text><rect x="35" y="450" width="490" height="78" rx="10" fill="#e3eefb" stroke="#9fb2c4"/><text x="53" y="480" font-size="18">A：v = 110，d = 120 → 合格</text><rect x="565" y="450" width="490" height="78" rx="10" fill="#e0f1e8" stroke="#9fb2c4"/><text x="583" y="480" font-size="18">B：v = 110，d = 115 → 合格</text><text x="50" y="560" font-size="19">选 B：两者均合格，115 早于 120</text><text x="35" y="626" font-size="17">v = vruntime；d = 虚拟 deadline。数字为演算示意，B 初始处于一份请求执行到一半的位置。</text></g></svg>
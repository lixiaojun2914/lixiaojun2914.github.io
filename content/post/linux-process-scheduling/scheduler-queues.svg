<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">每CPU运行队列与调度实体</title><desc id="desc">一个CPU的rq包含公平实时和截止期等调度状态，task内的se或rt等实体参与对应类组织，选择next后切换。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="570" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">任务的调度实体，进入对应 CPU 和调度类的组织</text><rect x="45" y="100" width="250" height="95" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="170.0" y="127.5" text-anchor="middle" fill="#15304f" font-size="18">task_struct</text><text x="170.0" y="153.5" text-anchor="middle" fill="#15304f" font-size="18">se / rt / dl</text><text x="170.0" y="179.5" text-anchor="middle" fill="#15304f" font-size="18">按策略使用相应实体</text><rect x="390" y="75" width="550" height="300" rx="10" fill="#eef0f4" stroke="#96a8bb"/><text x="420" y="120" text-anchor="start" fill="#15304f" font-size="21">CPU 0 · struct rq</text><rect x="410" y="165" width="155" height="95" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="487.5" y="205.5" text-anchor="middle" fill="#15304f" font-size="18">cfs · fair</text><text x="487.5" y="231.5" text-anchor="middle" fill="#15304f" font-size="18">相应队列状态</text><rect x="585" y="165" width="155" height="95" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="662.5" y="205.5" text-anchor="middle" fill="#15304f" font-size="18">rt · 实时</text><text x="662.5" y="231.5" text-anchor="middle" fill="#15304f" font-size="18">相应队列状态</text><rect x="760" y="165" width="155" height="95" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="837.5" y="205.5" text-anchor="middle" fill="#15304f" font-size="18">dl · 截止期</text><text x="837.5" y="231.5" text-anchor="middle" fill="#15304f" font-size="18">相应队列状态</text><path d="M295 145L410 205" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="390" y="420" width="550" height="75" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="665.0" y="450.5" text-anchor="middle" fill="#15304f" font-size="18">根据调度类与可运行条件选择 next</text><text x="665.0" y="476.5" text-anchor="middle" fill="#15304f" font-size="18">curr 更新与上下文切换</text><path d="M665 375L665 420" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="45" y="535" text-anchor="start" fill="#15304f" font-size="17">图只展示职责与归属，横向排列不表示调度类优先级顺序。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 424" role="img" aria-labelledby="title desc">
  <title id="title">从 inode 偏移到数据偏移</title>
  <desc id="desc">inode 13 位于镜像字节偏移 154624。读取其 extent 后，将文件偏移 5000 映射到镜像块 4172 内的第 904 字节，即镜像偏移 17089416。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <rect width="560" height="424" rx="16" fill="#f1f5f9"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#172554">

<rect x="20" y="20" width="520" height="78" rx="10" fill="#dbeafe"/>
<text x="36" y="48" font-size="19" font-weight="bold">元数据的位置</text>
<text x="36" y="75" font-size="18">inode 13 → 镜像字节偏移 154624</text>
<path d="M280 100v17" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="121" width="520" height="78" rx="10" fill="#dbeafe"/>
<text x="36" y="149" font-size="19" font-weight="bold">从 inode 读取 extent</text>
<text x="36" y="176" font-size="18">文件逻辑块 0–1 → 镜像块 4171–4172</text>
<path d="M280 201v17" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="222" width="520" height="78" rx="10" fill="#dcfce7"/>
<text x="36" y="250" font-size="19" font-weight="bold">数据在文件内的位置</text>
<text x="36" y="277" font-size="18">文件偏移 5000 → 逻辑块 1，块内偏移 904</text>
<path d="M280 302v17" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="323" width="520" height="78" rx="10" fill="#dcfce7"/>
<text x="36" y="351" font-size="19" font-weight="bold">数据在镜像里的位置</text>
<text x="36" y="378" font-size="18">镜像块 4172 × 4096 + 904 = 17089416</text>
</g></svg>

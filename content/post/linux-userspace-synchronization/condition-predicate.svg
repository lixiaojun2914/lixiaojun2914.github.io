<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">条件变量围绕谓词等待</title><desc id="desc">消费者持mutex检查full，条件未满足时cond_wait协调释放锁并等待。生产者持锁写值和设置full后通知，消费者重新加锁并检查。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="590" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">条件变量负责等待，谓词保存在共享状态里</text><text x="65" y="95" text-anchor="start" fill="#15304f" font-size="20">消费者</text><text x="650" y="95" text-anchor="start" fill="#15304f" font-size="20">生产者</text><rect x="45" y="125" width="365" height="70" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="227.5" y="153.0" text-anchor="middle" fill="#15304f" font-size="18">持有 mutex</text><text x="227.5" y="179.0" text-anchor="middle" fill="#15304f" font-size="18">检查 full / done</text><rect x="45" y="245" width="365" height="80" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="227.5" y="278.0" text-anchor="middle" fill="#15304f" font-size="18">条件不满足：cond_wait</text><text x="227.5" y="304.0" text-anchor="middle" fill="#15304f" font-size="18">协调释放 mutex 并等待</text><rect x="585" y="245" width="365" height="80" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="767.5" y="278.0" text-anchor="middle" fill="#15304f" font-size="18">取得 mutex，写 value / full</text><text x="767.5" y="304.0" text-anchor="middle" fill="#15304f" font-size="18">通知 changed，释放 mutex</text><rect x="45" y="405" width="365" height="85" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="227.5" y="440.5" text-anchor="middle" fill="#15304f" font-size="18">重新取得 mutex</text><text x="227.5" y="466.5" text-anchor="middle" fill="#15304f" font-size="18">循环检查谓词，再消费</text><path d="M225 195L225 245" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M410 285L585 285" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="445" y="267" text-anchor="start" fill="#15304f" font-size="17">锁可用</text><path d="M770 325V447H410" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M225 325L225 405" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="45" y="548" text-anchor="start" fill="#15304f" font-size="18">通知不替代 full；返回不等于条件仍成立，所以等待使用 while 循环。</text></g></svg>
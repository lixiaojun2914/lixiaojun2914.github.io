<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">用户态同步与futex阻塞路径</title><desc id="desc">原子尝试成功时留在用户态，争用时内核比较预期值。值不符则重试，相符则排队等待唤醒，返回后重新检查。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="610" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">用户态管理协议，内核按条件等待与唤醒</text><rect x="45" y="100" width="275" height="80" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="182.5" y="133.0" text-anchor="middle" fill="#15304f" font-size="18">用户态原子尝试</text><text x="182.5" y="159.0" text-anchor="middle" fill="#15304f" font-size="18">取得锁？</text><rect x="660" y="100" width="285" height="80" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="802.5" y="133.0" text-anchor="middle" fill="#15304f" font-size="18">成功：进入临界区</text><text x="802.5" y="159.0" text-anchor="middle" fill="#15304f" font-size="18">完成后按协议释放</text><path d="M320 140L660 140" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="450" y="120" text-anchor="start" fill="#15304f" font-size="18">快速路径</text><rect x="45" y="275" width="275" height="85" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="182.5" y="310.5" text-anchor="middle" fill="#15304f" font-size="18">竞争，需要等待</text><text x="182.5" y="336.5" text-anchor="middle" fill="#15304f" font-size="18">futex wait + 预期值</text><path d="M182 180L182 275" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="425" y="275" width="300" height="85" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="575.0" y="310.5" text-anchor="middle" fill="#15304f" font-size="18">内核同步检查当前值</text><text x="575.0" y="336.5" text-anchor="middle" fill="#15304f" font-size="18">与预期值比较</text><path d="M320 317L425 317" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="425" y="455" width="300" height="85" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="575.0" y="490.5" text-anchor="middle" fill="#15304f" font-size="18">值相符：入队阻塞</text><text x="575.0" y="516.5" text-anchor="middle" fill="#15304f" font-size="18">等待 wake 或其他返回</text><path d="M575 360L575 455" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M725 317H950V215H285V180" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="735" y="297" text-anchor="start" fill="#15304f" font-size="16">值已变：不按旧值睡眠</text><path d="M425 497H350V230H235V180" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="35" y="445" text-anchor="start" fill="#15304f" font-size="16">唤醒后回到</text><text x="35" y="471" text-anchor="start" fill="#15304f" font-size="16">用户态重试</text><text x="45" y="585" text-anchor="start" fill="#15304f" font-size="17">内核不会替等待者直接执行临界区；唤醒不等于锁已归自己。</text></g></svg>
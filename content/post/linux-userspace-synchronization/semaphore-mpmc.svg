<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">信号量与多生产者多消费者队列</title><desc id="desc">两个生产者先取得空槽名额，互斥入队后发布数据名额。两个消费者先取得数据名额，互斥出队后归还空槽。信号量计数与实际队列结构分别由相应协议管理。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="650" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">两个生产者、两个消费者：两个计数 + 一把队列锁</text><text x="40" y="100" text-anchor="start" fill="#15304f" font-size="20">生产者路径 · 2 个线程</text><rect x="40" y="125" width="250" height="90" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="165.0" y="163.0" text-anchor="middle" fill="#15304f" font-size="18">wait(empty_slots)</text><text x="165.0" y="189.0" text-anchor="middle" fill="#15304f" font-size="18">预订一个空槽</text><rect x="375" y="125" width="250" height="90" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="500.0" y="163.0" text-anchor="middle" fill="#15304f" font-size="18">mutex 保护入队</text><text x="500.0" y="189.0" text-anchor="middle" fill="#15304f" font-size="18">写数据，移动 tail</text><rect x="710" y="125" width="250" height="90" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="835.0" y="163.0" text-anchor="middle" fill="#15304f" font-size="18">post(available_items)</text><text x="835.0" y="189.0" text-anchor="middle" fill="#15304f" font-size="18">发布一个数据名额</text><path d="M290 170L375 170" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M625 170L710 170" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="40" y="365" text-anchor="start" fill="#15304f" font-size="20">消费者路径 · 2 个线程</text><rect x="40" y="390" width="250" height="90" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="165.0" y="428.0" text-anchor="middle" fill="#15304f" font-size="18">wait(available_items)</text><text x="165.0" y="454.0" text-anchor="middle" fill="#15304f" font-size="18">取得一个数据名额</text><rect x="375" y="390" width="250" height="90" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="500.0" y="428.0" text-anchor="middle" fill="#15304f" font-size="18">mutex 保护出队</text><text x="500.0" y="454.0" text-anchor="middle" fill="#15304f" font-size="18">读数据，移动 head</text><rect x="710" y="390" width="250" height="90" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="835.0" y="428.0" text-anchor="middle" fill="#15304f" font-size="18">post(empty_slots)</text><text x="835.0" y="454.0" text-anchor="middle" fill="#15304f" font-size="18">归还一个空槽名额</text><path d="M290 435L375 435" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M625 435L710 435" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M835 215V270H20V435H40" fill="none" stroke="#3267a8" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="335" y="258" text-anchor="start" fill="#15304f" font-size="17">数据可用时，消费者可以继续</text><path d="M835 480V535H980V80H20V170H40" fill="none" stroke="#3267a8" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="40" y="575" text-anchor="start" fill="#15304f" font-size="17">先取得名额，再取得 mutex；持队列锁等待名额可能堵住需要归还名额的一方。</text><text x="40" y="620" text-anchor="start" fill="#73859b" font-size="16">名额不绑定某个具体槽；head / tail 与数组读写仍需同一队列锁保护。</text></g></svg>
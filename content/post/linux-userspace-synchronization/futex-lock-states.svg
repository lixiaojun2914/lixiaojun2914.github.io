<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">普通futex三态锁的取得与释放</title><desc id="desc">无竞争时用户态将0改为1并在解锁时改回0，无系统调用。竞争时先用2标记潜在等待者，释放者改为0并唤醒，等待者返回后仍需原子重试取得。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="600" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">0 / 1 / 2 由用户态协议定义，内核不自动交付锁</text><text x="40" y="100" text-anchor="start" fill="#15304f" font-size="20">无竞争路径</text><rect x="40" y="125" width="250" height="85" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="165.0" y="160.5" text-anchor="middle" fill="#15304f" font-size="18">word = 0</text><text x="165.0" y="186.5" text-anchor="middle" fill="#15304f" font-size="18">未持有</text><rect x="375" y="125" width="250" height="85" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="500.0" y="160.5" text-anchor="middle" fill="#15304f" font-size="18">word = 1</text><text x="500.0" y="186.5" text-anchor="middle" fill="#15304f" font-size="18">CAS 成功，持有</text><rect x="710" y="125" width="250" height="85" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="835.0" y="160.5" text-anchor="middle" fill="#15304f" font-size="18">word = 0</text><text x="835.0" y="186.5" text-anchor="middle" fill="#15304f" font-size="18">释放，无需 wake</text><path d="M290 167L375 167" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M625 167L710 167" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="40" y="285" text-anchor="start" fill="#15304f" font-size="20">竞争等待路径</text><rect x="40" y="315" width="205" height="100" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="142.5" y="358.0" text-anchor="middle" fill="#15304f" font-size="18">A 持有</text><text x="142.5" y="384.0" text-anchor="middle" fill="#15304f" font-size="18">word = 1</text><rect x="285" y="315" width="205" height="100" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="387.5" y="358.0" text-anchor="middle" fill="#15304f" font-size="18">B 标记竞争</text><text x="387.5" y="384.0" text-anchor="middle" fill="#15304f" font-size="18">word = 2，等待</text><rect x="530" y="315" width="205" height="100" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="632.5" y="358.0" text-anchor="middle" fill="#15304f" font-size="18">A 释放</text><text x="632.5" y="384.0" text-anchor="middle" fill="#15304f" font-size="18">word = 0，再 wake</text><rect x="775" y="315" width="205" height="100" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="877.5" y="358.0" text-anchor="middle" fill="#15304f" font-size="18">B 再次交换</text><text x="877.5" y="384.0" text-anchor="middle" fill="#15304f" font-size="18">旧值 0 才取得</text><path d="M245 365L285 365" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M490 365L530 365" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M735 365L775 365" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="40" y="478" text-anchor="start" fill="#15304f" font-size="18">2 表示可能有等待者，不是等待人数；慢路径取得后仍保持 2。</text><text x="40" y="528" text-anchor="start" fill="#15304f" font-size="18">若 B 尚未睡下，内核先比较 word；值已变化就返回用户态重试。</text><text x="40" y="575" text-anchor="start" fill="#73859b" font-size="16">wake 只通知重新竞争；图中的原子操作还必须具有所需获取 / 释放顺序。</text></g></svg>
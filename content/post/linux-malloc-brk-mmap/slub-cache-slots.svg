<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-labelledby="t">
<title id="t">一个对象缓存、多个 slab 和其中的对象槽位</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" stroke="#475569" fill="none"/></marker></defs>
<rect width="940" height="390" rx="18" fill="#f8fafc"/>
<g font-family="system-ui,sans-serif" fill="#0f172a">
<text x="24" y="38" font-size="25" font-weight="700">cache 描述一类对象，slab 提供多个槽位</text>
<rect x="240" y="66" width="460" height="54" rx="9" fill="#dbeafe"/>
<text x="470" y="100" text-anchor="middle" font-size="21">kmem_cache · 槽位大小 128 B（示意）</text>
<path d="M360 120L235 172M580 120L705 172" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="24" y="178" width="436" height="132" rx="10" fill="#ccfbf1"/>
<rect x="480" y="178" width="436" height="132" rx="10" fill="#ccfbf1"/>
<text x="242" y="207" text-anchor="middle" font-size="20">slab A · 一张 4 KiB 页（示意）</text>
<text x="698" y="207" text-anchor="middle" font-size="20">slab B · 同一 cache 的另一组页</text>
<g font-size="18" text-anchor="middle">
<rect x="44" y="228" width="88" height="54" fill="#fecdd3" rx="6"/><text x="88" y="262">在用</text>
<rect x="144" y="228" width="88" height="54" fill="#fef3c7" rx="6"/><text x="188" y="262">空闲</text>
<rect x="244" y="228" width="88" height="54" fill="#fef3c7" rx="6"/><text x="288" y="262">空闲</text>
<text x="390" y="262">其余槽位</text>
<rect x="500" y="228" width="88" height="54" fill="#fecdd3" rx="6"/><text x="544" y="262">在用</text>
<rect x="600" y="228" width="88" height="54" fill="#fecdd3" rx="6"/><text x="644" y="262">在用</text>
<rect x="700" y="228" width="88" height="54" fill="#fef3c7" rx="6"/><text x="744" y="262">空闲</text>
<text x="850" y="262">其余槽位</text>
</g>
<text x="24" y="351" font-size="19">申请取出一个槽位；释放归还槽位；需要新 slab 时才向页分配层取得后备。</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 590" role="img" aria-labelledby="t"><title id="t">从用户对象走到物理分配，再返回写入</title><rect width="920" height="590" rx="18" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a">
<text x="24" y="38" font-size="25" font-weight="700">从用户对象走到物理分配，再返回写入</text>
<text x="24" y="99" font-size="19">用户进程</text>
<rect x="230.0" y="65" width="665.0" height="56" rx="9" fill="#dbeafe"/><text x="562.5" y="99" text-anchor="middle" font-size="19">malloc → large 对象 → target</text>
<text x="24" y="184" font-size="19">地址空间</text>
<rect x="230.0" y="150" width="665.0" height="56" rx="9" fill="#ccfbf1"/><text x="562.5" y="184" text-anchor="middle" font-size="19">mm_struct → 覆盖 target 的可写 VMA</text>
<text x="24" y="269" font-size="19">写异常</text>
<rect x="230.0" y="235" width="665.0" height="56" rx="9" fill="#fef3c7"/><text x="562.5" y="269" text-anchor="middle" font-size="19">do_page_fault → handle_mm_fault</text>
<text x="24" y="354" font-size="19">匿名后备</text>
<rect x="230.0" y="320" width="665.0" height="56" rx="9" fill="#dbeafe"/><text x="562.5" y="354" text-anchor="middle" font-size="19">do_anonymous_page → alloc_anon_folio</text>
<text x="24" y="439" font-size="19">物理分配</text>
<rect x="230.0" y="405" width="665.0" height="56" rx="9" fill="#ccfbf1"/><text x="562.5" y="439" text-anchor="middle" font-size="19">节点与 zone → 空闲页 P → 清零</text>
<text x="24" y="524" font-size="19">安装与返回</text>
<rect x="230.0" y="490" width="665.0" height="56" rx="9" fill="#fef3c7"/><text x="562.5" y="524" text-anchor="middle" font-size="19">设置可写 PTE → 返回 → 重试写入 A</text>
</g></svg>
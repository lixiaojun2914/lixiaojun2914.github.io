<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" role="img" aria-labelledby="title"><title id="title">已有空间的复用与系统后备</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" stroke="#475569" fill="none"/></marker></defs><rect width="900" height="392" rx="18" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a"><text x="24" y="38" font-size="25" font-weight="700">已有空间的复用与系统后备</text><rect x="24" y="75" width="240" height="60" rx="8" fill="#dbeafe"/><text x="144.0" y="112.0" font-size="19" text-anchor="middle">malloc(size)</text><rect x="330" y="75" width="546" height="60" rx="8" fill="#ccfbf1"/><text x="603.0" y="112.0" font-size="19" text-anchor="middle">线程 tcache · 已有块命中则返回</text><path d="M264 105 L329 105" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="185" width="546" height="60" rx="8" fill="#ccfbf1"/><text x="603.0" y="222.0" font-size="19" text-anchor="middle">arena · bins / fastbins / top</text><path d="M603 135 L603 184" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="620" y="166" font-size="17">未满足请求 ↓</text><rect x="24" y="305" width="390" height="60" rx="8" fill="#fef3c7"/><text x="219.0" y="342.0" font-size="19" text-anchor="middle">brk / sbrk · 扩展传统堆</text><rect x="456" y="305" width="420" height="60" rx="8" fill="#fef3c7"/><text x="666.0" y="342.0" font-size="19" text-anchor="middle">mmap · 映射块或 arena 后备</text><path d="M460 245 L220 304" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M740 245 L680 304" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="450" y="285" text-anchor="middle" font-size="17">需要更多系统后备时，按来源和策略选择</text></g></svg>
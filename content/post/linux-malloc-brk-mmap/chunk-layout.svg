<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title"><title id="title">同一 chunk 在使用和空闲时的布局</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" stroke="#475569" fill="none"/></marker></defs><rect width="900" height="350" rx="18" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a"><text x="24" y="38" font-size="25" font-weight="700">同一 chunk 在使用和空闲时的布局</text><rect x="24" y="75" width="240" height="65" rx="8" fill="#fef3c7"/><text x="144.0" y="114.5" font-size="19" text-anchor="middle">块头 · 大小与标志</text><rect x="264" y="75" width="612" height="65" rx="8" fill="#dbeafe"/><text x="570.0" y="114.5" font-size="19" text-anchor="middle">已分配时 · 用户可用区</text><rect x="24" y="185" width="240" height="65" rx="8" fill="#fef3c7"/><text x="144.0" y="224.5" font-size="19" text-anchor="middle">块头 · 大小与标志</text><rect x="264" y="185" width="312" height="65" rx="8" fill="#ccfbf1"/><text x="420.0" y="224.5" font-size="19" text-anchor="middle">空闲时 · 链接等信息</text><rect x="576" y="185" width="300" height="65" rx="8" fill="#ccfbf1"/><text x="726.0" y="224.5" font-size="19" text-anchor="middle">剩余可复用空间</text><text x="285" y="166" font-size="17">↑ malloc 返回的用户指针</text><text x="24" y="291" font-size="18">mchunk_size 低位标志 · PREV_INUSE / IS_MMAPPED / NON_MAIN_ARENA</text><text x="24" y="325" font-size="17">布局示意，非按字节比例绘制；空闲字段的使用由块类型决定。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">发送方向的等待，分属不同对象</title><desc id="d">socket 缓冲、qdisc、驱动与设备不能当作同一条大队列。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="400" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">发送方向的等待，分属不同对象</text><rect x="35" y="120" width="190" height="150" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="53" y="151" font-size="19" fill="#2765b1">socket / TCP</text><text x="53" y="178" font-size="16" fill="#53647b">应用提交、窗口</text><text x="53" y="202" font-size="16" fill="#53647b">内存与确认条件</text><rect x="285" y="120" width="190" height="150" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="303" y="151" font-size="19" fill="#ad641b">qdisc</text><text x="303" y="178" font-size="16" fill="#53647b">排队与流调度</text><text x="303" y="202" font-size="16" fill="#53647b">限速、AQM</text><rect x="535" y="120" width="190" height="150" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="553" y="151" font-size="19" fill="#23775b">驱动队列</text><text x="553" y="178" font-size="16" fill="#53647b">描述符资源</text><text x="553" y="202" font-size="16" fill="#53647b">提交与回收</text><rect x="785" y="120" width="190" height="150" rx="12" fill="#f2edfc" stroke="#7450ac" stroke-width="1.5"/><text x="803" y="151" font-size="19" fill="#7450ac">设备 / 链路</text><text x="803" y="178" font-size="16" fill="#53647b">硬件发送</text><text x="803" y="202" font-size="16" fill="#53647b">传播</text><path d="M225 195 L285 195" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M475 195 L535 195" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M725 195 L785 195" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="40" y="330" font-size="16" fill="#53647b">实验瓶颈：A 出口 TBF 5 Mbit/s，分别挂 FIFO / FQ-CoDel 子队列。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">线程任务对象与共享资源</title><desc id="desc">主线程和工作线程各有任务身份、执行状态及内核栈，二者共享mm和files等资源。mm内包含各自的用户栈映射。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3267a8"/></marker></defs><rect width="1000" height="650" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#15304f"><text x="30" y="40" text-anchor="start" fill="#15304f" font-size="24">两个 task，各自执行；共享的资源通过指针关联</text><rect x="40" y="95" width="300" height="165" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="190.0" y="144.5" text-anchor="middle" fill="#15304f" font-size="18">task A · 主线程</text><text x="190.0" y="170.5" text-anchor="middle" fill="#15304f" font-size="18">pid = 1559148</text><text x="190.0" y="196.5" text-anchor="middle" fill="#15304f" font-size="18">tgid = 1559148</text><text x="190.0" y="222.5" text-anchor="middle" fill="#15304f" font-size="18">独立状态 / 寄存器 / 内核栈</text><rect x="40" y="330" width="300" height="165" rx="10" fill="#e3eefb" stroke="#96a8bb"/><text x="190.0" y="379.5" text-anchor="middle" fill="#15304f" font-size="18">task B · 工作线程</text><text x="190.0" y="405.5" text-anchor="middle" fill="#15304f" font-size="18">pid = 1559150</text><text x="190.0" y="431.5" text-anchor="middle" fill="#15304f" font-size="18">tgid = 1559148</text><text x="190.0" y="457.5" text-anchor="middle" fill="#15304f" font-size="18">独立状态 / 寄存器 / 内核栈</text><rect x="610" y="95" width="330" height="85" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="775.0" y="130.5" text-anchor="middle" fill="#15304f" font-size="18">同一个 mm_struct</text><text x="775.0" y="156.5" text-anchor="middle" fill="#15304f" font-size="18">共同的用户虚拟地址空间</text><rect x="610" y="245" width="330" height="70" rx="10" fill="#e1f2eb" stroke="#96a8bb"/><text x="775.0" y="273.0" text-anchor="middle" fill="#15304f" font-size="18">同一个 files_struct</text><text x="775.0" y="299.0" text-anchor="middle" fill="#15304f" font-size="18">共享描述符表</text><rect x="610" y="370" width="330" height="105" rx="10" fill="#fef0d9" stroke="#96a8bb"/><text x="775.0" y="402.5" text-anchor="middle" fill="#15304f" font-size="18">其他共享对象</text><text x="775.0" y="428.5" text-anchor="middle" fill="#15304f" font-size="18">fs_struct</text><text x="775.0" y="454.5" text-anchor="middle" fill="#15304f" font-size="18">signal / sighand</text><path d="M340 135H430V120H610" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M340 370H470V155H610" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M340 210H390V265H610" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M340 440H510V295H610" fill="none" stroke="#3267a8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M340 245H365V390H610" fill="none" stroke="#3267a8" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M340 475H560V445H610" fill="none" stroke="#3267a8" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="470" y="90" text-anchor="start" fill="#15304f" font-size="17">mm</text><text x="440" y="244" text-anchor="start" fill="#15304f" font-size="17">files</text><rect x="110" y="550" width="780" height="60" rx="10" fill="#eef0f4" stroke="#96a8bb"/><text x="500.0" y="586.0" text-anchor="middle" fill="#15304f" font-size="18">mm 中有用户栈 A 和用户栈 B；各线程内核栈另行管理。</text></g></svg>
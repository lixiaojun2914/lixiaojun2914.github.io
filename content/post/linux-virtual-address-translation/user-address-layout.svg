<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 880" role="img" aria-labelledby="t d"><title id="t">用户进程虚拟地址空间布局</title><desc id="d">从下方低地址向上方高地址，示意主程序代码数据、brk堆、空洞、共享库与匿名映射、主线程栈。映射顺序和位置可以变化，不表示连续物理内存。</desc><rect width="1080" height="880" rx="18" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#17324d"><text x="32" y="43" font-size="26">一张进程的虚拟地址地图</text><text x="32" y="78" font-size="18">地址向上递增；示意不按比例，实际布局以 maps 为准。</text><rect x="100" y="126" width="360" height="72" rx="8" fill="#e9e2f5" stroke="#9aafc1"/><text x="116" y="169" font-size="20">主线程用户栈</text><text x="490" y="168" font-size="17">通常向低地址扩展 ↓；参数与环境字符串也在启动栈中</text><rect x="100" y="214" width="360" height="72" rx="8" fill="#eef1f5" stroke="#9aafc1"/><text x="116" y="257" font-size="20">空洞 / 保护间隔</text><text x="490" y="256" font-size="17">未映射区域与无权限映射要区分</text><rect x="100" y="302" width="360" height="72" rx="8" fill="#deedf9" stroke="#9aafc1"/><text x="116" y="345" font-size="20">共享库、匿名映射、文件映射</text><text x="490" y="344" font-size="17">包含线程栈、独立 mmap；vDSO / vvar 可能交错</text><rect x="100" y="390" width="360" height="72" rx="8" fill="#eef1f5" stroke="#9aafc1"/><text x="116" y="433" font-size="20">大段未映射空洞</text><text x="490" y="432" font-size="17">没有 VMA，不意味着占用等量物理内存</text><rect x="100" y="478" width="360" height="72" rx="8" fill="#e0f1e8" stroke="#9aafc1"/><text x="116" y="521" font-size="20">brk 堆</text><text x="490" y="520" font-size="17">可向高地址扩展 ↑；不涵盖所有 malloc 对象</text><rect x="100" y="566" width="360" height="72" rx="8" fill="#fbecd8" stroke="#9aafc1"/><text x="116" y="609" font-size="20">可写数据与 BSS</text><text x="490" y="608" font-size="17">全局 / 静态对象；BSS 没有独立 maps 标签</text><rect x="100" y="654" width="360" height="72" rx="8" fill="#e1eafa" stroke="#9aafc1"/><text x="116" y="697" font-size="20">代码与只读数据</text><text x="490" y="696" font-size="17">程序指令、常量；按权限分为多个映射</text><text x="35" y="120" font-size="20">高</text><text x="35" y="744" font-size="20">低</text><path d="M52 710V150L46 164M52 150L58 164" fill="none" stroke="#436d9e" stroke-width="2"/><text x="100" y="790" font-size="22">同一线性地址空间 ≠ 全部已映射 ≠ 连续物理内存</text><text x="100" y="834" font-size="18">仅展示用户空间；ASLR、架构、加载器及分配方式都会改变位置。</text></g></svg>
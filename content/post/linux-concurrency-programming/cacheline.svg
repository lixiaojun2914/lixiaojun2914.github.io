<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">两个计数器放在一条 cacheline 与各占一条</title><desc id="d">左图两个核写同一 cacheline 的不同字节，该行在核间反复迁移；右图两个变量各占一条 cacheline，两核各写各的，不发生迁移。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b23c3c"/></marker></defs><rect width="1000" height="470" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">同一条 cacheline 上的两个计数器</text><text x="40" y="80" font-size="16" fill="#53647b">两个线程各自只写自己的变量，地址相邻时仍然互相干扰。</text><text x="55" y="130" font-size="19" font-weight="600" fill="#b23c3c">相邻：一条 64 B 行装两个计数器</text><rect x="55" y="150" width="400" height="86" rx="10" fill="#fdecec" stroke="#b23c3c" stroke-width="1.5"/><line x1="255" y1="150" x2="255" y2="236" stroke="#b23c3c" stroke-width="1" stroke-dasharray="5 4"/><text x="75" y="186" font-size="17" fill="#23354d">a</text><text x="75" y="212" font-size="14" fill="#8a5a5a">核 0 写</text><text x="275" y="186" font-size="17" fill="#23354d">b</text><text x="275" y="212" font-size="14" fill="#8a5a5a">核 1 写</text><text x="470" y="186" font-size="15" fill="#b23c3c">同一行</text><text x="470" y="210" font-size="15" fill="#b23c3c">反复失效</text><rect x="55" y="262" width="150" height="46" rx="9" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="80" y="292" font-size="16" fill="#2765b1">核 0</text><rect x="305" y="262" width="150" height="46" rx="9" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="330" y="292" font-size="16" fill="#2765b1">核 1</text><path d="M205 285 L305 285" fill="none" stroke="#b23c3c" stroke-width="2" marker-end="url(#a)"/><path d="M305 300 L205 300" fill="none" stroke="#b23c3c" stroke-width="2" marker-end="url(#a)"/><text x="55" y="345" font-size="16" fill="#53647b">每次写都要先取得该行独占权，另一个核的副本随之失效。</text><text x="55" y="372" font-size="16" fill="#53647b">3.1 ns/次写，2 线程各写 2000 万次。</text><line x1="520" y1="110" x2="520" y2="400" stroke="#c9d4e2" stroke-width="1"/><text x="555" y="130" font-size="19" font-weight="600" fill="#23775b">填充：各占一条 cacheline</text><rect x="555" y="150" width="400" height="42" rx="10" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="575" y="177" font-size="17" fill="#23354d">a</text><text x="700" y="177" font-size="14" fill="#3f6d5c">核 0 写，独占一行</text><rect x="555" y="212" width="400" height="42" rx="10" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="575" y="239" font-size="17" fill="#23354d">b</text><text x="700" y="239" font-size="14" fill="#3f6d5c">核 1 写，独占一行</text><text x="555" y="286" font-size="15" fill="#23775b">两行互不相干，写不需要通知对方</text><text x="555" y="345" font-size="16" fill="#53647b">0.8 ns/次写，约为相邻布局的四分之一。</text><text x="555" y="372" font-size="16" fill="#53647b">代价是每个计数器多占 56 B。</text><text x="40" y="440" font-size="15" fill="#53647b">横向宽度只表示 cacheline 的字节范围，不按字段大小成比例。</text></g></svg>

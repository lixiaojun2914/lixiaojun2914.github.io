<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">单生产者单消费者环的指针归属</title><desc id="d">tail 只由生产者推进，head 只由消费者推进；生产者读 head 判断满，消费者读 tail 判断空，两侧各用一对 acquire 与 release。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="470" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">单生产者单消费者环：谁会推进哪个指针</text><text x="40" y="80" font-size="16" fill="#53647b">容量 1024，下标用 &amp; (1024 - 1) 取模；head 与 tail 是无符号计数，允许回绕。</text><rect x="50" y="170" width="110" height="76" rx="10" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="72" y="202" font-size="17" fill="#2765b1">生产者</text><text x="80" y="228" font-size="14" fill="#53647b">线程 A</text><rect x="760" y="170" width="110" height="76" rx="10" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="782" y="202" font-size="17" fill="#ad641b">消费者</text><text x="790" y="228" font-size="14" fill="#53647b">线程 B</text><g><rect x="250" y="170" width="55" height="40" fill="#e8edf4" stroke="#b7c4d4"/><rect x="305" y="170" width="55" height="40" fill="#e8edf4" stroke="#b7c4d4"/><rect x="360" y="170" width="55" height="40" fill="#dfeaf8" stroke="#8ba9c9"/><rect x="415" y="170" width="55" height="40" fill="#dfeaf8" stroke="#8ba9c9"/><rect x="470" y="170" width="55" height="40" fill="#ffffff" stroke="#b7c4d4"/><rect x="525" y="170" width="55" height="40" fill="#ffffff" stroke="#b7c4d4"/><rect x="580" y="170" width="55" height="40" fill="#ffffff" stroke="#b7c4d4"/><rect x="635" y="170" width="55" height="40" fill="#ffffff" stroke="#b7c4d4"/></g><text x="262" y="196" font-size="13" fill="#7b8a9e">已读</text><text x="317" y="196" font-size="13" fill="#7b8a9e">已读</text><text x="372" y="196" font-size="13" fill="#3c5f85">待读</text><text x="427" y="196" font-size="13" fill="#3c5f85">待读</text><text x="482" y="196" font-size="13" fill="#a8b5c6">空</text><text x="537" y="196" font-size="13" fill="#a8b5c6">空</text><text x="592" y="196" font-size="13" fill="#a8b5c6">空</text><text x="647" y="196" font-size="13" fill="#a8b5c6">空</text><text x="352" y="152" font-size="15" font-weight="600" fill="#ad641b">head</text><text x="470" y="152" font-size="15" font-weight="600" fill="#2765b1">tail</text><path d="M160 208 L250 208" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M690 208 L760 208" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="290" width="360" height="118" rx="10" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.2"/><text x="130" y="318" font-size="16" font-weight="600" fill="#2765b1">生产者一次放入</text><text x="130" y="345" font-size="14" fill="#23354d">head = load_acquire(head)</text><text x="130" y="368" font-size="14" fill="#23354d">若 tail - head == 1024，等待</text><text x="130" y="391" font-size="14" fill="#23354d">buf[tail &amp; 1023] = v；store_release(tail)</text><rect x="530" y="290" width="360" height="118" rx="10" fill="#fff2df" stroke="#ad641b" stroke-width="1.2"/><text x="550" y="318" font-size="16" font-weight="600" fill="#ad641b">消费者一次取出</text><text x="550" y="345" font-size="14" fill="#23354d">tail = load_acquire(tail)</text><text x="550" y="368" font-size="14" fill="#23354d">若 head == tail，等待</text><text x="550" y="391" font-size="14" fill="#23354d">v = buf[head &amp; 1023]；store_release(head)</text><text x="40" y="440" font-size="15" fill="#53647b">每个指针只有一个写者，不需要 CAS；两侧 release 与 acquire 成对，保证“先写数据、再推进指针”。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">三种切换方式的单次成本</title><desc id="d">同一进程内换栈 193 纳秒，跨核忙等通知 188 纳秒，futex 阻塞唤醒 20 微秒。</desc><rect width="1000" height="360" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">一次“换到另一边”要多久</text><text x="40" y="80" font-size="16" fill="#53647b">同一台 2 vCPU 机器，同一对线程，只改交接方式。</text><text x="40" y="132" font-size="15" fill="#53647b">ucontext</text><rect x="200" y="116" width="120" height="26" rx="6" fill="#e9f7f1" stroke="#23775b"/><text x="340" y="135" font-size="16" fill="#23775b">193 ns</text><text x="430" y="135" font-size="14" fill="#53647b">同线程内换栈，不经过调度器</text><text x="40" y="192" font-size="15" fill="#53647b">跨核忙等</text><rect x="200" y="176" width="117" height="26" rx="6" fill="#eaf3ff" stroke="#2765b1"/><text x="340" y="195" font-size="16" fill="#2765b1">188 ns</text><text x="430" y="195" font-size="14" fill="#53647b">两个核各转各的，靠一行 store 通知</text><text x="40" y="252" font-size="15" fill="#53647b">futex</text><rect x="200" y="236" width="380" height="26" rx="6" fill="#fff2df" stroke="#ad641b"/><text x="600" y="255" font-size="16" fill="#ad641b">20 µs</text><text x="660" y="255" font-size="14" fill="#53647b">睡眠、唤醒、等调度器选中</text><text x="40" y="320" font-size="15" fill="#53647b">条形长度按对数缩放：从 193 ns 到 20 µs 相差一百倍，线性刻度会把前两条压成一条线。</text></g></svg>

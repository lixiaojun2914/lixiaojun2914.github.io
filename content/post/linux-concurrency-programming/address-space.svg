<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">进程与线程各自拥有什么</title><desc id="d">两个进程各有独立的地址空间，变量默认不共享；同一进程的多个线程共享代码、数据和堆，各自只有独立的栈。</desc><rect width="1000" height="470" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">进程与线程，各自拥有什么</text><text x="40" y="80" font-size="16" fill="#53647b">左边是两个进程，右边是一个进程里的三个线程。</text><text x="60" y="122" font-size="17" font-weight="600" fill="#2765b1">进程：各自一份地址空间</text><rect x="50" y="140" width="380" height="130" rx="10" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="70" y="166" font-size="14" fill="#2765b1">进程 1　pid=81487</text><rect x="70" y="180" width="150" height="28" rx="5" fill="#d7e7fb"/><text x="82" y="199" font-size="13" fill="#23354d">代码</text><rect x="230" y="180" width="180" height="28" rx="5" fill="#d7e7fb"/><text x="242" y="199" font-size="13" fill="#23354d">数据与堆</text><rect x="70" y="216" width="340" height="28" rx="5" fill="#c3dcf7"/><text x="82" y="235" font-size="13" fill="#23354d">栈</text><rect x="50" y="290" width="380" height="130" rx="10" fill="#eef4fc" stroke="#7fa6d0" stroke-width="1.5"/><text x="70" y="316" font-size="14" fill="#4a6f9c">进程 2　pid=81488</text><rect x="70" y="330" width="150" height="28" rx="5" fill="#dde9f8"/><text x="82" y="349" font-size="13" fill="#23354d">代码（副本）</text><rect x="230" y="330" width="180" height="28" rx="5" fill="#dde9f8"/><text x="242" y="349" font-size="13" fill="#23354d">数据与堆（副本）</text><rect x="70" y="366" width="340" height="28" rx="5" fill="#cddff4"/><text x="82" y="385" font-size="13" fill="#23354d">栈</text><text x="60" y="446" font-size="14" fill="#53647b">父进程里的变量，子进程改的是副本；两边要通过共享内存才能看到对方的改动。</text><line x1="490" y1="110" x2="490" y2="450" stroke="#c9d4e2" stroke-width="1"/><text x="540" y="122" font-size="17" font-weight="600" fill="#23775b">线程：共享一份，各有栈</text><rect x="540" y="140" width="410" height="280" rx="10" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="560" y="166" font-size="14" fill="#23775b">同一个进程　pid=81489</text><rect x="560" y="180" width="180" height="220" rx="8" fill="#d3efe4"/><text x="578" y="206" font-size="13" fill="#23354d">代码</text><text x="578" y="232" font-size="13" fill="#23354d">全局数据</text><text x="578" y="258" font-size="13" fill="#23354d">堆</text><text x="578" y="284" font-size="13" fill="#23354d">打开的文件</text><text x="578" y="330" font-size="12" fill="#3f6d5c">所有线程共用</text><rect x="760" y="180" width="170" height="60" rx="8" fill="#fff" stroke="#23775b"/><text x="778" y="205" font-size="13" fill="#23354d">线程 1 的栈</text><text x="778" y="226" font-size="12" fill="#53647b">tid=81490</text><rect x="760" y="250" width="170" height="60" rx="8" fill="#fff" stroke="#23775b"/><text x="778" y="275" font-size="13" fill="#23354d">线程 2 的栈</text><text x="778" y="296" font-size="12" fill="#53647b">tid=81491</text><rect x="760" y="320" width="170" height="60" rx="8" fill="#fff" stroke="#23775b"/><text x="778" y="345" font-size="13" fill="#23354d">线程 3 的栈</text><text x="778" y="366" font-size="12" fill="#53647b">tid=81492</text><text x="540" y="446" font-size="14" fill="#53647b">一个线程改全局变量，其他线程立刻看到；所以共享数据要加锁。</text></g></svg>

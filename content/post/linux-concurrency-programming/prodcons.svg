<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">条件变量在有界队列上的等待与唤醒</title><desc id="d">一把互斥锁保护队列的计数与下标；队列满时生产者在 not_full 上等待，队列空时消费者在 not_empty 上等待，取出或放入后再唤醒对方。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="470" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">条件变量：队列满或空时，线程等在哪</text><text x="40" y="80" font-size="16" fill="#53647b">一把锁保护队列状态，两个条件变量分别表示“可以放”和“可以取”。</text><rect x="330" y="106" width="340" height="52" rx="10" fill="#f2edfc" stroke="#7450ac" stroke-width="1.5"/><text x="352" y="138" font-size="15" fill="#7450ac">mutex：保护 count、head、tail</text><rect x="120" y="196" width="130" height="74" rx="10" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="150" y="226" font-size="16" fill="#2765b1">生产者</text><text x="150" y="250" font-size="13" fill="#53647b">put()</text><rect x="750" y="196" width="130" height="74" rx="10" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="782" y="226" font-size="16" fill="#ad641b">消费者</text><text x="782" y="250" font-size="13" fill="#53647b">get()</text><g><rect x="330" y="196" width="60" height="44" fill="#dfeaf8" stroke="#8ba9c9"/><rect x="390" y="196" width="60" height="44" fill="#dfeaf8" stroke="#8ba9c9"/><rect x="450" y="196" width="60" height="44" fill="#ffffff" stroke="#b7c4d4"/><rect x="510" y="196" width="60" height="44" fill="#ffffff" stroke="#b7c4d4"/></g><text x="345" y="224" font-size="13" fill="#3c5f85">1</text><text x="405" y="224" font-size="13" fill="#3c5f85">2</text><text x="465" y="224" font-size="13" fill="#a8b5c6">空</text><text x="525" y="224" font-size="13" fill="#a8b5c6">空</text><text x="330" y="180" font-size="13" fill="#53647b">容量 4</text><path d="M250 233 L330 233" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M570 233 L750 233" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="316" width="220" height="70" rx="10" fill="#fff7ea" stroke="#ad641b" stroke-width="1.2"/><text x="260" y="343" font-size="15" fill="#ad641b">not_full</text><text x="260" y="368" font-size="13" fill="#53647b">满了就在这里等</text><rect x="540" y="316" width="220" height="70" rx="10" fill="#f0f7ff" stroke="#2765b1" stroke-width="1.2"/><text x="560" y="343" font-size="15" fill="#2765b1">not_empty</text><text x="560" y="368" font-size="13" fill="#53647b">空了就在这里等</text><path d="M300 270 L340 316" fill="none" stroke="#ad641b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M660 316 L660 270" fill="none" stroke="#2765b1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="40" y="426" font-size="15" fill="#53647b">wait 会原子地释放锁并睡眠，醒来时重新持锁，所以判断条件必须用 while 再查一遍。</text><text x="40" y="450" font-size="15" fill="#53647b">放入一条后 signal(not_empty)，取出一条后 signal(not_full)。</text></g></svg>

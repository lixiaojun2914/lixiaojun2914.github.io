<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">计数值如何关联到不同时间基准</title><desc id="desc">计数器为单调时间累计基础和RAW基础提供输入，单调时间通过offs_real转换为墙上时间，通过offs_boot转换为包含挂起的时间。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#336aa5"/></marker></defs><rect width="1000" height="590" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#172b4d"><text x="30" y="39" text-anchor="start" font-size="24" fill="#172b4d">相同计时基础，不同累计状态与偏移</text><rect x="35" y="125" width="180" height="85" rx="10" fill="#e3eefb" stroke="#91a4bc"/><text x="125.0" y="160.5" text-anchor="middle" font-size="18" fill="#172b4d">clocksource</text><text x="125.0" y="186.5" text-anchor="middle" font-size="18" fill="#172b4d">当前计数</text><rect x="290" y="95" width="290" height="115" rx="10" fill="#e3eefb" stroke="#91a4bc"/><text x="435.0" y="132.5" text-anchor="middle" font-size="18" fill="#172b4d">tkr_mono</text><text x="435.0" y="158.5" text-anchor="middle" font-size="18" fill="#172b4d">基值 + 新计数增量</text><text x="435.0" y="184.5" text-anchor="middle" font-size="18" fill="#172b4d">应用系统计时校准</text><rect x="675" y="100" width="280" height="75" rx="10" fill="#e3eefb" stroke="#91a4bc"/><text x="815.0" y="143.5" text-anchor="middle" font-size="18" fill="#172b4d">CLOCK_MONOTONIC</text><path d="M215 160L290 150" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M580 150L675 140" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="675" y="245" width="280" height="75" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="815.0" y="288.5" text-anchor="middle" font-size="18" fill="#172b4d">CLOCK_REALTIME</text><rect x="675" y="385" width="280" height="75" rx="10" fill="#e2f3ec" stroke="#91a4bc"/><text x="815.0" y="428.5" text-anchor="middle" font-size="18" fill="#172b4d">CLOCK_BOOTTIME</text><path d="M815 175V245" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><text x="830" y="215" text-anchor="start" font-size="17" fill="#172b4d">+ offs_real</text><path d="M675 140H630V423H675" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><text x="650" y="365" text-anchor="start" font-size="17" fill="#172b4d">+ offs_boot</text><rect x="290" y="355" width="290" height="105" rx="10" fill="#eef0f4" stroke="#91a4bc"/><text x="435.0" y="387.5" text-anchor="middle" font-size="18" fill="#172b4d">tkr_raw</text><text x="435.0" y="413.5" text-anchor="middle" font-size="18" fill="#172b4d">原始速率累计基础</text><text x="435.0" y="439.5" text-anchor="middle" font-size="18" fill="#172b4d">CLOCK_MONOTONIC_RAW</text><path d="M125 210V405H290" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><text x="35" y="518" text-anchor="start" font-size="18" fill="#172b4d">offs_real 关联日历时刻；offs_boot 补入系统挂起时长。</text><text x="35" y="554" text-anchor="start" font-size="16" fill="#64748b">RAW 使用独立读取基础，不应用 NTP 频率校准；不是简单减去一个固定偏移。</text></g></svg>
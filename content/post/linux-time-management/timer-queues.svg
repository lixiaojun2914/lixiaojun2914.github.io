<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">时间轮与高精度到期队列</title><desc id="desc">普通定时器按不同粒度分桶，高精度定时器通过timerqueue按截止时间排序，两类对象由内核协调硬件事件通知。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#336aa5"/></marker></defs><rect width="1000" height="560" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#172b4d"><text x="30" y="40" text-anchor="start" font-size="24" fill="#172b4d">软件定时器：按粒度分桶，或按期限排序</text><text x="30" y="100" text-anchor="start" font-size="21" fill="#172b4d">timer_list · jiffies 期限</text><rect x="35" y="125" width="280" height="70" rx="10" fill="#e3eefb" stroke="#91a4bc"/><text x="175.0" y="166.0" text-anchor="middle" font-size="18" fill="#172b4d">较近期限 · 细粒度</text><rect x="47" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="74.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">0</text><rect x="112" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="139.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">1</text><rect x="177" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="204.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">2</text><rect x="242" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="269.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">3</text><rect x="340" y="125" width="280" height="70" rx="10" fill="#e3eefb" stroke="#91a4bc"/><text x="480.0" y="166.0" text-anchor="middle" font-size="18" fill="#172b4d">中等期限 · 较粗粒度</text><rect x="352" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="379.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">0</text><rect x="417" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="444.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">1</text><rect x="482" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="509.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">2</text><rect x="547" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="574.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">3</text><rect x="645" y="125" width="280" height="70" rx="10" fill="#e3eefb" stroke="#91a4bc"/><text x="785.0" y="166.0" text-anchor="middle" font-size="18" fill="#172b4d">更远期限 · 更粗粒度</text><rect x="657" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="684.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">0</text><rect x="722" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="749.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">1</text><rect x="787" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="814.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">2</text><rect x="852" y="215" width="55" height="43" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="879.5" y="242.5" text-anchor="middle" font-size="18" fill="#172b4d">3</text><text x="35" y="300" text-anchor="start" font-size="16" fill="#64748b">示意桶与粒度关系，不表示桶数或实际下标。</text><text x="30" y="355" text-anchor="start" font-size="21" fill="#172b4d">hrtimer · 纳秒期限 · timerqueue 有序组织</text><rect x="35" y="385" width="280" height="65" rx="10" fill="#e2f3ec" stroke="#91a4bc"/><text x="175.0" y="423.5" text-anchor="middle" font-size="18" fill="#172b4d">截止时间 D1</text><rect x="340" y="385" width="280" height="65" rx="10" fill="#e2f3ec" stroke="#91a4bc"/><text x="480.0" y="423.5" text-anchor="middle" font-size="18" fill="#172b4d">截止时间 D2</text><rect x="645" y="385" width="280" height="65" rx="10" fill="#e2f3ec" stroke="#91a4bc"/><text x="785.0" y="423.5" text-anchor="middle" font-size="18" fill="#172b4d">截止时间 D3</text><path d="M315 417L340 417" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M620 417L645 417" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><text x="35" y="495" text-anchor="start" font-size="17" fill="#172b4d">D1 ≤ D2 ≤ D3；图为排序关系，内部使用红黑树，不是按图直接串成链表。</text><text x="35" y="532" text-anchor="start" font-size="16" fill="#64748b">内核选择下一项必要事件，交给 clockevent 安排；无需每个软件定时器各占一套硬件。</text></g></svg>
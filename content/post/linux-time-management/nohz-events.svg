<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="title desc"><title id="title">NO_HZ减少空闲期间的周期节拍</title><desc id="desc">周期模式空闲时也重复产生节拍，NO_HZ可在空闲且满足条件时省去中间节拍，保留下一项必要事件，计数器仍提供经过时间。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#336aa5"/></marker></defs><rect width="980" height="460" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#172b4d"><text x="30" y="40" text-anchor="start" font-size="24" fill="#172b4d">取消不必要的周期通知，保留必要到期事件</text><text x="30" y="137" text-anchor="start" font-size="19" fill="#172b4d">周期 tick</text><path d="M200 155L935 155" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><text x="30" y="292" text-anchor="start" font-size="19" fill="#172b4d">NO_HZ 空闲</text><path d="M200 310L935 310" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M250 150L250 108" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M350 150L350 108" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M450 150L450 108" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M550 150L550 108" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M650 150L650 108" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M750 150L750 108" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M850 150L850 108" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M250 305L250 263" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M850 305L850 263" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="300" y="275" width="490" height="70" rx="10" fill="#e2f3ec" opacity="0.8"/><text x="400" y="317" text-anchor="start" font-size="18" fill="#172b4d">中间 tick 可在满足条件时省去</text><text x="220" y="380" text-anchor="start" font-size="17" fill="#172b4d">进入空闲</text><text x="770" y="380" text-anchor="start" font-size="17" fill="#172b4d">下一项必要事件</text><text x="30" y="426" text-anchor="start" font-size="18" fill="#172b4d">计数器继续提供时间；恢复处理时可按实际经过时长推进计时状态。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="title desc"><title id="title">周期事件与单次事件</title><desc id="desc">周期模式每隔固定时间发出中断。单次模式仅设定下一次事件，到期后再根据需要编程下一个事件。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#336aa5"/></marker></defs><rect width="980" height="440" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#172b4d"><text x="30" y="40" text-anchor="start" font-size="24" fill="#172b4d">周期模式与单次模式：硬件怎样产生通知</text><text x="30" y="134" text-anchor="start" font-size="19" fill="#172b4d">周期模式</text><path d="M190 160L935 160" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M230 155L230 113" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M350 155L350 113" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M470 155L470 113" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M590 155L590 113" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 155L710 113" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M830 155L830 113" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><text x="230" y="200" text-anchor="start" font-size="18" fill="#172b4d">相同间隔反复触发</text><text x="30" y="284" text-anchor="start" font-size="19" fill="#172b4d">单次模式</text><path d="M190 310L935 310" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M350 305L350 263" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 305L710 263" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><text x="280" y="350" text-anchor="start" font-size="17" fill="#172b4d">设置下一事件</text><text x="610" y="350" text-anchor="start" font-size="17" fill="#172b4d">处理后重新编程</text><text x="30" y="408" text-anchor="start" font-size="18" fill="#172b4d">单次事件也能反复安排软件周期 tick；单次模式不等于没有节拍。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">休眠到期与线程恢复时间线</title><desc id="desc">计划期限到达之后，中断交付、回调唤醒、任务进入就绪队列以及调度恢复都可能造成额外延迟。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#336aa5"/></marker></defs><rect width="1000" height="470" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#172b4d"><text x="30" y="40" text-anchor="start" font-size="24" fill="#172b4d">到期、唤醒、获得 CPU 是不同时间点</text><path d="M65 210L945 210" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><circle cx="100" cy="210" r="7" fill="#336aa5"/><text x="100" y="158" text-anchor="middle" font-size="18" fill="#172b4d">设置期限</text><text x="100" y="255" text-anchor="middle" font-size="17" fill="#172b4d">线程休眠</text><circle cx="365" cy="210" r="7" fill="#336aa5"/><text x="365" y="158" text-anchor="middle" font-size="18" fill="#172b4d">计划期限 D</text><text x="365" y="255" text-anchor="middle" font-size="17" fill="#172b4d">硬件事件到期</text><circle cx="540" cy="210" r="7" fill="#336aa5"/><text x="540" y="158" text-anchor="middle" font-size="18" fill="#172b4d">中断被处理</text><text x="540" y="255" text-anchor="middle" font-size="17" fill="#172b4d">执行到期回调</text><circle cx="715" cy="210" r="7" fill="#336aa5"/><text x="715" y="158" text-anchor="middle" font-size="18" fill="#172b4d">任务可运行</text><text x="715" y="255" text-anchor="middle" font-size="17" fill="#172b4d">等待调度</text><circle cx="905" cy="210" r="7" fill="#336aa5"/><text x="905" y="158" text-anchor="middle" font-size="18" fill="#172b4d">恢复执行</text><text x="905" y="255" text-anchor="middle" font-size="17" fill="#172b4d">返回用户态</text><path d="M365 305H905" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><text x="420" y="342" text-anchor="start" font-size="18" fill="#172b4d">观测到的额外等待可能跨越多个阶段</text><rect x="100" y="375" width="800" height="58" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="500.0" y="410.0" text-anchor="middle" font-size="18" fill="#172b4d">虚拟机还可能等待宿主机调度 vCPU；仅凭总延迟不能拆出各阶段耗时。</text></g></svg>
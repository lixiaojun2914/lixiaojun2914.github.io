<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">Linux 时间管理的读取与事件两条线</title><desc id="desc">读取线从硬件计数器经clocksource和timekeeping到时间读取接口。事件线从软件定时器队列经clockevent和硬件事件到回调与唤醒。RTC与网络校时为系统时间提供初始化和校准依据。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#336aa5"/></marker></defs><rect width="1000" height="610" rx="16" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#172b4d"><text x="30" y="39" text-anchor="start" font-size="24" fill="#172b4d">两条主线：读取现在的时间，安排未来的事件</text><text x="30" y="91" text-anchor="start" font-size="19" fill="#336aa5">读取时间</text><rect x="30" y="120" width="195" height="85" rx="10" fill="#e3eefb" stroke="#91a4bc"/><text x="127.5" y="155.5" text-anchor="middle" font-size="18" fill="#172b4d">硬件计数器</text><text x="127.5" y="181.5" text-anchor="middle" font-size="18" fill="#172b4d">持续提供计数</text><rect x="280" y="120" width="195" height="85" rx="10" fill="#e3eefb" stroke="#91a4bc"/><text x="377.5" y="155.5" text-anchor="middle" font-size="18" fill="#172b4d">clocksource</text><text x="377.5" y="181.5" text-anchor="middle" font-size="18" fill="#172b4d">读取与换算参数</text><rect x="530" y="120" width="195" height="85" rx="10" fill="#e3eefb" stroke="#91a4bc"/><text x="627.5" y="155.5" text-anchor="middle" font-size="18" fill="#172b4d">timekeeping</text><text x="627.5" y="181.5" text-anchor="middle" font-size="18" fill="#172b4d">累计值与时间基准</text><rect x="780" y="120" width="190" height="85" rx="10" fill="#e3eefb" stroke="#91a4bc"/><text x="875.0" y="142.5" text-anchor="middle" font-size="18" fill="#172b4d">读取接口</text><text x="875.0" y="168.5" text-anchor="middle" font-size="18" fill="#172b4d">clock_gettime()</text><text x="875.0" y="194.5" text-anchor="middle" font-size="18" fill="#172b4d">ktime_get*()</text><path d="M225 162L280 162" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M475 162L530 162" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M725 162L780 162" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="340" y="245" width="190" height="65" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="435.0" y="283.5" text-anchor="middle" font-size="18" fill="#172b4d">RTC · 启动日期依据</text><rect x="650" y="245" width="260" height="65" rx="10" fill="#fef0d9" stroke="#91a4bc"/><text x="780.0" y="283.5" text-anchor="middle" font-size="18" fill="#172b4d">网络校时 · 偏差与速率校准</text><path d="M530 265L580 205" fill="none" stroke="#336aa5" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M710 245L680 205" fill="none" stroke="#336aa5" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="30" y="365" text-anchor="start" font-size="19" fill="#227c69">触发事件</text><rect x="30" y="390" width="195" height="85" rx="10" fill="#e2f3ec" stroke="#91a4bc"/><text x="127.5" y="425.5" text-anchor="middle" font-size="18" fill="#172b4d">软件定时器队列</text><text x="127.5" y="451.5" text-anchor="middle" font-size="18" fill="#172b4d">期限与回调</text><rect x="280" y="390" width="195" height="85" rx="10" fill="#e2f3ec" stroke="#91a4bc"/><text x="377.5" y="425.5" text-anchor="middle" font-size="18" fill="#172b4d">clockevent</text><text x="377.5" y="451.5" text-anchor="middle" font-size="18" fill="#172b4d">编程下一次事件</text><rect x="530" y="390" width="195" height="85" rx="10" fill="#e2f3ec" stroke="#91a4bc"/><text x="627.5" y="425.5" text-anchor="middle" font-size="18" fill="#172b4d">硬件定时事件</text><text x="627.5" y="451.5" text-anchor="middle" font-size="18" fill="#172b4d">到期产生中断</text><rect x="780" y="390" width="190" height="85" rx="10" fill="#e2f3ec" stroke="#91a4bc"/><text x="875.0" y="425.5" text-anchor="middle" font-size="18" fill="#172b4d">内核处理</text><text x="875.0" y="451.5" text-anchor="middle" font-size="18" fill="#172b4d">回调 / 唤醒</text><path d="M225 432L280 432" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M475 432L530 432" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M725 432L780 432" fill="none" stroke="#336aa5" stroke-width="2.4" marker-end="url(#arrow)"/><text x="30" y="534" text-anchor="start" font-size="18" fill="#172b4d">读时间不要求先发生一次中断；创建软件定时器也不等于独占一个硬件定时器。</text><text x="30" y="574" text-anchor="start" font-size="16" fill="#64748b">图为职责关系；实际实现还涉及每 CPU 状态、事件重新编程及不同处理上下文。</text></g></svg>
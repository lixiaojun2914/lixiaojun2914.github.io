<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="t d"><title id="t">命名入口消失，不等于对象立即释放</title><desc id="d">进程和命名挂载入口都可能维持网络命名空间引用。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="480" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">命名入口消失，不等于对象立即释放</text><rect x="45" y="100" width="300" height="110" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="63" y="131" font-size="19" fill="#2765b1">sleep 进程</text><text x="63" y="158" font-size="16" fill="#53647b">/proc/PID/ns/net</text><rect x="45" y="300" width="300" height="110" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="63" y="331" font-size="19" fill="#ad641b">/run/netns/nslab-a</text><text x="63" y="358" font-size="16" fill="#53647b">命名挂载入口，删除此路径</text><rect x="630" y="180" width="320" height="160" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="648" y="211" font-size="19" fill="#23775b">同一个 struct net</text><text x="648" y="238" font-size="16" fill="#53647b">自己的 lo / 设备 / 路由</text><text x="648" y="262" font-size="16" fill="#53647b">进程引用仍可维持它</text><path d="M345 155 L630 220" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="495.5" y="177.5" font-size="14" fill="#53647b">进程引用</text><path d="M345 355 L630 290" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="495.5" y="312.5" font-size="14" fill="#53647b">挂载引用</text><text x="40" y="450" font-size="16" fill="#53647b">删除下面一条引用后，还能通过活着的进程 nsenter 进入。</text></g></svg>
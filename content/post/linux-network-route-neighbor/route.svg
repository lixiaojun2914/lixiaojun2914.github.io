<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">路由选择下一跳，邻居定位当前链路端点</title><desc id="d">A 寻找网关 MAC，R 再在另一个网段寻找 B；原始源目的 IP 保留。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="430" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">路由选择下一跳，邻居定位当前链路端点</text><rect x="35" y="110" width="250" height="150" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="53" y="141" font-size="19" fill="#2765b1">A / a0</text><text x="53" y="168" font-size="16" fill="#53647b">10.77.1.1/24</text><text x="53" y="192" font-size="16" fill="#53647b">下一跳 10.77.1.254</text><rect x="375" y="110" width="250" height="150" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="393" y="141" font-size="19" fill="#ad641b">R / ra + rb</text><text x="393" y="168" font-size="16" fill="#53647b">ra：10.77.1.254</text><text x="393" y="192" font-size="16" fill="#53647b">rb：10.77.2.254</text><rect x="715" y="110" width="250" height="150" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="733" y="141" font-size="19" fill="#23775b">B / b0</text><text x="733" y="168" font-size="16" fill="#53647b">10.77.2.2/24</text><text x="733" y="192" font-size="16" fill="#53647b">回程经 10.77.2.254</text><path d="M285 190 L375 190" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M625 190 L715 190" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="40" y="320" font-size="17" fill="#53647b">A 的邻居：R 的 ra MAC</text><text x="535" y="320" font-size="17" fill="#53647b">R 的邻居：B 的 b0 MAC</text><text x="40" y="380" font-size="16" fill="#53647b">错误 /32 dev a0 会把 B 当成直连邻居，覆盖正确默认路由。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 327" role="img" aria-labelledby="title">
<g font-family="system-ui, sans-serif">
<title id="title">页表转换页号，页内偏移保留</title>
<rect width="760" height="327" rx="20" fill="#f8fafc"/>
<text x="28" y="42" fill="#0f172a" font-size="26" font-weight="700">页表转换页号，页内偏移保留</text>
<text x="28" y="98" fill="#334155" font-size="20" font-weight="600">虚拟地址</text>
<rect x="200.0" y="66" width="261.0" height="54" rx="10" fill="#dbeafe"/>
<text x="330.5" y="100" fill="#1e3a8a" font-size="21" font-weight="600" text-anchor="middle">VPN 0x12</text>
<rect x="471.0" y="66" width="261.0" height="54" rx="10" fill="#fef3c7"/>
<text x="601.5" y="100" fill="#78350f" font-size="21" font-weight="600" text-anchor="middle">偏移 0x345</text>
<text x="28" y="181" fill="#334155" font-size="20" font-weight="600">映射关系 ↓</text>
<rect x="200.0" y="149" width="532.0" height="54" rx="10" fill="#e2e8f0"/>
<text x="466.0" y="183" fill="#334155" font-size="21" font-weight="600" text-anchor="middle">VPN 0x12  →  PFN 0xAB</text>
<text x="28" y="264" fill="#334155" font-size="20" font-weight="600">物理地址</text>
<rect x="200.0" y="232" width="261.0" height="54" rx="10" fill="#ccfbf1"/>
<text x="330.5" y="266" fill="#134e4a" font-size="21" font-weight="600" text-anchor="middle">PFN 0xAB</text>
<rect x="471.0" y="232" width="261.0" height="54" rx="10" fill="#fef3c7"/>
<text x="601.5" y="266" fill="#78350f" font-size="21" font-weight="600" text-anchor="middle">偏移 0x345</text>
</g>
</svg>

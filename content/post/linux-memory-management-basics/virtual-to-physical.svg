<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 327" role="img" aria-labelledby="title">
<g font-family="system-ui, sans-serif">
<title id="title">虚拟页相邻，物理页帧可以分散</title>
<rect width="760" height="327" rx="20" fill="#f8fafc"/>
<text x="28" y="42" fill="#0f172a" font-size="26" font-weight="700">虚拟页相邻，物理页帧可以分散</text>
<text x="28" y="98" fill="#334155" font-size="20" font-weight="600">虚拟地址 →</text>
<rect x="200.0" y="66" width="125.5" height="54" rx="10" fill="#dbeafe"/>
<text x="262.75" y="100" fill="#1e3a8a" font-size="21" font-weight="600" text-anchor="middle">0x12</text>
<rect x="335.5" y="66" width="125.5" height="54" rx="10" fill="#ccfbf1"/>
<text x="398.25" y="100" fill="#134e4a" font-size="21" font-weight="600" text-anchor="middle">0x13</text>
<rect x="471.0" y="66" width="125.5" height="54" rx="10" fill="#fef3c7"/>
<text x="533.75" y="100" fill="#78350f" font-size="21" font-weight="600" text-anchor="middle">0x14</text>
<rect x="606.5" y="66" width="125.5" height="54" rx="10" fill="#e2e8f0"/>
<text x="669.25" y="100" fill="#334155" font-size="21" font-weight="600" text-anchor="middle">0x15</text>
<text x="28" y="181" fill="#334155" font-size="20" font-weight="600">页表对应</text>
<rect x="200.0" y="149" width="125.5" height="54" rx="10" fill="#dbeafe"/>
<text x="262.75" y="183" fill="#1e3a8a" font-size="21" font-weight="600" text-anchor="middle">→ 0xAB</text>
<rect x="335.5" y="149" width="125.5" height="54" rx="10" fill="#ccfbf1"/>
<text x="398.25" y="183" fill="#134e4a" font-size="21" font-weight="600" text-anchor="middle">→ 0x28</text>
<rect x="471.0" y="149" width="125.5" height="54" rx="10" fill="#fef3c7"/>
<text x="533.75" y="183" fill="#78350f" font-size="21" font-weight="600" text-anchor="middle">待建立</text>
<rect x="606.5" y="149" width="125.5" height="54" rx="10" fill="#e2e8f0"/>
<text x="669.25" y="183" fill="#334155" font-size="21" font-weight="600" text-anchor="middle">待建立</text>
<text x="28" y="264" fill="#334155" font-size="20" font-weight="600">物理地址 →</text>
<rect x="200.0" y="232" width="170.66666666666666" height="54" rx="10" fill="#ccfbf1"/>
<text x="285.3333333333333" y="266" fill="#134e4a" font-size="21" font-weight="600" text-anchor="middle">PFN 0x28</text>
<rect x="380.66666666666663" y="232" width="170.66666666666666" height="54" rx="10" fill="#e2e8f0"/>
<text x="465.99999999999994" y="266" fill="#334155" font-size="21" font-weight="600" text-anchor="middle">其他页帧</text>
<rect x="561.3333333333333" y="232" width="170.66666666666666" height="54" rx="10" fill="#dbeafe"/>
<text x="646.6666666666666" y="266" fill="#1e3a8a" font-size="21" font-weight="600" text-anchor="middle">PFN 0xAB</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" role="img" aria-labelledby="title">
  <title id="title">伙伴分配器从 order 0 逐阶合并到 order 2</title>
  <rect width="720" height="252" rx="18" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="24" y="38" font-size="24" font-weight="700">从 PFN 64 释放到四页合并</text>
    <g font-size="19" font-weight="600">

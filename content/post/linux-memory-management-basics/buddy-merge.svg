      <text x="24" y="154">第一次合并</text>
      <text x="24" y="217">第二次合并</text>
    </g>
    <rect x="160" y="64" width="128" height="44" rx="8" fill="#bfdbfe"/>
    <rect x="296" y="64" width="128" height="44" rx="8" fill="#bfdbfe"/>
    <rect x="432" y="64" width="264" height="44" rx="8" fill="#ccfbf1"/>
    <rect x="160" y="127" width="264" height="44" rx="8" fill="#ccfbf1"/>
    <rect x="432" y="127" width="264" height="44" rx="8" fill="#ccfbf1"/>
    <rect x="160" y="190" width="536" height="44" rx="8" fill="#fde68a"/>
    <g font-size="18" text-anchor="middle">
      <text x="224" y="92">64</text>
      <text x="360" y="92">65</text>
      <text x="564" y="92">66–67 · order 1</text>
      <text x="292" y="155">64–65 · order 1</text>
      <text x="564" y="155">66–67 · order 1</text>
      <text x="428" y="218">64–67 · order 2</text>

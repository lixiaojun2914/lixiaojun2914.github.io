<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" role="img" aria-labelledby="t d"><title id="t">多个入口，对应同一层级中的不同对象</title><desc id="d">总线入口指向PCI设备，class入口指向网络接口设备，网络接口的device链接指向PCI父设备。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1140" height="660" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">多个入口，对应同一层级中的不同对象</text><text x="35" y="91" font-size="22" fill="#17324f">分类与查找入口</text><text x="620" y="91" font-size="22" fill="#17324f">/sys/devices 中的对象位置</text><rect x="30" y="125" width="480" height="100" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="48" y="156" font-size="21" fill="#17324f">/sys/bus/pci/devices/</text><text x="48" y="185" font-size="21" fill="#17324f">0000:02:00.0</text><rect x="610" y="125" width="500" height="100" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="628" y="156" font-size="21" fill="#17324f">PCI 设备对象：0000:02:00.0</text><text x="628" y="185" font-size="21" fill="#17324f">位于根桥与 PCI 桥下面</text><path d="M510 175L608 175" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="30" y="365" width="480" height="100" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="48" y="396" font-size="21" fill="#17324f">/sys/class/net/enp2s0</text><text x="48" y="425" font-size="21" fill="#17324f">按网络功能分类的入口</text><rect x="610" y="365" width="500" height="100" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="628" y="396" font-size="21" fill="#17324f">网络接口对象：enp2s0</text><text x="628" y="425" font-size="21" fill="#17324f">位于 PCI 设备的 net/enp2s0 下</text><path d="M510 415L608 415" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M855 363L855 227" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="875" y="290" font-size="18" fill="#17324f">device 链接</text><text x="875" y="320" font-size="18" fill="#17324f">关联底层设备</text><rect x="30" y="520" width="1080" height="88" rx="10" fill="#f6ecd9" stroke="#9eafc2"/><text x="48" y="551" font-size="20" fill="#17324f">两个设备对象，各有自己的通用 device 部分。</text><text x="48" y="580" font-size="20" fill="#17324f">bus 与 class 是不同观察维度；这些目录不是多份硬件。</text></g></svg>
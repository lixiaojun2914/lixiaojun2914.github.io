<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="t d"><title id="t">cat 属性文件，实际在请求内核组织输出</title><desc id="d">用户cat读取sysfs文件，sysfs和kernfs转到device属性show回调，网络子系统读取MTU并输出文本。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1080" height="630" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">cat 属性文件，实际在请求内核组织输出</text><rect x="90" y="100" width="900" height="75" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="108" y="131" font-size="22" fill="#17324f">cat /sys/class/net/enp2s0/mtu</text><path d="M540 175L540 203" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="90" y="205" width="900" height="75" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="108" y="236" font-size="22" fill="#17324f">VFS → sysfs / kernfs 文件操作</text><path d="M540 280L540 308" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="90" y="310" width="900" height="75" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="108" y="341" font-size="22" fill="#17324f">device 属性 show 回调 → 网络子系统状态</text><path d="M540 385L540 413" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="90" y="415" width="900" height="75" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="108" y="446" font-size="22" fill="#17324f">格式化 MTU，返回文本 1500</text><text x="90" y="570" font-size="18" fill="#17324f">文件是属性访问接口；不是用户进程预先写好的状态文本，也不是直接暴露整块结构体。</text></g></svg>
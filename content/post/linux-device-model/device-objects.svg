<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 740" role="img" aria-labelledby="t d"><title id="t">通用对象嵌在专用对象里，关系由不同字段表达</title><desc id="d">pci_dev和net_device各自内嵌device和kobject。PCI设备关联总线与驱动，网络接口归属net类，parent关联底层设备。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#456d98"/></marker></defs><rect width="1160" height="740" rx="18" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif" fill="#17324f"><text x="30" y="44" font-size="25" fill="#17324f">通用对象嵌在专用对象里，关系由不同字段表达</text><rect x="55" y="105" width="560" height="190" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="73" y="136" font-size="21" fill="#17324f">struct pci_dev</text><text x="73" y="165" font-size="21" fill="#17324f">    dev：struct device</text><text x="73" y="194" font-size="21" fill="#17324f">        kobj：名称、层级、引用等基础设施</text><text x="73" y="223" font-size="21" fill="#17324f">        bus / driver：总线与驱动关系</text><rect x="775" y="105" width="330" height="80" rx="10" fill="#e8e4f4" stroke="#9eafc2"/><text x="793" y="136" font-size="21" fill="#17324f">pci_bus_type</text><path d="M615 145L773 145" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="775" y="215" width="330" height="80" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="793" y="246" font-size="20" fill="#17324f">e1000e 通用驱动对象</text><path d="M615 255L773 255" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="55" y="420" width="560" height="190" rx="10" fill="#e3eefb" stroke="#9eafc2"/><text x="73" y="451" font-size="21" fill="#17324f">struct net_device</text><text x="73" y="480" font-size="21" fill="#17324f">    dev：struct device</text><text x="73" y="509" font-size="21" fill="#17324f">        kobj：名称、层级、引用等基础设施</text><text x="73" y="538" font-size="21" fill="#17324f">        parent / class：父设备与功能分类</text><rect x="775" y="470" width="330" height="95" rx="10" fill="#e0f1e8" stroke="#9eafc2"/><text x="793" y="501" font-size="21" fill="#17324f">net_class</text><text x="793" y="530" font-size="21" fill="#17324f">/sys/class/net</text><path d="M615 515L773 515" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M200 418L200 297" fill="none" stroke="#456d98" stroke-width="2.2" marker-end="url(#arrow)"/><text x="220" y="354" font-size="19" fill="#17324f">parent 关联 PCI 设备的 dev</text><text x="55" y="678" font-size="20" fill="#17324f">嵌入不是复制：专用子系统维护完整对象，通用设备框架操作其中的 device。</text></g></svg>
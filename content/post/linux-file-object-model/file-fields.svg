<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" role="img" aria-labelledby="title desc">
  <title id="title">struct file 的字段与对象关系</title>
  <desc id="desc">fd 表项指向 struct file。f_pos 保存在打开实例中，f_path 包含挂载和 dentry，f_inode 指向 inode，f_op 指向操作表。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="620" height="280" rx="16" fill="#f1f5f9"/>
  <g fill="#fff" stroke="#94a3b8">
    <rect x="20" y="89" width="112" height="42" rx="8"/>
    <rect x="340" y="89" width="260" height="42" rx="8"/>
    <rect x="340" y="147" width="260" height="42" rx="8"/>
    <rect x="340" y="205" width="260" height="42" rx="8"/>
  </g>
  <rect x="168" y="24" width="136" height="232" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M132 110H164"/>
    <path d="M304 110H336"/>
    <path d="M304 168H336"/>
    <path d="M304 226H336"/>
  </g>
  <g fill="#172554" font-family="monospace" font-size="16" text-anchor="middle" dominant-baseline="middle">
    <text x="76" y="110">fd[n]</text>
    <text x="236" y="50" font-weight="bold">struct file</text>
    <text x="236" y="76" fill="#1d4ed8">f_pos</text>
    <text x="236" y="110">f_path</text>
    <text x="236" y="168">f_inode</text>
    <text x="236" y="226">f_op</text>
    <text x="470" y="110">vfsmount + dentry</text>
    <text x="470" y="168">inode → i_sb → super_block</text>
    <text x="470" y="226">file_operations</text>
  </g>
</svg>

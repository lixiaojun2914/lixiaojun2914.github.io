<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Netfilter：三条路径，共用不同 hook</title><desc id="d">接收经 prerouting 后区分本地 input 或 forward；本机发送经过 output。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="600" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">Netfilter：三条路径，共用不同 hook</text><rect x="35" y="100" width="210" height="90" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="53" y="131" font-size="19" fill="#2765b1">设备接收</text><rect x="335" y="100" width="270" height="90" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="353" y="131" font-size="19" fill="#23775b">prerouting → 路由</text><path d="M245 145 L335 145" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="705" y="100" width="250" height="90" rx="12" fill="#f2edfc" stroke="#7450ac" stroke-width="1.5"/><text x="723" y="131" font-size="19" fill="#7450ac">input → 本机协议</text><path d="M605 145 L705 145" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="335" y="300" width="270" height="90" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="353" y="331" font-size="19" fill="#ad641b">forward</text><path d="M470 190 L470 300" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="300" width="210" height="90" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="53" y="331" font-size="19" fill="#2765b1">本机 → output</text><rect x="705" y="300" width="250" height="90" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="723" y="331" font-size="19" fill="#23775b">postrouting</text><path d="M605 345 L705 345" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M140 390 V440 H830 V390" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><rect x="705" y="480" width="250" height="80" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="723" y="511" font-size="19" fill="#2765b1">邻居 / 设备输出</text><path d="M830 390 L830 480" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/></g></svg>
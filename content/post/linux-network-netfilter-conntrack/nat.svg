<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">SNAT：原始方向与回复方向关联</title><desc id="d">A 的原始源地址保存在跟踪元组中，B 看到转换后的 R 地址。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="400" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">SNAT：原始方向与回复方向关联</text><rect x="35" y="110" width="250" height="140" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="53" y="141" font-size="19" fill="#2765b1">A</text><text x="53" y="168" font-size="16" fill="#53647b">10.77.1.1:46630</text><text x="53" y="192" font-size="16" fill="#53647b">目的 B:18084</text><rect x="375" y="110" width="250" height="140" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="393" y="141" font-size="19" fill="#ad641b">R / SNAT</text><text x="393" y="168" font-size="16" fill="#53647b">源改为 10.77.2.254</text><text x="393" y="192" font-size="16" fill="#53647b">维护双向关联</text><rect x="715" y="110" width="250" height="140" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="733" y="141" font-size="19" fill="#23775b">B</text><text x="733" y="168" font-size="16" fill="#53647b">10.77.2.2:18084</text><text x="733" y="192" font-size="16" fill="#53647b">peer 是 R:46630</text><path d="M285 180 L375 180" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><path d="M625 180 L715 180" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="40" y="315" font-size="17" fill="#53647b">原始元组：A:46630 → B:18084</text><text x="40" y="355" font-size="17" fill="#53647b">回复元组：B:18084 → R:46630；R 根据转换关联处理回程。</text></g></svg>
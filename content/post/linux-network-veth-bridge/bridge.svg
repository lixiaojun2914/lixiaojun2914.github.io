<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="t d"><title id="t">从直连到交换：veth 交接，bridge 学习与转发</title><desc id="d">三对 veth 的交换侧端口加入 br0，FDB 将目的 MAC 映射到端口。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7b91"/></marker></defs><rect width="1000" height="530" rx="18" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#23354d"><text x="40" y="48" font-size="24" font-weight="700">从直连到交换：veth 交接，bridge 学习与转发</text><rect x="45" y="100" width="240" height="100" rx="12" fill="#eaf3ff" stroke="#2765b1" stroke-width="1.5"/><text x="63" y="131" font-size="19" fill="#2765b1">A / a0</text><text x="63" y="158" font-size="16" fill="#53647b">10.77.1.1</text><rect x="380" y="100" width="240" height="100" rx="12" fill="#e9f7f1" stroke="#23775b" stroke-width="1.5"/><text x="398" y="131" font-size="19" fill="#23775b">B / b0</text><text x="398" y="158" font-size="16" fill="#53647b">10.77.1.2</text><rect x="715" y="100" width="240" height="100" rx="12" fill="#f2edfc" stroke="#7450ac" stroke-width="1.5"/><text x="733" y="131" font-size="19" fill="#7450ac">C / c0</text><text x="733" y="158" font-size="16" fill="#53647b">10.77.1.3</text><rect x="155" y="330" width="690" height="130" rx="12" fill="#fff2df" stroke="#ad641b" stroke-width="1.5"/><text x="173" y="361" font-size="19" fill="#ad641b">nslab-r：br0</text><text x="173" y="388" font-size="16" fill="#53647b">pa ← A MAC      pb ← B MAC      pc ← C MAC</text><text x="173" y="412" font-size="16" fill="#53647b">学习源地址；已知单播按 FDB 选端口</text><path d="M165 200 L240 330" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="210.5" y="255.0" font-size="14" fill="#53647b">pa</text><path d="M500 200 L500 330" fill="none" stroke="#6b7b91" stroke-width="2" marker-end="url(#a)"/><text x="508.0" y="255.0" font-
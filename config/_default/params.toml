mainSections = ["post"]
rssFullContent = true
favicon = "img/avatar.png"

[footer]
    since = 2020

[dateFormat]
    published = "2006-01-02"
    lastUpdated = "2006-01-02 15:04 MST"

[sidebar]
    emoji = "🍥"
    subtitle = "记录学习的技能和遇到的问题"
    avatar = "img/avatar.png"

[article]
    math = true
    toc = true
    readingTime = true
    headingAnchor = true

    [article.license]
        enabled = true
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 15 } },
    ]
    page = [{ type = "toc" }]

[colorScheme]
    toggle = true
    default = "auto"

[comments]
    # Old Waline returns HTTP 500: LeanCloud app archived. Restore it before enabling.
    enabled = false
    provider = "waline"

    [comments.waline]
        serverURL = "https://blog-waline-lixiaojun2914.vercel.app"
        lang = "zh-CN"
        requiredMeta = ["name", "email"]
        emoji = ["https://cdn.jsdelivr.net/gh/walinejs/emojis/weibo"]
